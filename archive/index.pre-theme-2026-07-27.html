<style>
/* ============================================================================
   DARK CINEMATIC — redesigned 2026-07-27.
   The previous light "playful" palette is in archive\index.pre-redesign-2026-07-27.html.

   Three things this token set has to get right, because the old one conflated them:
     --tx     text. Near-white, never used for borders.
     --line*  hairlines. Translucent white, never used for text.
     --fill   solid fills that used to be dark ink on white (buttons, table heads).
   In the light theme all three were --ink. On dark they must diverge or every
   border turns bright white and every filled button turns into a white slab.

   The four MODULE COLOURS ARE UNCHANGED — they are shared with the Notion
   workspace and the PDF schedule, and they read stronger on navy than they did
   on the old near-white background.
   ============================================================================ */
:root{
  /* text ramp — light on dark */
  --tx:#e9f0fa;
  --ink:#e9f0fa;
  --ink-2:#b9c6d8;
  --ink-3:#8496ad;
  --ink-4:#8194ac;   /* lifted from #61738b: at 10-11px it measured 3.54:1 on a
                        card, under the 4.5:1 AA floor. Now ~5.2:1. */

  /* ground and surfaces, each step a little lighter than the last */
  --bg:#070d16;
  --bg-2:#111f31;
  --card:#101c2c;
  --fill:#22344b;
  --glass:rgba(18,32,50,.72);
  --glass-2:rgba(14,25,40,.8);

  /* hairlines, not ink */
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.13);

  --rail:#0a1422;
  --rail-2:#16283e;
  --rail-3:#26405e;
  --rail-text:#9fb2c9;

  /* module colours — DO NOT CHANGE, shared with Notion and the PDF schedule */
  --ent:#ff5a5f;
  --ophtho:#00b37e;
  --neuro:#8b5cf6;
  --peds:#3b82f6;
  --revision:#8496ad;
  --buffer:#f59e0b;

  /* state colours, brightened for dark; the -bg tints are now translucent
     washes over the dark ground rather than pale pastels */
  --ok:#22c98a;
  --ok-bg:rgba(34,201,138,.14);
  --bad:#ff5a6a;
  --bad-bg:rgba(255,90,106,.14);
  --gold:#ffc94a;
  --gold-bg:rgba(255,201,74,.14);
  --on-accent:#0a1220;

  --r:16px;
  --r-sm:11px;
  /* was a hard 3px offset; now soft elevation */
  --pop:0 7px 18px;
  --pop-lg:0 14px 34px;
  --glow:0 0 0 1px rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito","Quicksand",-apple-system,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 8%, rgba(139,92,246,.05) 0, transparent 42%),
                   radial-gradient(circle at 88% 4%, rgba(59,130,246,.05) 0, transparent 38%);
  background-attachment:fixed;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--neuro);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:238px;flex-shrink:0;background:var(--rail);color:var(--rail-text);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:3px solid #150f33;
}
.rail-head{padding:20px 16px 12px}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:900;letter-spacing:-.03em;font-size:19px}
.logo .blip{
  width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--ent),var(--gold));
  display:flex;align-items:center;justify-content:center;font-size:14px;
  box-shadow:0 5px 14px rgba(0,0,0,.28);flex-shrink:0;transform:rotate(-6deg);
}
.rail-sub{font-size:10.5px;color:#7d75ab;margin-top:4px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}

.streak{
  margin:8px 12px 4px;padding:10px 12px;border-radius:12px;
  background:linear-gradient(135deg,rgba(255,201,74,.16),rgba(255,90,95,.13));
  border:1.5px solid rgba(255,201,74,.3);display:flex;align-items:center;gap:9px;
}
.streak .fl{font-size:17px}
.streak .n{color:#ffd977;font-weight:900;font-size:16px;line-height:1}
.streak .t{font-size:10.5px;color:#a89fd4;line-height:1.25;font-weight:600}

.nav{padding:6px 10px 20px;flex:1}
.nav-label{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#6a619a;padding:15px 8px 6px;font-weight:800}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border-radius:11px;color:var(--rail-text);font-size:13.5px;font-weight:600;
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),background .13s,color .13s;
}
.nav-item:hover{background:var(--rail-2);color:#fff;transform:translateX(3px)}
.nav-item.on{background:var(--rail-3);color:#fff;font-weight:800;box-shadow:inset 3px 0 0 var(--gold)}
.nav-item .ic{width:19px;text-align:center;flex-shrink:0;font-size:15px}
.nav-item .cnt{margin-left:auto;font-size:11px;color:#7d75ab;font-variant-numeric:tabular-nums;font-weight:700}
.nav-item.on .cnt{color:#c2bbe4}
.badge-due{
  margin-left:auto;background:var(--ent);color:#fff;font-size:10.5px;font-weight:900;
  padding:2px 7px;border-radius:20px;min-width:20px;text-align:center;
  box-shadow:0 0 0 3px rgba(255,90,95,.2);
}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:13px 26px;
  border-bottom:1px solid var(--line);background:var(--glass-2);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
}
.search-wrap{position:relative;flex:1;max-width:440px}
.search{
  width:100%;padding:9px 13px 9px 35px;border:2px solid var(--line-2);border-radius:12px;
  background:var(--card);font-size:13.5px;color:var(--tx);font-weight:600;transition:box-shadow .14s,border-color .14s;
}
.search:focus{border-color:var(--neuro);box-shadow:var(--pop) rgba(139,92,246,.3);outline:none}
.search::placeholder{color:var(--ink-4);font-weight:500}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.results{
  position:absolute;top:calc(100% + 7px);left:0;right:0;background:var(--card);
  border:2px solid var(--line-2);border-radius:14px;box-shadow:var(--pop-lg) rgba(0,0,0,.18);
  max-height:380px;overflow-y:auto;z-index:40;display:none;
}
.results.show{display:block}
.res-item{padding:11px 14px;border-bottom:1.5px solid var(--line);cursor:pointer;font-size:13px}
.res-item:last-child{border-bottom:none}
.res-item:hover{background:var(--bg-2)}
.res-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;margin-bottom:3px}
.res-txt{color:var(--ink-2);line-height:1.45}
.res-empty{padding:16px 14px;color:var(--ink-4);font-size:13px}

.topbar-actions{margin-left:auto;display:flex;gap:7px;align-items:center}
.tb-btn{padding:7px 12px;border-radius:10px;font-size:12.5px;color:var(--ink-3);font-weight:700;transition:background .13s,transform .13s}
.tb-btn:hover{background:var(--bg-2);color:var(--tx);transform:translateY(-1px)}

.page{padding:28px;max-width:1180px;width:100%;margin:0 auto;flex:1}

/* ---------- Type ---------- */
h1{font-size:31px;font-weight:900;letter-spacing:-.035em;margin:0 0 5px;line-height:1.1}
h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 0 13px}
.page-sub{color:var(--ink-3);font-size:14px;margin:0 0 26px;font-weight:500;max-width:640px;line-height:1.55}
.eyebrow{
  display:inline-block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:900;
  padding:4px 11px;border-radius:20px;background:var(--fill);color:#fff;margin-bottom:11px;
  transform:rotate(-1.2deg);
}

/* ---------- Cards ---------- */
.grid{display:grid;gap:15px}
.g3{grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.card{
  background:var(--card);border:2.5px solid var(--line-2);border-radius:var(--r);
  padding:17px;text-align:left;width:100%;box-shadow:var(--pop) rgba(0,0,0,.16);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s;
}
button.card:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:var(--pop-lg) var(--c,rgba(0,0,0,.3))}
button.card:active:not(:disabled){transform:translate(1px,1px);box-shadow:0 2px 7px rgba(0,0,0,.2)}

.mod-card{position:relative;overflow:hidden}
.mod-card::after{
  content:"";position:absolute;right:-24px;top:-24px;width:74px;height:74px;border-radius:50%;
  background:var(--c);opacity:.11;
}
.mod-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mod-ic{
  width:36px;height:36px;border-radius:11px;background:var(--c);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 5px 14px rgba(0,0,0,.2);
}
.mod-name{font-weight:900;font-size:16.5px;letter-spacing:-.02em}
.mod-meta{font-size:12px;color:var(--ink-3);margin-bottom:13px;font-weight:600}

.ringrow{display:flex;align-items:center;gap:13px}
.ring{width:52px;height:52px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rv{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums;
}
.ringmeta{flex:1;min-width:0}
.ringmeta .a{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.ringmeta .b{font-size:11.5px;color:var(--ink-3);font-weight:600}

.stat{
  background:var(--card);border:2.5px solid var(--line-2);border-radius:var(--r);padding:15px;
  box-shadow:var(--pop) rgba(0,0,0,.16);position:relative;overflow:hidden;
}
.stat .n{font-size:31px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-weight:700}
.stat .emo{position:absolute;right:11px;top:10px;font-size:19px;opacity:.3}

/* ---------- Chapter rows ---------- */
.grouphdr{
  display:flex;align-items:center;gap:10px;margin:24px 0 11px;
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:900;color:var(--ink-3);
}
.grouphdr::after{content:"";flex:1;height:2.5px;background:var(--line);border-radius:3px}
.ch-row{
  display:flex;align-items:center;gap:13px;padding:12px 15px;background:var(--card);
  border:2.5px solid var(--line-2);border-radius:13px;margin-bottom:9px;width:100%;text-align:left;
  box-shadow:0 5px 14px rgba(0,0,0,.13);
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s;
}
.ch-row:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.ch-row:disabled{opacity:.45;cursor:default;box-shadow:none;border-style:dashed}
.ch-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2px solid var(--line-2)}
.ch-name{flex:1;font-size:14px;font-weight:700}
.ch-count{font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums;font-weight:700}
.ch-acc{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

/* ---------- Question ---------- */
.qwrap{max-width:830px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:17px;flex-wrap:wrap}
.pill{
  font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;
  border-radius:20px;color:#fff;border:2px solid var(--line-2);box-shadow:0 5px 14px rgba(0,0,0,.18);
}
.pill.ghost{background:var(--bg-2);color:var(--ink-3)}
.qprog{
  margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:800;
  background:var(--card);padding:4px 11px;border-radius:20px;border:2px solid var(--line-2);
}

.qcard{background:var(--card);border:3px solid var(--line-2);border-radius:20px;padding:27px 29px;box-shadow:0 15px 35px rgba(0,0,0,.15)}
.stem{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:16.5px;line-height:1.64;color:var(--tx);margin-bottom:21px;
}
.stem p{margin:0 0 12px}
.stem p:last-child{margin-bottom:0}
.stem table{border-collapse:separate;border-spacing:0;width:100%;margin:13px 0;font-size:13px;font-family:"Nunito",sans-serif;border:2px solid var(--line-2);border-radius:10px;overflow:hidden}
.stem th,.stem td{border-bottom:1.5px solid var(--line);padding:7px 10px;text-align:left}
.stem th{background:var(--bg-2);font-weight:800}
.stem tr:last-child td{border-bottom:none}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:13px;align-items:flex-start;padding:13px 16px;
  border:2.5px solid var(--line-2);border-radius:13px;background:var(--card);
  text-align:left;width:100%;line-height:1.5;font-weight:600;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),border-color .12s,box-shadow .12s;
}
.opt:hover:not(:disabled){border-color:var(--line-2);transform:translateX(4px);box-shadow:0 7px 20px rgba(0,0,0,.12)}
.opt:disabled{cursor:default}
.opt .ltr{
  width:26px;height:26px;border-radius:9px;border:2.5px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;
  flex-shrink:0;color:var(--ink-3);margin-top:1px;transition:all .12s;
}
.opt.sel{border-color:var(--neuro);background:rgba(139,92,246,.15);transform:translateX(4px);box-shadow:0 7px 20px rgba(139,92,246,.28)}
.opt.sel .ltr{background:var(--neuro);border-color:var(--neuro);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 7px 20px rgba(0,168,107,.25)}
.opt.correct .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 7px 20px rgba(255,71,87,.25)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .mark{margin-left:auto;font-weight:900;font-size:17px;flex-shrink:0}

.qactions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.btn{
  padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:800;
  background:var(--fill);color:#fff;border:2.5px solid var(--line-2);box-shadow:var(--pop) rgba(0,0,0,.3);
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s;
}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:var(--pop-lg) rgba(0,0,0,.35)}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:0 2px 7px rgba(0,0,0,.3)}
.btn:disabled{opacity:.32;cursor:default;box-shadow:none}
.btn.sec{background:var(--card);color:var(--tx)}
.btn.go{background:var(--neuro);border-color:var(--line-2)}
.btn.flag.on{background:var(--gold);color:var(--tx)}

@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.verdict{
  margin-top:21px;padding:15px 18px;border-radius:14px;font-weight:900;font-size:15px;
  display:flex;align-items:center;gap:11px;border:2.5px solid var(--line-2);animation:pop .32s cubic-bezier(.34,1.56,.64,1);
}
.verdict.ok{background:var(--ok-bg);color:#5fe0a8;box-shadow:var(--pop) rgba(0,168,107,.3)}
.verdict.bad{background:var(--bad-bg);color:#ff9aa2;box-shadow:var(--pop) rgba(255,71,87,.3)}
.verdict.part{background:var(--gold-bg);color:#ffd27a;box-shadow:var(--pop) rgba(255,201,74,.45)}
.verdict .big{font-size:22px}

/* ---- free-text case questions ---- */
.caseask{margin-top:19px;font-weight:900;font-size:14px;color:var(--ink-2)}
.caseinput{
  width:100%;margin-top:9px;padding:13px 15px;font:inherit;font-size:15px;line-height:1.5;
  border:2.5px solid var(--line-2);border-radius:14px;background:var(--card);color:var(--tx);
  box-shadow:var(--pop) rgba(0,0,0,.12);resize:vertical;
  transition:box-shadow .18s cubic-bezier(.34,1.56,.64,1),transform .18s cubic-bezier(.34,1.56,.64,1);
}
.caseinput:focus{outline:none;transform:translate(-1px,-1px);box-shadow:0 12px 28px rgba(0,0,0,.18)}
.caseinput:disabled{opacity:.75;cursor:default}
.caseinput::placeholder{color:var(--ink-2);opacity:.6}
.modelans{
  margin-top:15px;padding:14px 17px;border:2.5px solid var(--line-2);border-radius:14px;
  background:var(--ok-bg);box-shadow:var(--pop) rgba(0,168,107,.25);
}
.modelans>b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.modelans>div{font-weight:800;font-size:15px}
.keys{margin-top:14px;padding:13px 16px;border:2.5px dashed var(--line-2);border-radius:14px}
.keys-h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:800;margin-bottom:9px}
.key{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:14px;font-weight:700}
.key.miss{opacity:.55}
.lastgo{
  display:inline-flex;align-items:center;gap:7px;margin-top:9px;
  padding:5px 12px;border:2px dashed var(--line-2);border-radius:20px;
  font-size:12px;font-weight:800;color:var(--ink-2);opacity:.85}

.conf{margin-top:17px;padding:15px 17px;background:var(--gold-bg);border:2.5px solid var(--line-2);border-radius:14px;box-shadow:var(--pop) rgba(255,201,74,.4)}
.conf-q{font-size:13px;color:var(--ink-2);margin-bottom:11px;font-weight:700}
.conf-btns{display:flex;gap:8px;flex-wrap:wrap}
.conf-b{
  padding:8px 15px;border:2.5px solid var(--line-2);border-radius:20px;font-size:12.5px;
  background:var(--card);font-weight:800;transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;
}
.conf-b:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(2,6,14,.25)}
.conf-b.on{background:var(--fill);color:#fff}

.explain{margin-top:18px;border:2.5px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:var(--pop) rgba(0,0,0,.14)}
.ex-head{
  display:flex;align-items:center;gap:10px;padding:13px 17px;background:var(--bg-2);
  width:100%;text-align:left;font-weight:900;font-size:13.5px;transition:background .13s;
}
.ex-head:hover{background:rgba(255,255,255,.07)}
.ex-head .chev{margin-left:auto;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.ex-head.open .chev{transform:rotate(180deg)}
.ex-body{padding:19px 21px;font-size:14.3px;line-height:1.68;color:var(--ink-2);display:none}
.ex-body.open{display:block;animation:pop .24s ease}
.ex-body p{margin:0 0 13px}
.ex-body p:last-child{margin-bottom:0}
.ex-body strong{color:var(--tx);font-weight:800}
.ex-body em{color:var(--ink-3)}
.objective{
  margin-top:17px;padding:14px 17px;background:linear-gradient(135deg,rgba(59,130,246,.13),rgba(139,92,246,.15));
  border:2.5px solid var(--neuro);border-radius:12px;font-size:13.8px;line-height:1.6;
}
.objective b{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--neuro);margin-bottom:5px;font-weight:900}
.noexp{padding:17px 21px;color:var(--ink-4);font-size:13.5px;font-style:italic}

/* ---------- Schedule ---------- */
.sched-legend{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:20px;font-size:12.5px;color:var(--ink-3);font-weight:700}
.leg{display:flex;align-items:center;gap:7px}
.leg .sw{width:13px;height:13px;border-radius:4px;border:2px solid var(--line-2)}
.day{
  display:flex;gap:14px;align-items:center;padding:13px 15px;background:var(--card);
  border:2.5px solid var(--line-2);border-radius:14px;margin-bottom:9px;
  box-shadow:0 5px 14px rgba(0,0,0,.13);transition:transform .13s,box-shadow .13s;
}
.day:hover{transform:translate(-1px,-1px);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.day.rest{background:var(--bg-2);opacity:.72;border-style:dashed}
.day.missed{background:var(--bad-bg);border-color:var(--bad)}
.day.done{background:var(--ok-bg);border-color:var(--ok)}
.day.today{border-color:var(--neuro);box-shadow:0 10px 24px rgba(139,92,246,.35)}
.day-date{width:74px;flex-shrink:0}
.day-d{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.day-w{font-size:10.5px;color:var(--ink-4);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.day-body{flex:1;min-width:0}
.day-line{font-size:13.2px;margin-bottom:4px;line-height:1.45;font-weight:600}
.day-line:last-child{margin-bottom:0}
.day-line.faded{opacity:.45;text-decoration:line-through}
.tag{
  display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 10px;border-radius:7px;color:#fff;margin-right:10px;vertical-align:1.5px;
  border:1.5px solid var(--line-2);white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.22);
}
.movednote{font-size:11px;color:var(--neuro);font-weight:800;margin-top:4px}
.day-marks{display:flex;gap:7px;flex-shrink:0}
.mk{
  width:38px;height:38px;border-radius:11px;border:2.5px solid var(--line-2);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s,background .13s;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
}
.mk:hover{transform:translate(-1px,-1px);box-shadow:0 7px 18px rgba(0,0,0,.25)}
.mk:active{transform:translate(1px,1px);box-shadow:0 2px 7px rgba(0,0,0,.2)}
.mk.done.on{background:var(--ok);color:#fff}
.mk.miss.on{background:var(--bad);color:#fff}
.mk .lbl{position:absolute;opacity:0;pointer-events:none}


.track{
  display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:1.5px dashed var(--line);
}
.track:last-child{border-bottom:none}
.track-body{flex:1;min-width:0;font-size:13.4px;font-weight:600;line-height:1.55}
.track.is-done .track-body{opacity:.6}
.track.is-missed .track-body{opacity:.55;text-decoration:line-through}
.track.catchup{background:rgba(139,92,246,.07);border-radius:9px;padding:8px 11px;margin-top:5px;border:1.5px dashed var(--neuro)}
.day{align-items:stretch}
.day-body{display:flex;flex-direction:column;justify-content:center}


/* ---------- Highlighter ---------- */
mark.hl{background:transparent;padding:1.5px 1px;border-radius:4px;color:inherit;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* On the old white paper these were solid pastels with dark text. On the dark
   ground a solid pastel would need dark text inside light-on-dark prose, which
   reads badly mid-sentence — so the highlight is now a translucent wash of the
   same hue and the text stays light. Colour still identifies the pen. */
mark.hl[data-c="y"]{background:rgba(255,220,90,.30);box-shadow:inset 0 -1px 0 rgba(255,220,90,.55)}
mark.hl[data-c="g"]{background:rgba(110,240,160,.28);box-shadow:inset 0 -1px 0 rgba(110,240,160,.5)}
mark.hl[data-c="p"]{background:rgba(255,150,200,.28);box-shadow:inset 0 -1px 0 rgba(255,150,200,.5)}
mark.hl[data-c="b"]{background:rgba(120,190,255,.28);box-shadow:inset 0 -1px 0 rgba(120,190,255,.5)}

.mkbar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:15px;
  padding:9px 12px;background:var(--bg-2);border:2px dashed var(--line-2);border-radius:12px;
}
.mkbar .lb{font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.pen{
  width:29px;height:29px;border-radius:9px;border:2.5px solid var(--line-2);
  box-shadow:0 5px 14px rgba(0,0,0,.18);transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s;
  position:relative;
}
.pen:hover{transform:translate(-1px,-1px);box-shadow:0 7px 18px rgba(0,0,0,.26)}
.pen.on{transform:translateY(-3px);box-shadow:0 9px 22px rgba(0,0,0,.3)}
.pen.on::after{content:"";position:absolute;inset:-6px;border:2.5px solid var(--line-2);border-radius:13px}
.pen.y{background:#ffe97a}.pen.g{background:#a8f0bd}.pen.p{background:#ffc2dc}.pen.b{background:#a9d6ff}
.pen.er{background:var(--card);font-size:14px;display:flex;align-items:center;justify-content:center}
.mkbar .hint{font-size:11.5px;color:var(--ink-4);font-weight:600;margin-left:auto}
.mkbar .clr{
  font-size:11.5px;font-weight:800;color:var(--ink-3);padding:5px 11px;border-radius:20px;
  border:2px solid var(--line-2);background:var(--card);
}
.mkbar .clr:hover{border-color:var(--line-2);color:var(--tx)}
.stem{-webkit-user-select:text;user-select:text}
.stem.arm{cursor:crosshair}


/* ---------- Jump navigator ---------- */
.modal.wide{max-width:660px}
.jumprow{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.jumpin{
  width:112px;padding:9px 13px;border:2.5px solid var(--line-2);border-radius:11px;
  font-size:14px;font-weight:800;background:var(--card);color:var(--tx);
  box-shadow:0 5px 14px rgba(0,0,0,.15);
}
.jumpin::-webkit-outer-spin-button,.jumpin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jumpin{-moz-appearance:textfield}
.jumpkey{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);font-weight:700;margin-bottom:13px}
.jumpkey .k{display:flex;align-items:center;gap:6px}
.jumpkey .sw{width:13px;height:13px;border-radius:4px;border:2px solid var(--line-2)}
.qgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;
  max-height:42vh;overflow-y:auto;padding:5px 3px;
}
.qg{
  aspect-ratio:1;border-radius:10px;border:2.5px solid var(--line-2);font-weight:900;font-size:12.5px;
  background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 5px 14px rgba(0,0,0,.15);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;
}
.qg:hover{transform:translate(-2px,-2px);box-shadow:0 10px 24px rgba(0,0,0,.24)}
.qg.ok{background:var(--ok-bg);color:#5fe0a8;border-color:var(--ok)}
.qg.bad{background:var(--bad-bg);color:#ff9aa2;border-color:var(--bad)}
.qg.cur{background:var(--neuro);color:#fff;transform:translate(-2px,-2px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.qg.flagged::after{
  content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;
  background:var(--gold);border:2px solid var(--line-2);border-radius:50%;
}
.qprog{border:2px solid var(--line-2);cursor:pointer;transition:transform .12s,box-shadow .12s}
.qprog:hover{transform:translate(-1px,-1px);box-shadow:0 5px 14px rgba(0,0,0,.22)}



/* ---------- Schedule editor ---------- */
.edbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.day.editing{border-style:dashed;border-color:var(--neuro);background:rgba(139,92,246,.10)}
.ed-item{display:flex;gap:8px;align-items:center;padding:7px 0;flex-wrap:wrap}
.ed-lab,.ed-txt{
  padding:7px 11px;border:2px solid var(--line-2);border-radius:9px;font-size:12.8px;
  background:var(--card);color:var(--tx);font-weight:600;font-family:inherit;
}
.ed-lab{width:132px;flex-shrink:0}
.ed-txt{flex:1;min-width:150px}
.ed-lab:focus,.ed-txt:focus{border-color:var(--neuro);outline:none}
.ed-col{width:30px;height:30px;border-radius:8px;border:2.5px solid var(--line-2);flex-shrink:0;cursor:pointer}
.ed-x{
  width:29px;height:29px;border-radius:8px;border:2px solid var(--bad);color:var(--bad);
  background:var(--card);font-weight:900;flex-shrink:0;font-size:13px;
}
.ed-x:hover{background:var(--bad-bg)}
.ed-add{
  font-size:11.5px;font-weight:800;color:var(--neuro);padding:6px 12px;border-radius:20px;
  border:2px dashed var(--neuro);background:transparent;margin-top:5px;
}
.ed-add:hover{background:rgba(139,92,246,.17)}
.ed-day-tools{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap}
.ed-t{
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;border:2px solid var(--line-2);
  background:var(--card);color:var(--ink-3);
}
.ed-t:hover{border-color:var(--line-2);color:var(--tx)}
.ed-t.danger{border-color:var(--bad);color:var(--bad)}
.ed-t.on{background:var(--fill);color:#fff;border-color:var(--line-2)}
.newday{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px;margin-top:10px;
  border:2.5px dashed var(--line-2);border-radius:14px;background:var(--card)}
.newday input[type=date]{padding:8px 11px;border:2px solid var(--line-2);border-radius:9px;
  font-family:inherit;font-size:13px;font-weight:600;background:var(--card);color:var(--tx)}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.pal{width:24px;height:24px;border-radius:7px;border:2.5px solid var(--line-2);cursor:pointer}
.pal.on{transform:translateY(-3px);box-shadow:0 7px 18px rgba(2,6,14,.3)}


/* ---------- Profile gate ---------- */
.gate{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  background-image:radial-gradient(circle at 15% 10%, rgba(139,92,246,.10) 0, transparent 45%),
                   radial-gradient(circle at 85% 8%, rgba(255,90,95,.09) 0, transparent 42%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 20px;overflow-y:auto;
}
.gate.hide{display:none}
.gate .glogo{display:flex;align-items:center;gap:11px;font-weight:900;font-size:24px;letter-spacing:-.03em;margin-bottom:6px}
.gate .glogo .blip{
  width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--ent),var(--gold));
  display:flex;align-items:center;justify-content:center;font-size:19px;
  box-shadow:0 7px 18px rgba(0,0,0,.25);transform:rotate(-6deg);
}
.gate h2{font-size:19px;color:var(--ink-3);font-weight:700;margin:0 0 30px}
.pgrid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:760px}
.pcard{
  width:132px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:transparent;transition:transform .16s cubic-bezier(.34,1.56,.64,1);
}
.pcard:hover{transform:translateY(-5px)}
.pav{
  width:96px;height:96px;border-radius:24px;border:3px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;
  box-shadow:0 12px 28px rgba(0,0,0,.2);position:relative;
}
.pcard:hover .pav{box-shadow:0 17px 40px rgba(0,0,0,.28)}
.pav img{width:100%;height:100%;object-fit:cover;display:block}
.pav .lock{
  position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;
  background:var(--gold);border:2.5px solid var(--line-2);display:flex;align-items:center;
  justify-content:center;font-size:12px;
}
.pname{font-weight:800;font-size:14.5px;text-align:center;line-height:1.3;word-break:break-word}
.pcard.add .pav{border-style:dashed;background:var(--card);font-size:38px;color:var(--ink-4);box-shadow:none}
.pcard.add:hover .pav{border-color:var(--neuro);color:var(--neuro)}
.gate .gfoot{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-bottom:16px;max-height:180px;overflow-y:auto}
.emb{
  aspect-ratio:1;border-radius:11px;border:2.5px solid var(--line-2);background:var(--card);
  font-size:22px;display:flex;align-items:center;justify-content:center;
  transition:transform .12s cubic-bezier(.34,1.56,.64,1);
}
.emb:hover{transform:translateY(-2px);border-color:var(--line-2)}
.emb.on{border-color:var(--line-2);background:var(--fill);transform:translateY(-2px)}
.colrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.colb{width:34px;height:34px;border-radius:10px;border:2.5px solid var(--line-2);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.colb:hover{transform:translateY(-2px)}
.colb.on{transform:translateY(-4px);box-shadow:0 9px 22px rgba(2,6,14,.3)}
.avprev{
  width:88px;height:88px;border-radius:22px;border:3px solid var(--line-2);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.avprev img{width:100%;height:100%;object-fit:cover}
.pinbox{
  display:flex;gap:9px;justify-content:center;margin:14px 0;
}
.pind{
  width:52px;height:60px;border:2.5px solid var(--line-2);border-radius:12px;text-align:center;
  font-size:24px;font-weight:900;background:var(--card);color:var(--tx);
  box-shadow:0 5px 14px rgba(0,0,0,.18);
}
.pind:focus{border-color:var(--neuro);outline:none;box-shadow:0 7px 18px rgba(139,92,246,.35)}
.pinerr{color:var(--bad);font-weight:800;font-size:13px;text-align:center;margin-top:4px;min-height:18px}

.railprof{
  display:flex;align-items:center;gap:10px;margin:4px 12px 8px;padding:9px 11px;border-radius:12px;
  background:var(--rail-2);width:calc(100% - 24px);text-align:left;
  transition:background .13s;
}
.railprof:hover{background:var(--rail-3)}
.railprof .rav{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.22);
}
.railprof .rav img{width:100%;height:100%;object-fit:cover}
.railprof .rn{font-size:13px;font-weight:800;color:#fff;line-height:1.2;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railprof .rs{font-size:10px;color:#7d75ab;font-weight:700}


/* ---------- Cloud sync ---------- */
.gsign{
  display:flex;align-items:center;gap:11px;padding:12px 20px;border-radius:14px;
  background:#fff;border:1px solid rgba(255,255,255,.5);font-weight:800;font-size:14px;color:#1f2430;
  box-shadow:0 10px 24px rgba(0,0,0,.2);transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .14s;
}
.gsign:hover{transform:translate(-2px,-2px);box-shadow:0 15px 35px rgba(0,0,0,.28)}
.gsign svg{width:19px;height:19px;flex-shrink:0}
.gate .gor{margin:22px 0 4px;font-size:12px;font-weight:800;color:var(--ink-4);letter-spacing:.08em;text-transform:uppercase}
.syncdot{
  display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;
  background:var(--ink-4);vertical-align:1px;
}
.syncdot.ok{background:#4ade80}
.syncdot.busy{background:var(--gold);animation:blink 1s infinite}
.syncdot.err{background:var(--ent)}
.railsync{
  margin:0 12px 6px;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.05);
  font-size:10.5px;font-weight:700;color:#9990c4;display:flex;align-items:center;
}
.cfgbox{
  width:100%;min-height:150px;padding:12px 14px;border:2.5px solid var(--line-2);border-radius:12px;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--card);color:var(--tx);
  line-height:1.55;resize:vertical;
}
.steps{counter-reset:s;font-size:13.3px;line-height:1.65;color:var(--ink-2);font-weight:500}
.steps li{margin-bottom:9px}
.steps code{background:var(--bg-2);padding:2px 7px;border-radius:5px;font-size:12px;font-weight:700}


.splash{
  position:fixed;inset:0;z-index:210;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.splash.hide{display:none}
.splash .glogo{font-size:24px}
.splash .msg{font-size:13.5px;color:var(--ink-3);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  width:34px;height:34px;border:3.5px solid var(--line-2);border-top-color:var(--neuro);
  border-radius:50%;animation:spin .8s linear infinite;
}


/* ---------- Theory (document view) ---------- */
.th-intro{
  background:linear-gradient(135deg,rgba(59,130,246,.13),rgba(139,92,246,.15));border:2.5px solid var(--neuro);
  border-radius:14px;padding:16px 20px;font-size:14px;line-height:1.68;margin-bottom:22px;
  box-shadow:var(--pop) rgba(139,92,246,.22);
}
.th-toc{
  background:var(--card);border:2.5px solid var(--line-2);border-radius:14px;padding:15px 19px;
  margin-bottom:26px;box-shadow:var(--pop) rgba(0,0,0,.14);
}
.th-toc .tl{font-size:10.5px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:11px}
.th-toc ol{margin:0;padding-left:19px}
.th-toc li{margin-bottom:6px;font-size:13.4px;font-weight:700}
.th-toc a{color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent}
.th-toc a:hover{color:var(--neuro);border-bottom-color:var(--neuro)}
.th-toc .wb{font-size:8.5px;margin-left:7px;padding:2px 6px;border-radius:5px;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;vertical-align:1.5px}

/* a section is now a chapter of a document, always open */
.th-sec{
  margin-bottom:34px;padding-left:20px;border-left:5px solid var(--c,var(--neuro));
  scroll-margin-top:80px;
}
.th-h{display:flex;align-items:center;gap:11px;margin-bottom:13px;flex-wrap:wrap}
.th-h h2{
  margin:0;font-size:21px;font-weight:900;letter-spacing:-.028em;color:var(--tx);line-height:1.2;
}
.th-num{
  font-size:11px;font-weight:900;color:var(--c,var(--neuro));letter-spacing:.1em;
  text-transform:uppercase;
}
.wbadge{
  font-size:8.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;
  border-radius:6px;border:1.5px solid var(--line-2);flex-shrink:0;
}
.wbadge.must{background:var(--ent);color:#fff}
.wbadge.high{background:var(--gold);color:var(--tx)}
.wbadge.know{background:var(--bg-2);color:var(--ink-3)}
.th-body{font-size:14.6px;line-height:1.78;color:var(--ink-2)}
.th-body p{margin:0 0 14px}
.th-body strong{color:var(--tx);font-weight:800}
.th-body em{color:var(--ink-3)}
.th-body ul{margin:0 0 14px;padding-left:22px}
.th-body li{margin-bottom:7px}
.th-body li::marker{color:var(--c,var(--neuro))}
.th-body blockquote{
  margin:0 0 15px;padding:13px 18px;background:var(--gold-bg);border-left:4px solid var(--gold);
  border-radius:0 10px 10px 0;font-weight:700;color:var(--tx);font-size:14.5px;
}
.th-table{width:100%;border-collapse:separate;border-spacing:0;margin:4px 0 18px;font-size:13.3px;
  border:2.5px solid var(--line-2);border-radius:12px;overflow:hidden}
.th-table th{background:var(--fill);color:#fff;text-align:left;padding:10px 13px;font-weight:800;
  font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.th-table td{padding:10px 13px;border-bottom:1.5px solid var(--line);vertical-align:top;line-height:1.55}
.th-table tr:last-child td{border-bottom:none}
.th-table tr:nth-child(even) td{background:rgba(255,255,255,.03)}

.flow{margin:4px 0 18px;border:2.5px dashed var(--neuro);border-radius:14px;padding:16px 17px;background:rgba(139,92,246,.07)}
.flow-title{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--neuro);margin-bottom:14px}
.fstep{margin-bottom:9px}
.fbox{background:var(--card);border:2.5px solid var(--line-2);border-radius:11px;padding:11px 14px;
  box-shadow:0 5px 14px rgba(0,0,0,.15)}
.fbox .ft{font-weight:800;font-size:13.6px;line-height:1.42}
.fbox .fn{font-size:12.4px;color:var(--ink-3);margin-top:5px;line-height:1.5;font-weight:600}
.fbox.alert{background:rgba(255,90,95,.13);border-color:var(--ent);box-shadow:0 5px 14px rgba(255,90,95,.3)}
.fbox.alert .ft{color:#ff9aa2}
.fbox.dec{background:var(--gold-bg);border-color:var(--gold)}
.farrow{text-align:center;color:var(--neuro);font-size:17px;line-height:1;margin:2px 0 7px;font-weight:900}
.fbranch{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.fb{border:2px solid var(--line-2);border-radius:10px;padding:9px 12px;font-size:12.6px;font-weight:700;line-height:1.45}
.fb.y{background:rgba(0,168,107,.14);border-color:var(--ok)}
.fb.n{background:rgba(255,71,87,.13);border-color:var(--bad)}
.fb b{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
.fb.y b{color:var(--ok)}
.fb.n b{color:var(--bad)}
@media(max-width:600px){.fbranch{grid-template-columns:1fr}}

.th-test{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.th-test .lbl{font-size:12px;font-weight:800;color:var(--ink-3)}
.readtheory{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:16px;
  padding:12px 16px;background:linear-gradient(135deg,rgba(59,130,246,.13),rgba(139,92,246,.15));
  border:2.5px solid var(--neuro);border-radius:13px;font-weight:800;font-size:13.5px;
  box-shadow:var(--pop) rgba(139,92,246,.25);
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s;
}
.readtheory:hover{transform:translate(-2px,-2px);box-shadow:var(--pop-lg) rgba(139,92,246,.3)}
.th-ch{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--card);
  border:2.5px solid var(--line-2);border-radius:13px;margin-bottom:9px;width:100%;text-align:left;
  box-shadow:0 5px 14px rgba(0,0,0,.13);transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s}
.th-ch:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.th-ch:disabled{opacity:.4;cursor:default;box-shadow:none;border-style:dashed}
.th-ch .n{flex:1;font-weight:700;font-size:14px}
.th-ch .m{font-size:11.5px;color:var(--ink-4);font-weight:700}
.doc-head{border-bottom:3px solid var(--line-2);padding-bottom:14px;margin-bottom:22px}
.doc-meta{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-top:6px}

/* ---------- Print / Save as PDF ---------- */
@media print{
  @page{margin:16mm 14mm}
  .rail,.topbar,.th-test,.th-toc .wb,.readtheory,.toast,.modal-bg,.splash,.gate{display:none!important}
  /* The app is dark on screen. Printing keeps paper white, so every colour token
     that carries text has to flip back to ink or the PDF comes out blank. */
  :root{
    --tx:#14181f; --ink:#14181f; --ink-2:#2b3340; --ink-3:#4a5464; --ink-4:#6b7688;
    --card:#fff; --bg:#fff; --bg-2:#f2f4f8; --fill:#14181f;
    --line:#d8dde5; --line-2:#b9c1cd;
    --ok-bg:#e6f9f0; --bad-bg:#ffecee; --gold-bg:#fff6e0;
  }
  body{background:#fff!important;background-image:none!important;font-size:11pt;color:#14181f}
  .ambient,.ambient *{display:none!important}
  .th-body,.th-body p,.th-body li,.stem,.ex-body{color:#22282f!important}
  .th-body strong,.th-h h2,h1{color:#0d1117!important}
  .th-table th{background:#14181f!important;color:#fff!important}
  .th-table tr:nth-child(even) td{background:#f4f6f9!important}
  .app{display:block}
  .page{padding:0;max-width:100%}
  .th-sec{break-inside:auto;page-break-inside:auto;margin-bottom:20px;padding-left:12px}
  .th-h{break-after:avoid;page-break-after:avoid}
  .th-table,.flow,.fbox,.th-body blockquote{break-inside:avoid;page-break-inside:avoid}
  .th-intro,.th-toc{box-shadow:none}
  .fbox,.th-table,.th-toc,.th-intro{box-shadow:none!important}
  h1{font-size:22pt}
  .th-h h2{font-size:14pt}
  .th-body{font-size:10.5pt;line-height:1.55}
  a{text-decoration:none;color:inherit}
}
/* ---------- Misc ---------- */
.empty{text-align:center;padding:64px 20px;color:var(--ink-4)}
.empty .big{font-size:52px;margin-bottom:14px}
.empty h3{color:var(--ink-2);font-size:17px;margin:0 0 7px;font-weight:900}
.empty p{margin:0 auto;font-size:13.5px;max-width:400px;line-height:1.6;font-weight:500}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--fill);color:#fff;padding:13px 22px;border-radius:14px;font-size:13.5px;
  border:2.5px solid #000;box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:400;opacity:0;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);font-weight:800;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);
}
.modal-bg.show{display:flex}
.modal{
  background:var(--card);border:3px solid var(--line-2);border-radius:20px;padding:27px;
  max-width:460px;width:100%;box-shadow:0 20px 46px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.34,1.56,.64,1);
}
.modal h3{margin:0 0 9px;font-size:20px;font-weight:900;letter-spacing:-.02em}
.modal p{margin:0 0 19px;color:var(--ink-2);font-size:14px;line-height:1.6;font-weight:500}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.kbd{
  display:inline-block;padding:2px 8px;border:2px solid var(--line-2);border-bottom-width:3px;
  border-radius:6px;font-size:11px;font-family:ui-monospace,Menlo,monospace;background:var(--bg-2);font-weight:800;
}
.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:10px 17px;font-size:13px;align-items:center}
.shortcuts .d{color:var(--ink-3);font-weight:600}

.filterbar{display:flex;gap:9px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
/* Source filter — which of the three question banks a module draws from. */
.bankbar{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap;align-items:center}
.bank-lbl{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);margin-right:2px}
.bankchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;cursor:pointer;
  border:2.5px solid var(--line-2);border-radius:22px;background:var(--card);color:var(--ink-2);
  font-family:inherit;font-size:13px;font-weight:800;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,background .18s,color .18s}
.bankchip:hover{transform:translateY(-2px)}
/* Off-state is deliberately flat and grey: which sources are live must be
   readable at a glance, or you sit an exam on a filtered set without noticing. */
.bankchip.on{background:var(--bk);color:#fff;box-shadow:0 5px 14px var(--ink)}
.bankchip:not(.on){opacity:.5;text-decoration:line-through}
.bankn{font-size:11px;font-weight:900;padding:1px 7px;border-radius:10px;
  background:rgba(0,0,0,.18)}
.bankchip:not(.on) .bankn{background:rgba(0,0,0,.08)}
.bankchip.reset{border-style:dashed;opacity:1;text-decoration:none;font-weight:700}
/* Which of the three banks this question came from, on the question itself. */
.pill.bankpill{color:#fff}
.chip{
  padding:8px 15px;border:2.5px solid var(--line-2);border-radius:22px;font-size:12.5px;
  background:var(--card);font-weight:800;box-shadow:0 5px 14px rgba(0,0,0,.15);
  transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s;
}
.chip:hover{transform:translate(-1px,-1px);box-shadow:0 7px 18px rgba(0,0,0,.25)}
.chip.on{background:var(--c,var(--ink));color:#fff}

@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
.confetti{position:fixed;top:-14px;width:11px;height:11px;z-index:250;pointer-events:none;animation:fall linear forwards}

.mobile-only{display:none}
@media(max-width:860px){
  .rail{position:fixed;left:-238px;z-index:60;transition:left .24s;box-shadow:8px 0 30px rgba(0,0,0,.3)}
  .rail.open{left:0}
  .mobile-only{display:block}
  .page{padding:18px 14px}
  .qcard{padding:20px 17px}
  .topbar{padding:10px 14px}
  h1{font-size:25px}
  .day{flex-wrap:wrap}
  .day-marks{margin-left:auto}
}

/* ============================================================================
   CINEMATIC LAYER — added 2026-07-27
   Depth, glass and motion. The governing rule for this whole block:

       ALIVE TO BROWSE, CALM TO READ.

   Ambient motion runs on home / module / schedule / flagged / moved.
   It stops dead on quiz / mock / review / theory, because those are the screens
   where a clinical stem is read for minutes at a time and anything drifting in
   the periphery competes with it. The gate is body[data-view], set by render().
   ============================================================================ */

/* ---- ground ------------------------------------------------------------- */
body{
  background:var(--bg);
  background-image:
    radial-gradient(1200px 700px at 8% -10%, rgba(139,92,246,.16), transparent 60%),
    radial-gradient(1000px 620px at 100% 0%, rgba(59,130,246,.14), transparent 58%),
    radial-gradient(900px 600px at 50% 110%, rgba(0,179,126,.10), transparent 60%);
  background-attachment:fixed;
}

/* Slow-moving colour behind everything. Fixed, non-interactive, z-index 0;
   .app sits at z-index 1. Blur is on an element that never scrolls and never
   repaints, which is the only place a 90px blur is affordable. */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.ambient .orb{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;
  will-change:transform;
}
.ambient .o1{width:46vw;height:46vw;left:-12vw;top:-14vh;background:radial-gradient(circle,#8b5cf6,transparent 68%);animation:drift1 34s ease-in-out infinite}
.ambient .o2{width:40vw;height:40vw;right:-10vw;top:4vh;background:radial-gradient(circle,#3b82f6,transparent 68%);animation:drift2 41s ease-in-out infinite}
.ambient .o3{width:38vw;height:38vw;left:26vw;bottom:-18vh;background:radial-gradient(circle,#00b37e,transparent 70%);animation:drift3 47s ease-in-out infinite}
.ambient .o4{width:26vw;height:26vw;right:16vw;bottom:-10vh;background:radial-gradient(circle,#ff5a5f,transparent 72%);opacity:.28;animation:drift1 52s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vh,0) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-7vw,7vh,0) scale(1.09)}}
@keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(5vw,-6vh,0) scale(1.14)}}

.app{position:relative;z-index:1}

/* ---- the gate: still while reading -------------------------------------- */
body[data-view="quiz"] .ambient,
body[data-view="mock"] .ambient,
body[data-view="review"] .ambient,
body[data-view="theory"] .ambient{opacity:.3;transition:opacity .5s ease}
body[data-view="quiz"] .orb,
body[data-view="mock"] .orb,
body[data-view="review"] .orb,
body[data-view="theory"] .orb{animation-play-state:paused}

/* ---- glass on the fixed furniture only ---------------------------------- */
/* Deliberately NOT on cards, chapter rows or question options: backdrop-filter
   on a long scrolling list is the single most expensive thing on the page. */
.rail{
  background:linear-gradient(180deg,rgba(10,20,34,.96),rgba(8,16,28,.99));
  border-right:1px solid var(--line-2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.topbar{backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.modal{
  background:linear-gradient(160deg,rgba(24,40,60,.96),rgba(14,25,40,.98));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line-2);box-shadow:0 30px 80px rgba(0,0,0,.6),var(--glow);
}
.modal-bg{background:rgba(3,7,14,.66);backdrop-filter:blur(5px)}
.results{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-2)}
.gate,.splash{background:var(--bg);background-image:inherit}

/* ---- surfaces get an inner highlight so edges read on dark -------------- */
.card,.stat,.ch-row,.qcard,.th-ch,.day,.modelans,.explain,.th-toc,.fbox,.conf{
  box-shadow:var(--pop) rgba(0,0,0,.45),var(--glow);
}
.card,.stat,.qcard,.ch-row,.th-ch,.day{
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  background-color:var(--card);
}

/* hover lifts instead of sliding into a hard shadow */
button.card:hover:not(:disabled),.ch-row:hover:not(:disabled),.th-ch:hover:not(:disabled){
  transform:translateY(-3px);
  box-shadow:0 16px 38px rgba(0,0,0,.55),0 0 0 1px var(--c,rgba(255,255,255,.16));
}
button.card:active:not(:disabled){transform:translateY(-1px)}
.day:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,0,0,.5),var(--glow)}

/* module cards glow in their own colour */
.mod-card::after{opacity:.5;filter:blur(26px);width:120px;height:120px;right:-40px;top:-40px}
.mod-ic{box-shadow:0 8px 22px var(--c),0 0 0 1px rgba(255,255,255,.14)}
.pill{border:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}

/* buttons: the primary action is now a lit surface, not a dark slab */
.btn{
  background:linear-gradient(160deg,#2c4a6b,#1b2d44);
  background-color:var(--fill);border:1px solid var(--line-2);
  box-shadow:0 8px 20px rgba(0,0,0,.45),var(--glow);
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.18)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.go{background:linear-gradient(160deg,#9b6ff8,#7c4ce8);border-color:rgba(255,255,255,.2);box-shadow:0 10px 26px rgba(139,92,246,.45)}
.btn.go:hover:not(:disabled){box-shadow:0 16px 36px rgba(139,92,246,.6)}
.btn.flag.on{background:linear-gradient(160deg,#ffd469,#f0b429);color:var(--on-accent)}
.wbadge.high{color:var(--on-accent)}

/* inputs */

.toast{background:linear-gradient(160deg,#22344b,#14243a);border:1px solid var(--line-2);box-shadow:0 18px 44px rgba(0,0,0,.6)}
.kbd{background:rgba(255,255,255,.07);border-color:var(--line-2)}
.grouphdr::after{height:1px;background:var(--line-2)}

/* ---- entrance motion ---------------------------------------------------- */
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#page{animation:pagein .34s cubic-bezier(.22,1,.36,1)}

/* scroll reveal — browse screens only, applied by the observer in JS */
.reveal{opacity:0;transform:translateY(16px)}
.reveal.in{opacity:1;transform:none;transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}

/* ---- accessibility ------------------------------------------------------ */
/* The original rule already killed animation and transition. Ambient orbs are
   background-position/transform loops, so they need explicitly stopping too. */
@media (prefers-reduced-motion:reduce){
  .ambient .orb{animation:none!important}
  .reveal{opacity:1!important;transform:none!important}
}
</style>

<script>

/* ==========================================================================
   CLOUD SYNC  \u2014  paste your Firebase config between the braces below.
   Leave it empty and the app simply runs offline with local profiles.
   Setup instructions are in the app: profile screen \u2192 "Set up sync".
   ========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAg9OGSUbn7A04K5nRdStjzwGrO0nrvidk",
  authDomain: "ward-round-e4822.firebaseapp.com",
  projectId: "ward-round-e4822",
  storageBucket: "ward-round-e4822.firebasestorage.app",
  messagingSenderId: "353156608996",
  appId: "1:353156608996:web:1b8faf5f9fa01dafd48df1"
};




/* ============ SCHEDULE DATA ============ */
const SUBJ_COLOURS=[['#ff5a5f','ENT'],['#00b37e','Ophthalmology'],['#8b5cf6','Neuro/Psych'],
                    ['#3b82f6','Pediatrics'],['#6a6390','Revision'],['#f59e0b','Buffer'],['#0e7490','Other']];

/* built-in plan -> {date, rest, items:[{label,text,hex}]} */
function defaultSchedule(){
  return SCHEDULE.map(r=>{
    if(r[1]==='rest')return {date:r[0],rest:true,items:[]};
    const items=[];
    const HEX={ent:'#ff5a5f',ophtho:'#00b37e',neuropsych:'#8b5cf6',
                revision:'#6a6390',buffer:'#f59e0b'};
    if(r[3])items.push({label:r[2]||'',text:r[3],hex:HEX[r[1]]||'#6a6390'});
    if(r[4])items.push({label:'Pediatrics',text:r[4],hex:'#3b82f6'});
    return {date:r[0],rest:false,items:items};
  });
}
function activeSchedule(){
  if(!S.schedule)S.schedule=defaultSchedule();
  return S.schedule;
}
function saveSchedule(){save();render()}

/* ============ STORAGE ============ */
let KEY='wardround.v2';
/* banks: per-module source filter, {ent:['endpoint','house'], …}. An absent or
   empty entry means "all sources" — never store the full set, so a bank added
   later is included by default instead of silently hidden. */
let S={answers:{},flags:{},conf:{},sched:{},srs:{},days:{},hl:{},banks:{}};
let storageMode='memory';

async function loadState(){
  try{
    if(typeof window!=='undefined'&&window.storage&&window.storage.get){
      const r=await window.storage.get(KEY);
      if(r&&r.value)S=Object.assign(S,JSON.parse(r.value));
      if(!S.hl)S.hl={};
      storageMode='cloud';migrateSched();dropAI();return;
    }
  }catch(e){storageMode='cloud';return}
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)S=Object.assign(S,JSON.parse(raw));
    if(!S.hl)S.hl={};
    storageMode='local';
    migrateSched();dropAI();
  }catch(e){storageMode='memory'}
}
function dropAI(){delete S.ai;delete S.aiKey;delete S.hideFileWarn}
function migrateSched(){
  const out={};
  Object.keys(S.sched||{}).forEach(k=>{
    if(/\|\d+$/.test(k)){out[k]=S.sched[k];return}
    if(k.indexOf('|main')>0){out[k.replace('|main','|0')]=S.sched[k];return}
    if(k.indexOf('|peds')>0){out[k.replace('|peds','|1')]=S.sched[k];return}
    out[k+'|0']=S.sched[k];out[k+'|1']=S.sched[k];
  });
  S.sched=out;
}
async function save(){
  S.updatedAt=Date.now();
  try{
    if(storageMode==='cloud'&&window.storage&&window.storage.set){await window.storage.set(KEY,JSON.stringify(S));}
    else if(storageMode==='local')localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){}
  schedulePush();
}

/* ============ HELPERS ============ */
const $=id=>document.getElementById(id);
const chapterName=id=>{for(const m of MODULES)for(const g of m.groups)for(const c of g.chapters)if(c[0]===id)return c[1];return id};
const moduleOf=id=>MODULES.find(m=>m.id===id);
/* The three question banks the material comes from. Order here is the order the
   filter chips render in. `bank` on a question is one of these ids; anything
   missing one is treated as 'endpoint', which is where every question
   transcribed before the field existed came from. */
const BANKS=[
  {id:'endpoint', name:'Endpoint',   hex:'#f59e0b'},
  {id:'house',    name:'House',      hex:'#0ea5e9'},
  {id:'gradegain',name:'Grade Gain', hex:'#ec4899'}
];
const bankOf=q=>q.bank||'endpoint';
const bankName=b=>(BANKS.find(x=>x.id===b)||{name:b}).name;
/* Empty or absent filter = show everything. Filtering lives here, in the two
   selectors the whole app already reads through, so chapter rows, counts,
   quizzes, search and progress all agree without any of them knowing about it. */
const bankOn=q=>{const f=S.banks&&S.banks[q.module];return !f||!f.length||f.indexOf(bankOf(q))>=0};
const qsIn=ch=>QUESTIONS.filter(q=>q.chapter===ch&&bankOn(q));
const qsInModule=m=>QUESTIONS.filter(q=>q.module===m&&bankOn(q));
/* Unfiltered, for the filter UI itself — it must count what it would reveal. */
const allQsInModule=m=>QUESTIONS.filter(q=>q.module===m);
/* Banks this module actually holds questions from. The filter must work over
   THIS, not over all of BANKS — otherwise a bank with no questions yet counts
   as "still selected", so turning off every visible source leaves the module
   showing nothing while the guard below thinks a source is still on. */
const banksPresent=mod=>BANKS.map(x=>x.id).filter(id=>QUESTIONS.some(q=>q.module===mod&&bankOf(q)===id));
function toggleBank(mod,b){
  const present=banksPresent(mod);
  const stored=S.banks[mod]||[];
  /* Drop anything stored that this module no longer has, so a stale id cannot
     linger invisibly and desync the chips from what is actually shown. */
  let cur=stored.length?stored.filter(x=>present.indexOf(x)>=0):present.slice();
  if(!cur.length)cur=present.slice();
  cur=cur.indexOf(b)>=0?cur.filter(x=>x!==b):cur.concat([b]);
  if(!cur.length){toast('Keep at least one source on 🙂');return}
  /* Store [] when everything present is on, so a bank added later is included
     by default rather than silently filtered out. */
  S.banks[mod]=(cur.length===present.length)?[]:cur;
  save();render();
}
function clearBanks(mod){S.banks[mod]=[];save();render()}
/* Run once after state loads. A saved filter can name a bank the module no
   longer has — content gets re-chaptered and re-sourced as transcription goes
   on — and a filter that matches nothing would show an empty module with no
   obvious cause. Anything left with no live banks falls back to "show all". */
function sanitiseBanks(){
  if(!S.banks)S.banks={};
  Object.keys(S.banks).forEach(mod=>{
    const present=banksPresent(mod);
    const kept=(S.banks[mod]||[]).filter(b=>present.indexOf(b)>=0);
    S.banks[mod]=(!kept.length||kept.length===present.length)?[]:kept;
  });
}
const isAnswered=id=>S.answers[id]!==undefined;
const isCorrect=id=>S.answers[id]&&S.answers[id].ok;
const todayISO=()=>new Date().toISOString().slice(0,10);
const tagHex=t=>({revision:'#6a6390',buffer:'#f59e0b','mock exam':'#8b5cf6'}[t])||(moduleOf(t)||{hex:'#6a6390'}).hex;

function accuracy(list){
  const a=list.filter(q=>isAnswered(q.id));
  if(!a.length)return null;
  return Math.round(a.filter(q=>isCorrect(q.id)).length/a.length*100);
}
function accColor(p){
  if(p===null)return 'var(--ink-4)';
  if(p>=80)return 'var(--ok)';
  if(p>=60)return '#e08a00';
  return 'var(--bad)';
}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){
  if(!s)return '';
  let h=esc(s);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  const lines=h.split('\n');let out='',tbl=[],para=[];
  const flushT=()=>{
    if(!tbl.length)return;
    let t='<table>';
    tbl.forEach((r,i)=>{
      if(/^\s*\|?\s*[-: ]+\|/.test(r))return;
      const cells=r.split('|').filter(c=>c.trim()!=='');
      t+='<tr>'+cells.map(c=>i===0?`<th>${c.trim()}</th>`:`<td>${c.trim()}</td>`).join('')+'</tr>';
    });
    out+=t+'</table>';tbl=[];
  };
  const flushP=()=>{if(para.length){out+='<p>'+para.join(' ')+'</p>';para=[]}};
  for(const ln of lines){
    if(ln.trim().startsWith('|')){flushP();tbl.push(ln);continue}
    flushT();
    if(!ln.trim()){flushP();continue}
    para.push(ln.trim());
  }
  flushT();flushP();
  return out;
}
function ring(pct,color,size){
  size=size||52;
  const r=(size-7)/2, c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e5e2f5" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/>
    </svg><div class="rv">${Math.round(pct)}<span style="font-size:8px">%</span></div></div>`;
}
function confetti(){
  const cols=['#ff5a5f','#ffc94a','#8b5cf6','#3b82f6','#00b37e'];
  for(let i=0;i<44;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'vw';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.9+Math.random()*1.5)+'s';
    d.style.animationDelay=(Math.random()*.35)+'s';
    if(i%3===0)d.style.borderRadius='50%';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4000);
  }
}

/* SRS */
const SRS=[1,3,7,21,60];
function scheduleSRS(qid,ok){
  const cur=S.srs[qid]||{lvl:0};
  cur.lvl = ok ? Math.min(cur.lvl+1,SRS.length-1) : 0;
  const d=new Date();d.setDate(d.getDate()+SRS[cur.lvl]);
  cur.due=d.toISOString().slice(0,10);
  S.srs[qid]=cur;
}
/* CHANGE 4: guessed questions belong in the deck even when correct */
function inDeck(q){
  if(!isAnswered(q.id))return false;
  if(!isCorrect(q.id))return true;
  return S.answers[q.id].conf===0;
}
function deckAll(){return QUESTIONS.filter(inDeck)}
function dueNow(){
  const t=todayISO();
  return deckAll().filter(q=>{
    const s=S.srs[q.id];
    if(!s)return true;
    if(isCorrect(q.id)&&s.lvl>=SRS.length-1)return false;
    return s.due<=t;
  });
}
function streakCount(){
  const days=Object.keys(S.days).sort().reverse();
  if(!days.length)return 0;
  let n=0;const d=new Date();
  for(;;){
    const iso=d.toISOString().slice(0,10);
    if(S.days[iso]){n++;d.setDate(d.getDate()-1)}
    else if(iso===todayISO()){d.setDate(d.getDate()-1)}
    else break;
    if(n>400)break;
  }
  return n;
}
function markDayActive(){S.days[todayISO()]=true}




/* ============ THEORY ============ */
function theoryFor(ch){return THEORY[ch]||null}
function theoryChapters(mod){
  const m=moduleOf(mod);if(!m)return [];
  const out=[];
  m.groups.forEach(g=>g.chapters.forEach(c=>{if(THEORY[c[0]])out.push(c)}));
  return out;
}
function theoryCount(){return Object.keys(THEORY).length}
/* reverse index: question id -> {chapter, sectionId, heading} */
let QTHEORY=null;
function qTheory(qid){
  if(!QTHEORY){
    QTHEORY={};
    Object.keys(THEORY).forEach(ch=>{
      (THEORY[ch].sections||[]).forEach(s=>{
        (s.qs||[]).forEach(q=>{QTHEORY[q]={ch:ch,sec:s.id,h:s.h}});
      });
    });
  }
  return QTHEORY[qid]||null;
}

function mdBlock(s){
  if(!s)return '';
  let h=esc(s);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+?)\*/g,'$1<em>$2</em>');
  const lines=h.split('\n');
  let out='',para=[],list=[],quote=[];
  const fp=()=>{if(para.length){out+='<p>'+para.join(' ')+'</p>';para=[]}};
  const fl=()=>{if(list.length){out+='<ul>'+list.map(i=>'<li>'+i+'</li>').join('')+'</ul>';list=[]}};
  const fq=()=>{if(quote.length){out+='<blockquote>'+quote.join(' ')+'</blockquote>';quote=[]}};
  lines.forEach(ln=>{
    const t=ln.trim();
    if(!t){fp();fl();fq();return}
    if(t.startsWith('> ')){fp();fl();quote.push(t.slice(2));return}
    if(t.startsWith('- ')){fp();fq();list.push(t.slice(2));return}
    fl();fq();para.push(t);
  });
  fp();fl();fq();
  return out;
}
function flowHTML(f){
  if(!f)return '';
  let h=`<div class="flow"><div class="flow-title">${esc(f.title||'Algorithm')}</div>`;
  (f.steps||[]).forEach((s,i)=>{
    if(i)h+='<div class="farrow">&#8595;</div>';
    if(s.k==='decision'){
      h+=`<div class="fstep"><div class="fbox dec"><div class="ft">${esc(s.t)}</div>
        <div class="fbranch">
          <div class="fb y"><b>Yes</b>${esc(s.yes||'')}</div>
          <div class="fb n"><b>No</b>${esc(s.no||'')}</div>
        </div></div></div>`;
    }else{
      h+=`<div class="fstep"><div class="fbox ${s.k==='alert'?'alert':''}">
        <div class="ft">${esc(s.t)}</div>${s.n?`<div class="fn">${esc(s.n)}</div>`:''}
      </div></div>`;
    }
  });
  return h+'</div>';
}
function tableHTML(t){
  if(!t)return '';
  let h='<table class="th-table"><tr>';
  (t.head||[]).forEach(c=>{h+=`<th>${mdInline(c)}</th>`});
  h+='</tr>';
  (t.rows||[]).forEach(r=>{
    h+='<tr>';
    r.forEach(c=>{h+=`<td>${mdInline(c)}</td>`});
    h+='</tr>';
  });
  return h+'</table>';
}
function mdInline(s){
  return esc(String(s||'')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function toggleTh(b){if(b&&b.nextElementSibling){b.classList.toggle("open");b.nextElementSibling.classList.toggle("open")}}

function vTheory(p){
  if(!view.mod){
    let h=`<div class="eyebrow" style="background:var(--neuro)">Study notes</div><h1>&#128218; Theory</h1>
    <p class="page-sub">High-yield summaries written from the question bank \u2014 what the examiners actually test, in the order they test it. Each lecture opens as one continuous document you can read straight through or save as a PDF.</p>
    <div class="grid g3">`;
    MODULES.forEach(m=>{
      const chs=theoryChapters(m.id);
      h+=`<button class="card mod-card" style="--c:${m.color}" ${chs.length?`onclick="go({name:'theory',mod:'${m.id}'})"`:'disabled style="opacity:.45"'}>
        <div class="mod-top"><span class="mod-ic">${m.icon}</span><span class="mod-name">${m.name}</span></div>
        <div class="mod-meta">${chs.length?`${chs.length} lecture${chs.length===1?'':'s'} written`:'not written yet'}</div>
      </button>`;
    });
    p.innerHTML=h+'</div>';return;
  }
  const m=moduleOf(view.mod);
  if(!view.ch){
    const chs=theoryChapters(view.mod);
    let h=`<button class="tb-btn" style="padding-left:0;margin-bottom:8px" onclick="go({name:'theory'})">&larr; Theory</button>
    <div class="eyebrow" style="background:${m.hex}">${m.name}</div><h1>${m.icon} ${m.name} notes</h1>
    <p class="page-sub">Tap a lecture to open its full summary.</p>`;
    chs.forEach(([cid,cname])=>{
      const t=THEORY[cid];
      const nq=(t.sections||[]).reduce((n,s)=>n+(s.qs||[]).length,0);
      const must=(t.sections||[]).filter(s=>s.w==='must').length;
      h+=`<button class="th-ch" onclick="go({name:'theory',mod:'${view.mod}',ch:'${cid}'})">
        <span class="ch-dot" style="background:${m.hex}"></span>
        <span class="n">${esc(cname)}</span>
        <span class="m">${t.sections.length} sections \u00b7 ${must} must-know \u00b7 ${nq} linked Qs</span></button>`;
    });
    p.innerHTML=h;return;
  }

  /* ---- the lecture as one continuous document ---- */
  const t=THEORY[view.ch];
  if(!t){p.innerHTML='<div class="empty"><div class="big">&#128220;</div><h3>Not written yet</h3></div>';return}
  const secs=t.sections||[];
  const allQs=[];

/* ============ CLOUD SYNC ============ */
const SDK=['https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
           'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',
           'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'];
let fbApp=null, fbUser=null, syncState='off', pushTimer=null, sdkLoading=null;

function cloudConfig(){
  if(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)return FIREBASE_CONFIG;
  try{
    const c=JSON.parse(localStorage.getItem('wardround.fbconfig')||'null');
    if(c&&c.apiKey)return c;
  }catch(e){}
  return null;
}
function cloudEnabled(){return !!cloudConfig()}

function loadSDK(){
  if(window.firebase)return Promise.resolve(true);
  if(sdkLoading)return sdkLoading;
  sdkLoading=new Promise(res=>{
    let settled=false;
    const done=v=>{if(!settled){settled=true;res(v)}};
    /* never let a slow or blocked CDN strand the user on the splash */
    setTimeout(()=>done(!!window.firebase),8000);
    let i=0;
    const next=()=>{
      if(settled)return;
      if(i>=SDK.length)return done(!!window.firebase);
      const s=document.createElement('script');
      s.src=SDK[i++];
      s.onload=next;
      s.onerror=()=>done(false);
      document.head.appendChild(s);
    };
    next();
  });
  return sdkLoading;
}
async function initCloud(){
  const cfg=cloudConfig();
  if(!cfg)return false;
  const ok=await loadSDK();
  if(!ok)return false;
  try{
    if(!fbApp)fbApp=firebase.initializeApp(cfg);
  }catch(e){
    if(firebase.apps&&firebase.apps.length)fbApp=firebase.apps[0];
    else return false;
  }
  /* keep the session across browser restarts */
  try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
  return true;
}
function isStandalone(){
  return (window.navigator&&window.navigator.standalone===true)||
         (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
}
function setSync(s){syncState=s;const el=$('railSync');if(el&&me)drawRailSync()}
function drawRailSync(){
  const el=$('railSync');
  if(!el)return;
  if(!fbUser){el.innerHTML='';el.style.display='none';return}
  el.style.display='flex';
  const label={idle:'Synced',busy:'Syncing\u2026',err:'Sync failed \u2014 retry on next change',off:'Offline'}[syncState]||'Synced';
  const cls={idle:'ok',busy:'busy',err:'err',off:''}[syncState]||'ok';
  el.innerHTML=`<span class="syncdot ${cls}"></span>${label}`;
}

async function signInGoogle(){
  const ok=await initCloud();
  if(!ok){toast('Sync is not available right now');return}
  const prov=new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  /* popups are unreliable inside the iOS home-screen app \u2014 use a redirect there */
  if(isStandalone()){
    try{await firebase.auth().signInWithRedirect(prov)}
    catch(e){toast('Sign-in failed: '+(e&&e.code||e))}
    return;
  }
  try{
    const res=await firebase.auth().signInWithPopup(prov);
    await afterSignIn(res.user);
  }catch(e){
    const m=String(e&&e.code||e);
    if(/popup-closed|cancelled/i.test(m))return;
    if(/unauthorized-domain/i.test(m)){toast('This address is not authorised in Firebase');return}
    if(/popup-blocked/i.test(m)){
      try{await firebase.auth().signInWithRedirect(prov)}catch(e2){toast('Sign-in blocked by the browser')}
      return;
    }
    toast('Sign-in failed: '+m);
  }
}
async function afterSignIn(u){
  fbUser=u;
  const id='g:'+u.uid;
  let p=profiles.find(x=>x.id===id);
  if(!p){
    p={id:id,name:(u.displayName||'Me').split(' ')[0],
       av:u.photoURL?{t:'p',v:u.photoURL,c:'#8b5cf6'}:{t:'e',v:'\uD83E\uDE7A',c:'#8b5cf6'},pin:''};
    profiles.push(p);saveProfiles();
  }
  await enterProfile(p);
  await pullCloud();
}
async function signOutCloud(){
  try{if(window.firebase&&firebase.auth)await firebase.auth().signOut()}catch(e){}
  fbUser=null;setSync('off');
  me=null;closeModal();showGate();
  toast('Signed out \u2014 your progress stays on this device');
}

function docRef(){
  if(!fbUser||!window.firebase)return null;
  return firebase.firestore().collection('users').doc(fbUser.uid);
}
function mergeStates(a,b){
  const at=a.updatedAt||0, bt=b.updatedAt||0;
  const newer=at>=bt?a:b, older=at>=bt?b:a;
  const out=JSON.parse(JSON.stringify(newer));
  out.answers={};
  const ids=new Set(Object.keys(a.answers||{}).concat(Object.keys(b.answers||{})));
  ids.forEach(id=>{
    const x=(a.answers||{})[id], y=(b.answers||{})[id];
    if(!x){out.answers[id]=y;return}
    if(!y){out.answers[id]=x;return}
    out.answers[id]=((x.at||0)>=(y.at||0))?x:y;
  });
  ['srs','hl','flags','conf','days','sched'].forEach(k=>{
    out[k]=Object.assign({},older[k]||{},newer[k]||{});
  });
  out.schedule=newer.schedule||older.schedule||null;
  out.updatedAt=Math.max(at,bt);
  return out;
}
async function pullCloud(){
  const ref=docRef();
  if(!ref)return;
  setSync('busy');
  try{
    const snap=await ref.get();
    if(snap.exists){
      const cloud=snap.data()&&snap.data().state?JSON.parse(snap.data().state):null;
      if(cloud){
        S=mergeStates(S,cloud);
        if(!S.hl)S.hl={};
        await save();
      }
    }
    setSync('idle');render();
    await pushCloud();
  }catch(e){setSync('err')}
}
function schedulePush(){
  if(!fbUser)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushCloud,1200);
}
async function pushCloud(){
  const ref=docRef();
  if(!ref)return;
  setSync('busy');
  try{
    await ref.set({state:JSON.stringify(S),updatedAt:Date.now(),
                   name:(fbUser.displayName||''),email:(fbUser.email||'')},{merge:true});
    setSync('idle');
  }catch(e){setSync('err')}
}

/* restore an existing session on load */
async function restoreSession(){
  if(!cloudEnabled())return false;
  const ok=await initCloud();
  if(!ok)return false;
  /* if we came back from a redirect sign-in, pick that up first */
  try{
    const r=await firebase.auth().getRedirectResult();
    if(r&&r.user){await afterSignIn(r.user);return true}
  }catch(e){}
  return new Promise(res=>{
    let done=false;
    const un=firebase.auth().onAuthStateChanged(async u=>{
      if(done)return;
      done=true;un();
      if(!u){res(false);return}
      await afterSignIn(u);
      res(true);
    });
    setTimeout(()=>{if(!done){done=true;try{un()}catch(e){}res(false)}},12000);
  });
}

function saveCfg(){

  let obj=null;
  try{obj=JSON.parse(raw)}
  catch(e){
    try{obj=(new Function('return ('+raw+')'))()}
    catch(e2){toast('That does not look like a Firebase config');return}
  }
  if(!obj||!obj.apiKey){toast('Config is missing apiKey');return}
  try{localStorage.setItem('wardround.fbconfig',JSON.stringify(obj))}catch(e){}
  closeModal();toast('Saved \u2014 now sign in with Google');showGate();

  showModal(`<h3>${esc(p.name)}</h3>

     ${[0,1,2,3].map(i=>`<input class="pind" id="pd${i}" inputmode="numeric" maxlength="1"
        oninput="pinHop(${i})" onkeydown="pinBack(event,${i})">`).join('')}
   </div>

   <div class="modal-actions">
     <button class="btn sec" onclick="closeModal();showGate()">Back</button>

   </div>`);
  setTimeout(()=>{const f=$('pd0');if(f&&f.focus)f.focus()},60);

function pinHop(i){
  const el=$('pd'+i);
  if(el&&el.value&&i<3){const n=$('pd'+(i+1));if(n&&n.focus)n.focus()}
}
function pinBack(e,i){
  if(e.key==='Backspace'&&!$('pd'+i).value&&i>0){const pv=$('pd'+(i-1));if(pv&&pv.focus)pv.focus()}
  if(e.key==='Enter'){const b=document.querySelector('.modal .btn.go');if(b)b.click()}
}
function readPin(){return [0,1,2,3].map(i=>($('pd'+i)||{}).value||'').join('')}
function tryPin(id){
  const p=profiles.find(x=>x.id===id);
  if(!p)return;
  if(readPin()===p.pin){enterProfile(p);return}
  const e=$('pinErr');if(e)e.textContent='Wrong PIN \u2014 try again';
  [0,1,2,3].forEach(i=>{const el=$('pd'+i);if(el)el.value=''});
  const f=$('pd0');if(f&&f.focus)f.focus();
}

function pfUpload(e,isEdit){
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'),SZ=160;
      c.width=SZ;c.height=SZ;
      const x=c.getContext('2d');
      const s=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,SZ,SZ);
      draft.av={t:'p',v:c.toDataURL('image/jpeg',0.8),c:draft.av.c};
      drawProfileEditor(isEdit);
    };
    img.onerror=()=>toast('Could not read that image');
    img.src=r.result;
  };
  r.readAsDataURL(f);
  e.target.value='';
}

/* Screens where the learner READS for minutes at a time. The cinematic layer
   pauses the ambient orbs on these, so nothing drifts beside a clinical stem.
   Everything else is a browse screen and stays alive. */
const STILL_VIEWS=['quiz','mock','review','theory'];

function render(){
  renderNav();
  const p=$('page');
  // Drives body[data-view] in CSS — the alive-to-browse / calm-to-read gate.
  document.body.dataset.view=view.name||'home';
  ({home:vHome,module:vModule,quiz:vQuiz,review:vReview,schedule:vSchedule,theory:vTheory,
    moved:vMoved,flagged:vFlagged,mock:vMock}[view.name]||vHome)(p);
  revealOnScroll(p);
}

/* Fade cards up as they enter the viewport — browse screens only. Reading
   screens get the page entrance animation and then hold completely still.
   Falls back to showing everything if IntersectionObserver is unavailable. */
let _revealObs=null;
function revealOnScroll(root){
  if(_revealObs){_revealObs.disconnect();_revealObs=null}
  if(STILL_VIEWS.includes(view.name)) return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const items=root.querySelectorAll('.card,.stat,.ch-row,.th-ch,.day');
  if(!items.length||!('IntersectionObserver' in window)) return;
  _revealObs=new IntersectionObserver((entries,obs)=>{
    entries.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)} });
  },{rootMargin:'0px 0px -40px 0px',threshold:.06});
  items.forEach((el,i)=>{
    el.classList.add('reveal');
    el.style.transitionDelay=Math.min(i,10)*26+'ms';
    _revealObs.observe(el);
  });
}

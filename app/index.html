<!-- Theme is chosen BEFORE any CSS parses, so a light-mode user never sees a
     dark flash on load. It has to be inline and it has to be here: a deferred
     script, or one at the end of <body>, runs after first paint and the flash
     is then unavoidable. Kept deliberately tiny for the same reason.
     No stored choice = follow the operating system. -->
<script>
(function(){
  var t=null;
  try{t=localStorage.getItem('wardround.theme')}catch(e){}
  if(t!=='light'&&t!=='dark'){
    t=(window.matchMedia&&matchMedia('(prefers-color-scheme:light)').matches)?'light':'dark';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<!-- Classical faces, embedded as data URIs. Must sit HERE, in <head> and before
     the stylesheet: a classic script blocks parsing and runs immediately, so the
     @font-face rules are registered before first paint. Moved to the end of
     <body> with the other data files, the whole page would render in a fallback
     face and then reflow. See data/fonts.js for why they are base64 and not
     .woff2 files sitting next door. -->
<script src="data/fonts.js"></script>
<style>
/* ============================================================================
   THE GREEK PALETTE — rebuilt 2026-07-28 from the artwork the user supplied.

   The reference is their own image set: classical figures in ochre and brass on
   parchment, and a set of icon studies in ink navy, cream and gold. Both themes
   are drawn from those, not invented:

     dark  = the library at night — ink navy ground, parchment text, gold leaf
     light = the page itself      — true parchment, warm ink, sienna

   ONE RULE ABOVE THE OTHERS: no cool white and no blue-grey anywhere in the
   text ramp. Beside terracotta and bronze, a blue-white reads as a different
   and colder design pasted on top. Every neutral here carries warmth.

   The three token families still must not re-merge — see CLAUDE.md §6. What
   changed is only their colour: --line* are now translucent PARCHMENT rather
   than translucent white.

   MODULE COLOURS WERE REPLACED (user's decision, 2026-07-28). They were locked
   because the Notion board and the PDF schedule share them; the user chose the
   full Greek palette knowing those two will no longer match until updated. The
   old values are in archive\index.pre-greek-2026-07-28.html.

     ENT     #ff5a5f -> #b4472f  terracotta
     Ophtho  #00b37e -> #5c7a52  olive
     Neuro   #8b5cf6 -> #6d4c7d  tyrian purple
     Peds    #3b82f6 -> #2e5f8a  lapis

   A happy consequence, measured not hoped for: all four are dark enough that
   WHITE text on them now passes AA (4.8-7.1:1). The old set failed at
   3.05-4.23:1 and that failure had to be left standing. The same move fixes the
   bank colours, so .bankchip.on and .pill.bankpill go back to white text.
   ============================================================================ */
:root{
  /* ---- type ---------------------------------------------------------------
     Cinzel and EB Garamond are embedded in data/fonts.js. The fallbacks matter:
     if that file is ever missing the app must still read, so each stack ends in
     a real system serif rather than in `serif`. */
  --font-display:var(--font-body);
  --font-body:'EB Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;

  /* text ramp — warm parchment on ink */
  --tx:#ded6c7;
  --ink:#ded6c7;
  --ink-2:#bdb6a8;
  --ink-3:#b1a999;
  --ink-4:#aaa292;   /* secondary labels; measurements in the Stage 1 report */

  /* ground and surfaces */
  --bg:#181b1d;
  --bg-2:#25282a;
  --card:#1b1e20;
  --fill:#35393b;
  --glass:#1b1e20;
  --glass-2:#181b1d;

  /* hairlines — parchment, not white */
  --line:rgba(242,232,213,.085);
  --line-2:rgba(242,232,213,.16);

  --rail:#080d14;
  --rail-2:#16202e;
  --rail-3:#27364b;
  --rail-text:#b9a88d;
  /* Secondary text in the rail — the subtitle, the section labels, the counts,
     the streak caption. Five rules each carried their own hardcoded lavender
     (#a79ddb, #a89fd4, #9c92cc, #c2bbe4), left over from a palette this app no
     longer uses: a cool purple secondary sitting underneath a warm sand
     primary, which is the seam that makes a rail read as two designs stacked.
     Warm, and one value. Measured 4.87:1 against the rail's darker gradient
     stop, so the small uppercase labels clear AA on their own. */
  --rail-dim:#8c7f6a;

  /* module colours — the Greek set */
  --ent:#b4472f;
  --ophtho:#5c7a52;
  --neuro:#6d4c7d;
  --peds:#2e5f8a;
  --revision:#7a6a55;
  --buffer:#9a6b1f;

  /* state colours */
  --ok:var(--tx);
  --ok-bg:var(--bg-2);
  --bad:#f292ac;
  --bad-bg:rgba(242,146,172,.10);
  --gold:#d9b44a;
  --gold-bg:rgba(228,196,96,.12);
  /* Student annotation washes: ochre, sage, dusty rose, slate. */
  --hl-y:#49402b;
  --hl-g:#2f4539;
  --hl-p:#4b343e;
  --hl-b:#303f50;
  --warn:#e4c460;
  --on-accent:#12100b;   /* text ON gold and other bright fills */
  --gold-text:#e4c460;   /* gold used AS TEXT. Separate from --gold because on
                            parchment the background gold measures 1.6:1. */

  /* Two corners: 6px outer surfaces; 3px controls. Circles remain circles. */
  --r-1:3px;             /* swatches, marks, thin bars, inline code */
               
              
  --r:6px;              /* cards, modals, the outermost surfaces */

  /* Sticky offset for the subject index's group heads (Stage 3). Measured off
     the real box, not guessed: headless Chrome at desktop width put .topbar's
     border-box at 67px (13px padding top/bottom + border-bottom + content);
     the max-width:860px breakpoint drops .topbar's padding to 10px and the
     box to 61px, restated there. One token, used in both places so the
     number never has to be typed twice. */
  --topbar-h:67px;
  --pop:0 7px 18px;
  --pop-lg:0 14px 34px;
  --glow:0 0 0 1px rgba(242,232,213,.07);

  --sh:rgba(0,0,0,.5);
  --sh-soft:rgba(0,0,0,.3);
  --sh-deep:rgba(0,0,0,.65);
  --sheen:var(--card);
  --tint:rgba(242,232,213,.045);
  --tint-2:rgba(242,232,213,.075);

  /* the clinical reading surface */
  --stem:var(--tx);
  --prose:var(--tx);
  --strong:var(--tx);

  --on-fill:var(--tx);
  --on-subject:#fcf8ee;
}

/* ============================================================================
   LIGHT — parchment. Sampled from the user's "Father of Anatomy" card: an aged
   page, warm ink, sienna rule lines. Only tokens are restated; the rules are
   shared with dark.

   The two asymmetries from the previous theme still hold and still matter:
     1. THE RAIL STAYS DARK — it is a carved plinth in both themes, and the ~12
        hardcoded #fff values inside it stay correct.
     2. --gold STAYS BRIGHT — it is a background in 7 places and a text colour
        in none. --ok and --bad DO darken, because accColor() returns them as
        text.
   ============================================================================ */
:root[data-theme="light"]{
  --tx:#302b25;
  --ink:#302b25;
  --ink-2:#5d5549;
  --ink-3:#625a4e;
  --ink-4:#625a4e;   /* secondary labels; measured on all paper tones */

  --bg:#f3ecde;
  --bg-2:#e4dac7;
  --card:#f3ecde;
  --fill:#e0d6c3;    /* raised paper for controls */
  --glass:#f3ecde;
  --glass-2:#f3ecde;

  --line:rgba(60,44,28,.13);
  --line-2:rgba(60,44,28,.22);

  /* rail unchanged — see note 1 above */

  --ok:var(--tx);
  --ok-bg:var(--bg-2);
  --bad:#92294f;
  --bad-bg:rgba(146,41,79,.07);
  --gold:#d9b44a;              /* unchanged — see note 2 above */
  --gold-bg:rgba(116,88,0,.10);
  --hl-y:#e3d3a4;
  --hl-g:#c9d8c0;
  --hl-p:#dfc5c9;
  --hl-b:#c5d2de;
  --warn:#745800;
  --on-accent:#1a150e;
  --gold-text:#745800;   /* bronze. The background gold measures 1.6:1 as text
                            on parchment — unreadable. See the dark block. */

  --glow:0 0 0 1px rgba(74,56,34,.06);
  --sh:rgba(74,56,34,.16);
  --sh-soft:rgba(74,56,34,.10);
  --sh-deep:rgba(74,56,34,.24);
  --sheen:var(--card);
  --tint:rgba(74,56,34,.045);
  --tint-2:rgba(74,56,34,.075);

  --stem:var(--tx);
  --prose:var(--tx);
  --strong:var(--tx);

  --on-fill:var(--tx);
  --on-subject:#fcf8ee;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  /* EB Garamond throughout. It has a small x-height, so the base size goes up
     from 15px to 16.5px — matched by eye against the old Nunito, not converted
     arithmetically, because the two faces set at very different apparent sizes. */
  font-family:var(--font-body);
  background:var(--bg);color:var(--tx);font-size:16.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:var(--light-body-background-image,none);
  background-attachment:fixed;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--line-2);outline-offset:2px;border-radius:var(--r-1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:238px;flex-shrink:0;background:var(--light-rail-background,var(--rail));color:var(--rail-text);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:var(--light-rail-border-right,3px solid #150f33);
}
.rail-head{padding:20px 16px 12px}
.logo{display:flex;align-items:center;gap:9px;color:var(--light-rail-logo-color,var(--on-fill));font-weight:700;font-size:19px}
/* THE MARK IS THE MEDALLION — `Design\Images\Icons\Herophilus 3.png`, the user's choice
   on 2026-07-28, cut to a transparent circle in assets\icon-96.png.

   It replaced a rod-of-Asclepius glyph on a coral→gold gradient square, rotated
   -6deg. None of that survives, and deliberately: the medallion is ALREADY a
   navy disc with its own gold rule, so a coloured tile behind it reads as two
   badges stacked, and rotating a circular seal only tilts the wordmark inside
   it. Every mark below is therefore transparent-backed, unrotated and round.

   Referenced by path, not inlined. `<img src>` is not CORS-restricted the way a
   font or an ES module is, so a relative path works from file:// — inlining
   these would have added ~24 KB of base64 to the shell for nothing. The FAVICON
   is the one that still has to be inlined; see <head>. */
/* The hairline is not decoration. The medallion's ground is navy and the rail is
   near-black (--rail:#080d14), so at 32px the disc reads as a dark blob with no
   edge. A gold ring at 40% separates it and echoes the rule already drawn inside
   the medallion. Checked by rasterising the rail at 1:1, not by eye in source. */
.logo .blip{
  width:32px;height:32px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:var(--light-rail-logo-blip-shadow,0 0 0 1px rgba(217,180,74,.4),0 4px 12px rgba(0,0,0,.45));
}
.blip img,.gmark img{width:100%;height:100%;display:block;border-radius:50%}
.rail-sub{font-size:10.5px;color:var(--rail-dim);margin-top:4px;text-transform:none;font-weight:700}

.streak{
  margin:8px 12px 4px;padding:10px 12px;border-radius:var(--r-1);
  background:var(--light-streak-background,var(--card));
  border:1.5px solid rgba(255,201,74,.3);display:flex;align-items:center;gap:9px;
}
.streak .fl{font-size:17px}
.streak .n{color:var(--light-streak-n-color,#ffd977);font-weight:700;font-size:16px;line-height:1}
.streak .t{font-size:10.5px;color:var(--rail-dim);line-height:1.25;font-weight:600}

.nav{padding:6px 10px 20px;flex:1}
.nav-label{font-size:9.5px;text-transform:none;color:var(--rail-dim);padding:15px 8px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border-radius:var(--r-1);color:var(--rail-text);font-size:13.5px;font-weight:600;
  transition:transform .13s ease,background .13s,color .13s;
}
.nav-item:hover{background:var(--rail-2);color:var(--light-nav-item-hover-color,var(--on-fill));transform:translateX(3px)}
.nav-item.on{background:var(--rail-3);color:var(--light-nav-item-hover-color,var(--on-fill));font-weight:700;}
.nav-item .ic{width:19px;text-align:center;flex-shrink:0;font-size:15px}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--rail-dim);font-variant-numeric:tabular-nums;font-weight:700}
.nav-item.on .cnt{color:var(--rail-text)}
.badge-due{
  margin-left:auto;background:var(--fill);color:var(--on-fill);font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:var(--r-1);min-width:20px;text-align:center;
  
}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:13px 26px;
  border-bottom:1px solid var(--line);background:var(--glass-2);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
}
.search-wrap{position:relative;flex:1;max-width:440px}
.search{
  width:100%;padding:9px 13px 9px 35px;border:2px solid var(--line-2);border-radius:var(--r-1);
  background:var(--card);font-size:13.5px;color:var(--tx);font-weight:600;transition:border-color .14s;
}
.search:focus{border-color:var(--line-2);outline:none}
.search::placeholder{color:var(--ink-4);font-weight:500}
.keyin{
  width:100%;padding:9px 13px;border:2px solid var(--line-2);border-radius:var(--r-1);
  background:var(--card);font-size:13.5px;color:var(--tx);font-weight:600;transition:border-color .14s;
}
.keyin:focus{border-color:var(--line-2);outline:none}
.keyin::placeholder{color:var(--ink-4);font-weight:500}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.results{
  position:absolute;top:calc(100% + 7px);left:0;right:0;background:var(--light-results-background,var(--card));
  border:2px solid var(--line-2);border-radius:var(--r-1);box-shadow:var(--pop-lg) var(--sh);
  max-height:380px;overflow-y:auto;z-index:40;display:none;
}
.results.show{display:block}
.res-item{display:block;width:100%;padding:11px 14px;border:0;border-bottom:1.5px solid var(--line);border-radius:0;cursor:pointer;font-size:13px;color:inherit;text-align:left;background:none}
.res-item:last-child{border-bottom:none}
.res-item:hover{background:var(--bg-2)}
/* A button inside a listbox needs a focus ring the cursor cannot miss — the
   results list lives at the top of the screen, the items are dense, and the
   ring is the only signal that the next Enter is going somewhere real. */
.res-item:focus{outline:none;background:var(--bg-2);}
.res-item.res-more{font-weight:700;color:var(--ink-3)}
.res-tag{display:block;font-size:9.5px;text-transform:none;font-weight:700;margin-bottom:3px}
.res-txt{display:block;color:var(--ink-2);line-height:1.45}
.res-empty{padding:16px 14px;color:var(--ink-4);font-size:13px}

.topbar-actions{margin-left:auto;display:flex;gap:7px;align-items:center}
/* On a narrow phone the topbar's fixed furniture leaves the search box 121px
   wide, of which 73px is text room: measured at 360px, and no useful
   placeholder fits in it — even "Search questions" needs 91px. The button
   that goes is the keyboard-shortcuts one, because a device with no keyboard
   cannot press anything the dialog lists; it is the only control here that is
   not merely cramped but meaningless. That returns 48px to the search. */
@media(max-width:520px){ .kbd-btn{display:none} }
.tb-btn{padding:7px 12px;border-radius:var(--r-1);font-size:12.5px;color:var(--ink-3);font-weight:700;transition:background .13s,transform .13s}
.tb-btn:hover{background:var(--bg-2);color:var(--tx);transform:translateY(-1px)}
/* Touch. The nav rows are 36px tall and the topbar buttons 33-36px, both under
   the 44px minimum. The nav is a vertical list, so it can simply grow. The
   topbar cannot: four 44px buttons would push a sticky bar to ~70px and take
   that height off every screen, so those get an invisible 44px hit area
   centred on the button instead and the bar keeps its size. The 14px gap
   between them is wider than the 3px each overlay adds, so they do not
   overlap — two overlapping targets only move the mis-tap elsewhere. */
@media(hover:none){
  .nav-item{min-height:44px}
  .tb-btn{position:relative}
  .tb-btn::after{
    content:"";position:absolute;left:50%;top:50%;width:100%;height:44px;
    min-width:44px;transform:translate(-50%,-50%);
  }
}

/* The saving warning is inserted as a sibling of .page rather than inside it,
   because the page is rebuilt on every answer and the notice must outlive that.
   Living outside the column, it has to restate the column's own width or it
   would run edge to edge while everything below it stays inset: 1124px is the
   page's 1180px capped column less its 28px of padding on either side, so the
   notice lines up with the heading underneath it rather than overhanging it. */
#saveWarning, #dataWarning{
  max-width:1124px;width:calc(100% - 56px);margin:22px auto -6px;padding:16px 18px;
  border:1px solid var(--bad);border-radius:var(--r-1);background:var(--bad-bg);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
#saveWarning p, #dataWarning p{margin:0;flex:1;min-width:260px;font-size:14px;line-height:1.55;color:var(--tx)}
#saveWarning strong, #dataWarning strong{color:var(--bad)}
#saveWarning .btn, #dataWarning .btn{flex:none}
#saveWarning .warnico, #dataWarning .warnico{flex:none;font-size:19px;font-weight:900;color:var(--bad)}
.page{padding:28px;max-width:1180px;width:100%;margin:0 auto;flex:1}
/* The dashboard is narrower than every other view, and deliberately so. Module
   cards are capped at two per row so the artwork is worth showing, which puts
   the grid's right edge at 880px — and against a 1180px column that left a
   244px hole down the right of the page that nothing filled and nothing
   explained. Everything on this view now ends at the same place: 880px of
   content plus the page's own 28px either side. Only this view moves; the
   reader, the quiz and the theory pages keep the wider measure they were set
   in. Scoped to screen so the print block's max-width still wins on paper. */
@media screen{body[data-view="home"] .page{max-width:936px}}
/* The dashboard narrows, so the notice above it narrows by the same amount,
   or it would hang past both edges of the only content on that screen. */
@media screen{body[data-view="home"] #saveWarning, body[data-view="home"] #dataWarning{max-width:880px}}

/* ---------- Type ---------- */
/* The heading hierarchy is size and weight in the body serif. */
h1{font-family:var(--font-display);font-size:29px;font-weight:700;
   margin:0 0 5px;line-height:1.18;text-transform:none}
h2{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0 0 13px}
.page-sub{color:var(--ink-3);font-size:14px;margin:0 0 26px;font-weight:500;max-width:640px;line-height:1.55}
.eyebrow{
  display:inline-block;font-size:10px;text-transform:none;font-weight:700;
  padding:4px 11px;border-radius:var(--r-1);background:var(--fill);color:var(--on-fill);margin-bottom:11px;
}

/* ---------- Cards ---------- */
.grid{display:grid;gap:15px}
.g3{grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.card{
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
  padding:17px;text-align:left;width:100%;
  transition:transform .15s ease;
}
button.card:hover:not(:disabled){transform:translate(-2px,-2px);}
button.card:active:not(:disabled){transform:translate(1px,1px);}

.mod-card{position:relative;overflow:hidden}
.mod-card::after{
  content:"";position:absolute;right:-24px;top:-24px;width:74px;height:74px;border-radius:50%;
  background:var(--fill);opacity:.11;
}
.mod-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mod-ic{
  width:36px;height:36px;border-radius:var(--r-1);background:var(--fill);display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;
}
.mod-name{font-weight:700;font-size:17.5px;}
.mod-meta{font-size:12px;color:var(--ink-3);margin-bottom:13px;font-weight:600}

.ringrow{display:flex;align-items:center;gap:13px}
.ring{width:52px;height:52px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rv{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
}
.ringmeta{flex:1;min-width:0}
.ringmeta .a{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ringmeta .b{font-size:11.5px;color:var(--ink-3);font-weight:600}
/* Stands in for the ring on a subject nobody has opened. Height is matched to
   the ring's 52px so a card that has just earned its first answer changes what
   it says without changing what it measures. Colour is --tx, not the module's
   own: brand colour as text on the card ground has not been measured, and §6
   says that is chosen by measurement rather than habit. */
.mod-card .startrow{min-height:52px}
.mod-card .startgo{
  font-family:var(--font-display);font-size:13.5px;font-weight:600;
  text-transform:none;color:var(--tx);
}

.stat{
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);padding:15px;
  position:relative;overflow:hidden;
}
.stat .n{font-size:31px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-weight:700}
.stat .emo{position:absolute;right:11px;top:10px;font-size:19px;opacity:.3}

/* ---------- Chapter rows ---------- */
.grouphdr{
  display:flex;align-items:center;gap:10px;margin:24px 0 11px;
  font-size:10.5px;text-transform:none;font-weight:700;color:var(--ink-3);
}
.grouphdr::after{content:"";flex:1;height:2.5px;background:var(--line);border-radius:var(--r-1)}
.ch-row{
  display:flex;align-items:center;gap:13px;padding:12px 15px;background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-1);margin-bottom:9px;width:100%;text-align:left;
  
  transition:transform .13s ease;
}
.ch-row:hover:not(:disabled){transform:translate(-2px,-2px);}
.ch-row:disabled{opacity:.45;cursor:default;border-style:dashed}
.ch-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2px solid var(--line-2)}
.ch-name{flex:1;font-size:14px;font-weight:700}
.ch-count{font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums;font-weight:700}
.ch-acc{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
/* On the weakest-chapters page the rows come from four different modules, so
   each name has to say which one it belongs to. */
.wk-mod{display:block;font-size:11px;font-weight:700;color:var(--ink-4);
  text-transform:none;margin-top:2px}

/* ---------- Subject index — table of contents (Stage 3) ----------------
   .grouphdr and .ch-row are shared with Weak/Session/Schedule/the profile
   switcher, which keep the card look untouched. vModule adds a second class
   to its own markup only, so these rules reach nothing else: .toc-hdr for
   the sticky group head, .toc-row for the gridded line. Both selectors pair
   two classes on purpose — that beats the base .ch-row:hover rule's own
   specificity regardless of source order. */
.grouphdr.toc-hdr{
  position:sticky;top:var(--topbar-h);z-index:5;background:var(--bg);
  padding:6px 0 6px 10px;margin:24px 0 11px;
}
.ch-row.toc-row{
  display:grid;grid-template-columns:26px 11px 1fr 116px 44px;
  column-gap:13px;align-items:center;
  /* A contents page wants a fainter rule than a card, which also leaves the
     hairline family somewhere to go on hover. */
  border-color:var(--line);
}
/* A line in a table of contents does not levitate — change of paper tone
   and the border brightening stand in for the lift the rest of the app
   still uses on real cards. */
.ch-row.toc-row:hover:not(:disabled){
  transform:none;background:var(--bg-2);border-color:var(--line-2);
}
.ch-num{
  font-size:11px;font-weight:700;color:var(--ink-4);
  font-variant-numeric:tabular-nums;text-align:right;
}
.ch-row.toc-row .ch-count{text-align:right}
/* A grid track sized 1fr is floored by its own min-content, so a single long
   word — 'immunodeficiency' is the worst in the shipping banks — pushed the
   row wider than the phone. Let the name shrink and wrap instead. */
.ch-row.toc-row .ch-name{min-width:0;overflow-wrap:break-word}

/* On a phone the five columns cannot all fit: 360px leaves the name 53px.
   The count drops under the name and the accuracy spans both lines, which
   keeps the numbers in a column and the name readable. */
@media(max-width:600px){
  .ch-row.toc-row{grid-template-columns:22px 10px 1fr 44px;column-gap:10px;row-gap:3px}
  .ch-row.toc-row .ch-num{grid-row:1/3}
  .ch-row.toc-row .ch-dot{grid-row:1/3}
  .ch-row.toc-row .ch-name{grid-column:3;grid-row:1}
  .ch-row.toc-row .ch-count{grid-column:3;grid-row:2;text-align:left}
  .ch-row.toc-row .ch-acc{grid-column:4;grid-row:1/3}
}

/* ---------- Question ---------- */
.qwrap{max-width:830px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:17px;flex-wrap:wrap}
/* The exam clock rides after .qprog, which already carries margin-left:auto,
   so the pair sits at the right end of the head together. Tabular figures
   because a proportional 1 is narrower than a 0 and the whole clock jitters
   sideways once a second otherwise. */
.exam-clock{
  font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;
  padding:6px 12px;border-radius:var(--r-1);border:2px solid var(--line-2);background:var(--fill);
  color:var(--tx);white-space:nowrap;
}
.exam-clock.low{color:var(--warn);border-color:var(--warn)}
.exam-clock.out{color:var(--bad);border-color:var(--bad)}
.pill{
  font-size:10px;font-weight:700;text-transform:none;padding:4px 11px;
  border-radius:var(--r-1);color:var(--on-fill);border:2px solid var(--line-2);
}
/* The source citation reuses .pill, but it is a SENTENCE, not a label — often a
   long one with a page number and a transcription note. Uppercase at 10px suits
   "ENDPOINT"; it turns a citation into a wall, and EB Garamond's capitals are
   wider than the sans this was designed against. Sentence case, slightly larger,
   and allowed to wrap. */
.pill.ghost{
  background:var(--bg-2);color:var(--ink-3);
  text-transform:none;font-size:11.5px;font-weight:600;
  line-height:1.5;text-align:left;white-space:normal;border-radius:var(--r-1);padding:5px 11px;
}
.qprog{
  margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700;
  background:var(--card);padding:4px 11px;border-radius:var(--r-1);border:2px solid var(--line-2);
}

.qcard{background:var(--card);border:3px solid var(--line-2);border-radius:var(--r);padding:27px 29px;}
.stem{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:16.5px;line-height:1.64;color:var(--tx);margin-bottom:21px;
}
.stem p{margin:0 0 12px}
.stem p:last-child{margin-bottom:0}
.stem table{border-collapse:separate;border-spacing:0;width:100%;margin:13px 0;font-size:13px;font-family:var(--font-body);font-variant-numeric:tabular-nums;border:2px solid var(--line-2);border-radius:var(--r-1);overflow:hidden}
.stem th,.stem td{border-bottom:1.5px solid var(--line);padding:7px 10px;text-align:left}
.stem th{background:var(--bg-2);font-weight:700}
.stem tr:last-child td{border-bottom:none}

/* The clinical photograph some questions cannot be answered without. It sits
   between the stem and the options because that is where the paper prints it,
   and because an answer chosen before looking at the picture is not an answer.
   Capped rather than stretched: the crops top out around 560px and enlarging
   past their own resolution only makes a scan look worse. */
.qfig{margin:0 0 21px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.qfig img{max-width:min(100%,430px);height:auto;display:block;border-radius:var(--r-1);
  border:2px solid var(--line-2);background:var(--on-fill);cursor:zoom-in}
/* A failed figure takes the image's place in the flow rather than sitting over
   it, so the box it needs is sized on the message itself. Reserving that height
   on every figure instead would pad the two dozen crops that render shorter
   than the reserve — the shortest is 112px against a message that needs 150. */
.qfig-media{width:100%;max-width:430px}
.qfig-failure:not([hidden]){display:flex;align-items:center;justify-content:center;
  min-height:150px;margin:0;padding:18px;border:2px solid var(--line-2);border-radius:var(--r-1);
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55}
.qzoom .qfig-failure:not([hidden]){max-width:430px}
.qfig figcaption{font-size:11.5px;color:var(--ink-2)}
/* Full-size look. The crops carry fine detail — a speck of debris, a leader
   line — that a 430px column cannot show. */
.qzoom{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(3,7,14,.86);cursor:zoom-out}
.qzoom img{max-width:100%;max-height:100%;border-radius:var(--r-1);background:var(--on-fill);box-shadow:0 20px 60px rgba(0,0,0,.5)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:13px;align-items:flex-start;padding:13px 16px;
  border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--card);
  text-align:left;width:100%;line-height:1.5;font-weight:600;
  transition:transform .12s ease,border-color .12s;
}
.opt:hover:not(:disabled){border-color:var(--line-2);transform:translateX(4px);}
.opt:disabled{cursor:default}
.opt .ltr{
  width:26px;height:26px;border-radius:var(--r-1);border:2.5px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  flex-shrink:0;color:var(--ink-3);margin-top:1px;transition:all .12s;
}
.opt.sel{border-color:var(--line-2);background:var(--tint);transform:translateX(4px);}
.opt.sel .ltr{background:var(--fill);border-color:var(--line-2);color:var(--on-fill)}
.opt.correct{border-color:var(--line-2);background:var(--bg-2);}
.opt.correct .ltr{background:var(--fill);border-color:var(--ok);color:var(--on-fill)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:var(--on-fill)}
.opt .mark{margin-left:auto;font-weight:700;font-size:19px;flex-shrink:0;line-height:1}
.opt.correct .mark{color:var(--ok)}
.opt.wrong .mark{color:var(--bad)}

.qactions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.btn{
  padding:11px 20px;border-radius:var(--r-1);font-size:13.5px;font-weight:700;
  background:var(--fill);color:var(--on-fill);border:1px solid var(--line-2);
  transition:transform .13s ease;
}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);}
.btn:active:not(:disabled){transform:translate(1px,1px);}
.btn:disabled{opacity:.32;cursor:default;}
.btn.sec{background:var(--card);color:var(--tx)}
.btn.go{background:var(--fill);border-color:var(--line-2)}
.btn.flag.on{background:var(--gold);color:var(--tx)}
/* a destructive button was marked by a red border only — a glyph says it too */
.btn[style*="--bad"]::before{content:"! ";font-weight:900}

@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.verdict{
  margin-top:21px;padding:15px 18px;border-radius:var(--r-1);font-weight:700;font-size:15px;
  display:flex;align-items:center;gap:11px;border:1px solid var(--line-2);animation:pop .32s cubic-bezier(.34,1.56,.64,1);
}
.verdict.ok{background:var(--ok-bg);color:var(--tx);}
.verdict.bad{background:var(--bad-bg);color:var(--bad);}
.verdict.part{background:var(--gold-bg);color:var(--warn);}
.verdict .big{font-size:22px}

/* ---- free-text case questions ---- */
.caseask{margin-top:19px;font-weight:700;font-size:14px;color:var(--ink-2)}
.caseinput{
  width:100%;margin-top:9px;padding:13px 15px;font:inherit;font-size:15px;line-height:1.5;
  border:1px solid var(--line-2);border-radius:var(--r-1);background:var(--card);color:var(--tx);
  resize:vertical;
  transition:transform .18s ease;
}
.caseinput:focus{outline:none;transform:translate(-1px,-1px);}
.caseinput:disabled{opacity:.75;cursor:default}
.caseinput::placeholder{color:var(--ink-2);opacity:.6}
.modelans{
  margin-top:15px;padding:14px 17px;border:1px solid var(--line-2);border-radius:var(--r-1);
  background:var(--bg-2);
}
.modelans>b{display:block;font-size:11.5px;text-transform:none;color:var(--ink-2);margin-bottom:5px}
.modelans>div{font-weight:700;font-size:15px}
.keys{margin-top:14px;padding:13px 16px;border:2.5px dashed var(--line-2);border-radius:var(--r-1)}
.keys-h{font-size:11.5px;text-transform:none;color:var(--ink-2);font-weight:700;margin-bottom:9px}
.key{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:14px;font-weight:700}
.key.hit>span:first-child{color:var(--ok);font-weight:700}
.key.miss{opacity:.55}
.lastgo{
  display:inline-flex;align-items:center;gap:7px;margin-top:9px;
  padding:5px 12px;border:2px dashed var(--line-2);border-radius:var(--r-1);
  font-size:12px;font-weight:700;color:var(--ink-2);opacity:.85}

.conf{margin-top:17px;padding:15px 17px;background:var(--gold-bg);border:1px solid var(--line-2);border-radius:var(--r-1);}
.conf-q{font-size:13px;color:var(--ink-2);margin-bottom:11px;font-weight:700}
.conf-btns{display:flex;gap:8px;flex-wrap:wrap}
.conf-b{
  padding:8px 15px;border:1px solid var(--line-2);border-radius:var(--r-1);font-size:12.5px;
  background:var(--card);font-weight:700;transition:transform .12s ease;
}
.conf-b:hover{transform:translateY(-2px);}
.conf-b.on{background:var(--fill);color:var(--on-fill)}

.explain{margin-top:18px;border:1px solid var(--line-2);border-radius:var(--r-1);overflow:hidden;}

/* Two quiet routes out of a question: a note the student writes to themselves,
   and the one way to tell us the question itself is wrong. Both sit under the
   explanation as plain underlined text — a student who wants them will find
   them, and a student who does not is never asked anything. */
.qfoot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:16px}
.qfoot .lnk{background:none;border:none;padding:0;font:inherit;font-size:12.5px;font-weight:700;
  color:var(--ink-2);border-bottom:2px solid var(--line);cursor:pointer;
  transition:color .13s,border-color .13s}
.qfoot .lnk:hover{color:var(--tx);border-bottom-color:var(--tx)}
.qfoot .lnk.has{color:var(--gold);border-bottom-color:var(--gold)}
.qnote{margin-top:13px}
.qnote .lb{display:block;font-size:11.5px;font-weight:700;
  text-transform:none;color:var(--ink-2);margin-bottom:7px}
.qnote .say{font-size:12px;color:var(--ink-2);margin-top:7px;min-height:16px}
.ex-head{
  display:flex;align-items:center;gap:10px;padding:13px 17px;background:var(--bg-2);
  width:100%;text-align:left;font-weight:700;font-size:13.5px;transition:background .13s;
}
.ex-head:hover{background:rgba(255,255,255,.07)}
.ex-head .chev{margin-left:auto;transition:transform .22s ease}
.ex-head.open .chev{transform:rotate(180deg)}
.ex-body{padding:19px 21px;font-size:14.3px;line-height:1.68;color:var(--ink-2);display:none}
.ex-body.open{display:block;animation:pop .24s ease}
.ex-body p{margin:0 0 13px}
.ex-body p:last-child{margin-bottom:0}
.ex-body strong{color:var(--tx);font-weight:700}
.ex-body em{color:var(--ink-3)}
.objective{
  margin-top:17px;padding:14px 17px;background:var(--card);
  border:2.5px solid var(--line-2);border-radius:var(--r-1);font-size:13.8px;line-height:1.6;
}
.objective b{display:block;font-size:10px;text-transform:none;color:var(--tx);margin-bottom:5px;font-weight:700}
.noexp{padding:17px 21px;color:var(--ink-4);font-size:13.5px;font-style:italic}

/* ---------- Schedule ---------- */
.sched-legend{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:20px;font-size:12.5px;color:var(--ink-3);font-weight:700}
.leg{display:flex;align-items:center;gap:7px}
.leg .sw{width:13px;height:13px;border-radius:var(--r-1);border:2px solid var(--line-2)}
.day{
  display:flex;gap:14px;align-items:center;padding:13px 15px;background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-1);margin-bottom:9px;
  transition:transform .13s;
}
.day:hover{transform:translate(-1px,-1px);}
.day.rest{background:var(--bg-2);opacity:.72;border-style:dashed}
.day.missed{background:var(--bad-bg);border-color:var(--bad)}
.day.done{background:var(--bg-2);border-color:var(--line-2)}
.day.today{border-color:var(--line-2);}
.day-date{width:74px;flex-shrink:0}
.day-d{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;}
.day-w{font-size:10.5px;color:var(--ink-4);font-weight:700;text-transform:none;}
.day-body{flex:1;min-width:0}
.day-line{font-size:13.2px;margin-bottom:4px;line-height:1.45;font-weight:600}
.day-line:last-child{margin-bottom:0}
.day-line.faded{opacity:.45;text-decoration:line-through}
.tag{
  display:inline-block;font-size:9.5px;font-weight:700;text-transform:none;
  padding:3px 10px;border-radius:var(--r-1);color:var(--on-fill);margin-right:10px;vertical-align:1.5px;
  border:1.5px solid var(--line-2);white-space:nowrap;
}
.movednote{font-size:11px;color:var(--tx);font-weight:700;margin-top:4px}
.day-marks{display:flex;gap:7px;flex-shrink:0}
.mk{
  width:38px;height:38px;border-radius:var(--r-1);border:1px solid var(--line-2);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:transform .13s ease,background .13s;
  
}
.mk:hover{transform:translate(-1px,-1px);}
.mk:active{transform:translate(1px,1px);}
.mk.done.on{background:var(--ok);color:var(--on-fill)}
.mk.miss.on{background:var(--bad);color:var(--on-fill)}
.mk .lbl{position:absolute;opacity:0;pointer-events:none}
/* Touch. These are 38px, under the 44px minimum, and the two of them sit 7px
   apart while meaning opposite things — the schedule renders 119 rows, so 238
   of them are on the page at once and a mis-tap is likeliest exactly here.
   Growing the target without growing the gap would trade one error for
   another, so both move. A portrait tablet is 768px and is still a finger, so
   this is keyed on the pointer as well as on the width, not on width alone. */
@media(max-width:700px),(hover:none){
  .day-marks{gap:10px}
  .mk{width:44px;height:44px;border-radius:var(--r-1);font-size:17px}
}


.track{
  display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:1.5px dashed var(--line);
}
.track:last-child{border-bottom:none}
.track-body{flex:1;min-width:0;font-size:13.4px;font-weight:600;line-height:1.55}
.track.is-done .track-body{opacity:.6}
.track.is-missed .track-body{opacity:.55;text-decoration:line-through}
.track.catchup{background:var(--tint);border-radius:var(--r-1);padding:8px 11px;margin-top:5px;border:1.5px dashed var(--line-2)}
.day{align-items:stretch}
.day-body{display:flex;flex-direction:column;justify-content:center}


/* ---------- Highlighter ---------- */
mark.hl{background:var(--hl-y);padding:1.5px 1px;border-radius:var(--r-1);color:inherit;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* Shared paper-wash tokens keep the picker and saved annotation ids in step. */
mark.hl[data-c="y"],.pen.y{background:var(--hl-y);}
mark.hl[data-c="g"],.pen.g{background:var(--hl-g);}
mark.hl[data-c="p"],.pen.p{background:var(--hl-p);}
mark.hl[data-c="b"],.pen.b{background:var(--hl-b);}

.mkbar{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:15px;
  padding:9px 12px;background:var(--bg-2);border:2px dashed var(--line-2);border-radius:var(--r-1);
}
.mkbar .lb{font-size:10.5px;font-weight:700;text-transform:none;color:var(--ink-3);margin-right:2px}
.pen{
  width:29px;height:29px;border-radius:var(--r-1);border:2.5px solid var(--line-2);
  transition:transform .13s ease;
  position:relative;
}
.pen:hover{transform:translate(-1px,-1px);}
.pen.on{transform:translateY(-3px);}
.pen.on::after{content:"";position:absolute;inset:-6px;border:2.5px solid var(--line-2);border-radius:var(--r-1)}
.pen.er{background:var(--card);font-size:14px;display:flex;align-items:center;justify-content:center}
.mkbar .hint{font-size:11.5px;color:var(--ink-4);font-weight:600;margin-left:auto}
.mkbar .clr{
  font-size:11.5px;font-weight:700;color:var(--ink-3);padding:5px 11px;border-radius:var(--r-1);
  border:2px solid var(--line-2);background:var(--card);
}
.mkbar .clr:hover{border-color:var(--line-2);color:var(--tx)}
.stem{-webkit-user-select:text;user-select:text}
.stem.arm{cursor:crosshair}


/* ---------- Jump navigator ---------- */
.modal.wide{max-width:660px}
.jumprow{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.jumpin{
  width:112px;padding:9px 13px;border:1px solid var(--line-2);border-radius:var(--r-1);
  font-size:14px;font-weight:700;background:var(--card);color:var(--tx);
  
}
.jumpin::-webkit-outer-spin-button,.jumpin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.jumpin{-moz-appearance:textfield}
.jumpkey{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);font-weight:700;margin-bottom:13px}
.jumpkey .k{display:flex;align-items:center;gap:6px}
.jumpkey .sw{width:13px;height:13px;border-radius:var(--r-1);border:2px solid var(--line-2)}
.qgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;
  max-height:42vh;overflow-y:auto;padding:5px 3px;
}
.qg{
  aspect-ratio:1;border-radius:var(--r-1);border:1px solid var(--line-2);font-weight:700;font-size:12.5px;
  background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;
  
  transition:transform .12s ease;
}
.qg:hover{transform:translate(-2px,-2px);}
.qg.ok{background:var(--ok-bg);color:var(--tx);border-color:var(--ok)}
.qg.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
/* colour alone told ok from bad; a corner glyph says it too, so the grid
   still reads with the two states' hues collapsed */
.qg.ok::before{content:"\2713";position:absolute;left:2px;bottom:0;font-size:9px;line-height:1;color:var(--ok)}
.qg.bad::before{content:"\00d7";position:absolute;left:2px;bottom:0;font-size:10px;line-height:1;color:var(--bad)}
/* During a paper the grid may say only whether a question has been answered.
   Right and wrong are the marks, and the marks come out at hand-in. */
.qg.done{background:var(--fill);border-color:var(--tx);color:var(--tx)}
.qg.cur{background:var(--fill);color:var(--on-fill);transform:translate(-2px,-2px);}
.qg.flagged::after{
  content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;
  background:var(--gold);border:2px solid var(--line-2);border-radius:50%;
}
.qprog{border:2px solid var(--line-2);cursor:pointer;transition:transform .12s}
.qprog:hover{transform:translate(-1px,-1px);}



/* ---------- Schedule editor ---------- */
.edbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.day.editing{border-style:dashed;border-color:var(--line-2);background:var(--tint)}
.ed-item{display:flex;gap:8px;align-items:center;padding:7px 0;flex-wrap:wrap}
.ed-lab,.ed-txt{
  padding:7px 11px;border:2px solid var(--line-2);border-radius:var(--r-1);font-size:12.8px;
  background:var(--card);color:var(--tx);font-weight:600;font-family:inherit;
}
.ed-lab{width:132px;flex-shrink:0}
.ed-txt{flex:1;min-width:150px}
.ed-lab:focus,.ed-txt:focus{border-color:var(--line-2);outline:none}
.ed-col{width:30px;height:30px;border-radius:var(--r-1);border:2.5px solid var(--line-2);flex-shrink:0;cursor:pointer}
.ed-x{
  width:29px;height:29px;border-radius:var(--r-1);border:2px solid var(--bad);color:var(--bad);
  background:var(--card);font-weight:700;flex-shrink:0;font-size:13px;
}
.ed-x:hover{background:var(--bad-bg)}
.ed-add{
  font-size:11.5px;font-weight:700;color:var(--tx);padding:6px 12px;border-radius:var(--r-1);
  border:2px dashed var(--line-2);background:transparent;margin-top:5px;
}
.ed-add:hover{background:var(--tint)}
.ed-day-tools{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap}
.ed-t{
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:var(--r-1);border:2px solid var(--line-2);
  background:var(--card);color:var(--ink-3);
}
.ed-t:hover{border-color:var(--line-2);color:var(--tx)}
.ed-t.danger{border-color:var(--bad);color:var(--bad)}
.ed-t.on{background:var(--fill);color:var(--on-fill);border-color:var(--line-2)}
.newday{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px;margin-top:10px;
  border:2.5px dashed var(--line-2);border-radius:var(--r-1);background:var(--card)}
.newday input[type=date]{padding:8px 11px;border:2px solid var(--line-2);border-radius:var(--r-1);
  font-family:inherit;font-size:13px;font-weight:600;background:var(--card);color:var(--tx)}
.palette{display:flex;gap:6px;flex-wrap:wrap}
.pal{width:24px;height:24px;border-radius:var(--r-1);border:2.5px solid var(--line-2);cursor:pointer}
.pal.on{transform:translateY(-3px)}


/* ---------- Profile gate ----------
   TWO STEPS: sign in, then choose or create a profile. showGate() renders one
   at a time and re-writes innerHTML to move between them, which is also what
   replays the entrance animations — new elements, so they run again.

   The gate sits at z-index 200, ABOVE .app, so the page's ambient orb field is
   hidden behind it and it needs its own. Tuned brighter and faster than the
   page's: this is a five-second screen, not one you read on, so the
   CALM-TO-READ half of the rule does not apply here.                          */
.gate{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 20px;overflow-y:auto;isolation:isolate;
}
.gate.hide{display:none}

.gate-amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
/* .5 before the film went in behind them. Same lesson as the page's orbs: two
   ambient systems at full strength cancel, and an 80px blur at half opacity
   simply fogs the room away. */
.gate-amb .gorb{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--light-gate-amb-gorb-opacity,.34);will-change:transform}
/* one orb per module, in the module's own colour — the four colours of the app
   are the first thing you see */
.gate-amb .g1{width:44vw;height:44vw;left:-10vw;top:-16vh;background:radial-gradient(circle,var(--neuro),transparent 68%);animation:gd1 26s ease-in-out infinite}
.gate-amb .g2{width:38vw;height:38vw;right:-8vw;top:-6vh;background:radial-gradient(circle,var(--ent),transparent 68%);animation:gd2 31s ease-in-out infinite}
.gate-amb .g3{width:40vw;height:40vw;left:14vw;bottom:-22vh;background:radial-gradient(circle,var(--peds),transparent 70%);animation:gd3 37s ease-in-out infinite}
.gate-amb .g4{width:26vw;height:26vw;right:12vw;bottom:-14vh;background:radial-gradient(circle,var(--ophtho),transparent 72%);opacity:var(--light-gate-amb-g4-opacity,.34);animation:gd1 43s ease-in-out infinite reverse}
@keyframes gd1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(7vw,6vh,0) scale(1.14)}}
@keyframes gd2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-8vw,8vh,0) scale(1.1)}}
@keyframes gd3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,-7vh,0) scale(1.16)}}
:root[data-theme="light"] .gate-amb .gorb{--light-gate-amb-gorb-opacity:.26}
:root[data-theme="light"] .gate-amb .g4{--light-gate-amb-g4-opacity:.18}

/* THE GATE IS THE ONE PLACE TEXT SITS DIRECTLY ON THE FILM.
   Everywhere else in the app the type is on an opaque card, which is why the
   film cost nothing in contrast — measured, twice. Here there is no card, and
   the ground underneath MOVES: the scholar's pale robe drifts behind the small
   print, so contrast would rise and fall frame by frame and the worst frame is
   the one that matters. This pool fixes a constant ground under the centre
   column while leaving the lamp and the edges of the room fully visible. */
.gate-amb .film-scrim::after{
  content:'';position:absolute;inset:0;
  background:var(--light-gate-amb-film-scrim-after-background,radial-gradient(46% 42% at 50% 52%,
    rgba(7,13,22,.88) 0%, rgba(7,13,22,.72) 45%, transparent 78%));
}
:root[data-theme="light"] .gate-amb .film-scrim::after{
  --light-gate-amb-film-scrim-after-background:radial-gradient(46% 42% at 50% 52%,
    rgba(247,244,236,.92) 0%, rgba(247,244,236,.78) 45%, transparent 78%);
}

/* A faint grid, masked to fade out at the edges. Without it four big blurs on
   a flat ground read as soup; the straight lines give the blur something to be
   soft against. */
.gate::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:none;
  background-size:64px 64px;
  -webkit-mask-image:none;
          mask-image:none;
}

.gstep{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:780px}
.gate-theme{position:absolute;top:16px;right:16px;z-index:3;font-size:15px}

/* Each child rises in on its own --d delay, set inline where the markup is
   built. BACKWARDS, not BOTH: `both` would leave the final keyframe stuck on
   the element, and its transform:none then beats .pcard:hover. */
/* .pgrid is excluded: its own .pcard children stagger individually, and
   animating the container too makes the cards arrive twice. */
.gstep>*:not(.pgrid){animation:gRise .62s cubic-bezier(.22,1,.36,1) var(--d,0ms) backwards}
@keyframes gRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.gmark{
  position:relative;width:88px;height:88px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 18px 44px rgba(0,0,0,.5),var(--glow);margin-bottom:22px;
}
/* a slow sonar ring — the one piece of continuous motion on the sign-in step.
   Gold, not ENT coral: it echoes the medallion's own rule instead of fighting it. */
.gmark::after{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid var(--gold);animation:halo 3.6s ease-out infinite;
}
@keyframes halo{0%{transform:scale(.92);opacity:.55}70%,100%{transform:scale(1.25);opacity:0}}

/* The wordmark is set once, in the display face, and holds still. It used to
   carry a four-stop gradient walked across it by a nine-second loop: the one
   device on this page that announced itself before the app had said anything,
   and the first thing a reader takes for decoration rather than design. The
   tracking is positive because Cinzel is tracked out everywhere else it is
   used, and a titling face set tight is the tell that nobody chose it. */
.gtitle{
  font-size:clamp(28px,6vw,36px);font-weight:700;margin:0 0 10px;
  color:var(--tx);
  animation:gRise .62s cubic-bezier(.22,1,.36,1) var(--d,0ms) backwards;
}
.gtag{font-size:14.5px;color:var(--ink-3);font-weight:600;margin:0 0 30px;text-align:center;max-width:430px;line-height:1.6}
.glink{
  margin-top:18px;font-size:13px;font-weight:700;color:var(--ink-3);
  padding:9px 17px;border-radius:var(--r-1);transition:color .15s,background .15s;
}
.glink:hover{color:var(--tx);background:var(--tint-2)}
.gnote{font-size:11.8px;color:var(--ink-4);font-weight:600;max-width:400px;text-align:center;line-height:1.65;margin:26px 0 0}
.gnote.warn{color:var(--warn);border:2px solid var(--warn);border-radius:var(--r-1);padding:12px 15px}
.gwho{
  display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:var(--r-1);
  background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);
  font-size:12.5px;font-weight:700;margin-bottom:22px;
}
.gate .glogo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:24px;margin-bottom:6px}
.gate .glogo .blip,.splash .glogo .blip{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 7px 18px rgba(0,0,0,.35);flex-shrink:0;
}
.gate h2{font-size:19px;color:var(--ink-3);font-weight:700;margin:0 0 26px}
.pgrid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:760px}
.pcard{
  width:132px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:transparent;transition:transform .16s ease;
  animation:gRise .62s cubic-bezier(.22,1,.36,1) var(--d,0ms) backwards;
}
.pcard:hover{transform:translateY(-5px)}
.pav{
  width:96px;height:96px;border-radius:var(--r);border:3px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;
  position:relative;
}
.pcard:hover .pav{}
.pav img{width:100%;height:100%;object-fit:cover;display:block}
.pav .lock{
  position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;
  background:var(--gold);border:2.5px solid var(--line-2);display:flex;align-items:center;
  justify-content:center;font-size:12px;
}
.pname{font-weight:700;font-size:14.5px;text-align:center;line-height:1.3;word-break:break-word}
.pcard.add .pav{border-style:dashed;background:var(--card);font-size:38px;color:var(--ink-4);}
.pcard.add:hover .pav{border-color:var(--line-2);color:var(--tx)}
.gate .gfoot{margin-top:34px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gate .goffline{margin:20px auto 0;max-width:460px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--ink-4)}

/* Year and semester. This was two native <select> boxes — the only unstyled
   controls left in the app, and they landed on the gate, which is the first
   thing a new student sees. A white operating-system rectangle on a dark
   cinematic page does not read as a plain control; it reads as a page that was
   never finished. The chips borrow .chip's shape and .emb's selected state so
   this is the app's existing vocabulary rather than a third one. */
.tpick{display:flex;flex-direction:column;gap:18px;align-items:center;width:100%}
.tlab{
  font-size:11px;font-weight:700;text-transform:none;
  color:var(--ink-4);margin:0 0 9px;text-align:center;
}
.trow{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.tchip{
  padding:9px 17px;border:1px solid var(--line-2);border-radius:var(--r-1);
  background:var(--card);color:var(--tx);font-size:13px;font-weight:700;
  transition:transform .13s ease,background .13s,color .13s;
}
.tchip:hover:not(.on){transform:translateY(-2px);}
.tchip.on{background:var(--fill);color:var(--on-fill);}
/* The status line is what the old copy's "some semesters have no published
   content yet" was trying to say, except it says it about the semester the
   student is actually looking at, at the moment they select it. A student who
   picks an empty semester and gets an empty app otherwise has no way to tell a
   deliberate gap from a broken build. */
.tstat{
  font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:center;
  max-width:430px;line-height:1.6;margin:2px 0 0;min-height:20px;
}
.tstat.empty{color:var(--ink-4)}

/* Four across, not eight. A face needs room to be recognised, and eight tiles
   in a modal left each one about 44px wide — enough for a line emblem, not
   enough for a portrait. Two rows of four is the same eight choices at twice
   the size. */
.emgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.emb{
  aspect-ratio:1;border-radius:var(--r-1);border:2.5px solid var(--line-2);background:var(--card);
  font-size:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:transform .12s ease;
}
.emb:hover{transform:translateY(-2px);border-color:var(--line-2)}
.emb.on{border-color:var(--line-2);background:var(--fill);transform:translateY(-2px)}
.colrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.colb{width:34px;height:34px;border-radius:var(--r-1);border:2.5px solid var(--line-2);
  transition:transform .12s ease}
.colb:hover{transform:translateY(-2px)}
.colb.on{transform:translateY(-4px);}
.avprev{
  width:88px;height:88px;border-radius:var(--r);border:3px solid var(--line-2);margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;
  
}
.avprev img{width:100%;height:100%;object-fit:cover}
/* A portrait fills its box at whatever size the box is, so one rule covers a
   96px gate card, an 88px editor preview, a 90px picker tile and a 32px rail
   chip. Unscoped on purpose: manageProfiles() renders a .rav outside .railprof
   and it must size the same there. */
.pav,.avprev,.rav{color:var(--on-fill)}
.emb{color:var(--tx)}
.emb.on{color:var(--on-fill)}
.pav img,.avprev img,.rav img,.emb img{width:100%;height:100%;object-fit:cover;display:block}
.emb img{border-radius:calc(var(--r-1) - var(--r-1))}
.pav .gi,.avprev .gi,.rav .gi{width:58%;height:58%;stroke-width:1.4}
.emb .gi{width:56%;height:56%;stroke-width:1.5}
.pinbox{
  display:flex;gap:9px;justify-content:center;margin:14px 0;
}
.pind{
  width:52px;height:60px;border:2.5px solid var(--line-2);border-radius:var(--r-1);text-align:center;
  font-size:24px;font-weight:700;background:var(--card);color:var(--tx);
  
}
.pind:focus{border-color:var(--line-2);outline:none;}
.pinerr{color:var(--bad);font-weight:700;font-size:13px;text-align:center;margin-top:4px;min-height:18px}

.railprof{
  display:flex;align-items:center;gap:10px;margin:4px 12px 8px;padding:9px 11px;border-radius:var(--r-1);
  background:var(--rail-2);width:calc(100% - 24px);text-align:left;
  transition:background .13s;
}
.railprof:hover{background:var(--rail-3)}
.railprof .rav{
  width:32px;height:32px;border-radius:var(--r-1);display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;overflow:hidden;border:2px solid rgba(255,255,255,.22);
}
.railprof .rav img{width:100%;height:100%;object-fit:cover}
.railprof .rn{font-size:13px;font-weight:700;color:var(--light-nav-item-hover-color,var(--on-fill));line-height:1.2;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railprof .rs{font-size:10px;color:var(--rail-dim);font-weight:700}


/* ---------- Cloud sync ---------- */
.gsign{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:11px;padding:14px 24px;border-radius:var(--r-1);
  background:var(--on-fill);border:var(--light-gsign-border,1px solid rgba(255,255,255,.5));font-weight:700;font-size:14.5px;color:#1f2430;
  transition:transform .14s ease;
}
.gsign:hover{transform:translateY(-3px);}
.gsign:active{transform:translateY(-1px)}
/* a slow sheen crossing the button every few seconds. The button is white, so
   the sweep has to be a shadow rather than a light or it is invisible. */
.gsign::after{
  content:"";position:absolute;top:0;left:-60%;width:42%;height:100%;pointer-events:none;
  background:var(--card);
  transform:skewX(-18deg);animation:sweep 5s ease-in-out 1.8s infinite;
}
@keyframes sweep{0%{left:-60%}24%{left:135%}100%{left:135%}}
/* the primary action when running from a file, where Google sign-in cannot work */
.gbig{font-size:15px;padding:15px 30px;border-radius:var(--r-1)}
/* the cloud button in its unavailable state: shown, so the option is visible,
   but plainly inert — no pointer, no hover, no sheen */
.gsign.off{margin-top:18px;opacity:.42;cursor:not-allowed;}
.gsign.off::after{animation:none;display:none}
.gsign.off:hover{transform:none;}
.gsign svg{width:19px;height:19px;flex-shrink:0}
.gate .gor{margin:22px 0 4px;font-size:12px;font-weight:700;color:var(--ink-4);text-transform:none}
.syncdot{
  display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;
  background:var(--ink-4);vertical-align:1px;
}
.syncdot.ok{background:#4ade80}
.syncdot.busy{background:var(--gold);animation:blink 1s infinite}
.syncdot.err{background:var(--fill)}
.railsync{
  margin:0 12px 6px;padding:7px 11px;border-radius:var(--r-1);background:var(--light-railsync-background,rgba(255,255,255,.05));
  font-size:10.5px;font-weight:700;color:var(--light-railsync-color,#b3a9dd);display:flex;align-items:center;
}
.cfgbox{
  width:100%;min-height:150px;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r-1);
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--card);color:var(--tx);
  line-height:1.55;resize:vertical;
}
.steps{counter-reset:s;font-size:13.3px;line-height:1.65;color:var(--ink-2);font-weight:500}
.steps li{margin-bottom:9px}
.steps code{background:var(--bg-2);padding:2px 7px;border-radius:var(--r-1);font-size:12px;font-weight:700}


.splash{
  position:fixed;inset:0;z-index:210;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.splash.hide{display:none}
.splash .glogo{font-size:24px}
.splash .msg{font-size:13.5px;color:var(--ink-3);font-weight:700}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{
  width:34px;height:34px;border:3.5px solid var(--line-2);border-top-color:var(--line-2);
  border-radius:50%;animation:spin .8s linear infinite;
}


/* ---------- Theory (document view) ---------- */
.th-intro{
  background:var(--card);border:2.5px solid var(--line-2);
  border-radius:var(--r-1);padding:16px 20px;font-size:14px;line-height:1.68;margin-bottom:22px;
  
}
/* ⚠️ "In this lecture" IS GONE FROM THE SCREEN TOO (user, 2026-08-19: "I don't
   need the in this lecture part I thought we changed this formula long ago").
   It was removed from PRINT on 2026-08-13 and the screen kept it — which is
   exactly why the user remembered the decision and still saw the block. The
   renderer no longer emits .th-toc, so its rules, its print rules and jumpSec()
   went with it. A section is still reachable by id: openTheoryFor() passes its
   section through go(), and bkInit() turns straight to that page. */

/* a section is now a chapter of a document, always open */
.th-sec{
  margin-bottom:34px;padding-left:20px;border-left:5px solid var(--line-2);
  scroll-margin-top:80px;
}

/* ---------- The book reader ----------
   The user asked for a chapter to read like a BOOK rather than a long scroll
   (2026-08-13): fixed pages, page numbers, turned rather than scrolled.

   The pagination is done by CSS multi-column, not by measuring and slicing the
   DOM. The browser already knows how to flow prose into a fixed-height column
   and where it is legal to break; reimplementing that in JS would be fragile and
   would fight every table and figure. `.bk-flow` is one tall column-set as wide
   as it needs to be, and turning a page is a translateX of exactly one column
   plus one gap. Page count falls out of scrollWidth.

   ⚠️ EVERY RULE HERE IS GATED ON .bk-on, and @media print unsets the lot — a
   columned, translated, overflow-hidden container prints as ONE page and loses
   the whole chapter. The print block below is not optional. */
.bk-wrap{position:relative;--bk-max:820px}
/* ⚠️ THE PAGE GETS THE WINDOW (user, 2026-08-19: "I need when I press on the
   lecture's tab the whole pages appears and I surfe through pages not just
   separate points"). MEASURED before the change, op-glauc at 1280x860:
   461px of sheet against 399px of furniture — the page got 54 % of the window —
   and scrollHeight was 909 against an 860 window, so the turn buttons sat BELOW
   THE FOLD and a page had to be scrolled to before it could be turned. That is
   what made a chapter read as fragments: each "page" was a half-height sliver,
   and op-glauc needed 31 of them.
   Nothing below removes a word. It removes repetition and stacking:
     - the chapter title was printed TWICE, in .doc-head and again 20px lower in
       the running head, which is the one that stays;
     - the back link and the two action buttons moved into one strip beside each
       other instead of one band above the sheet and one below it.
   ⚠️ .doc-head STAYS IN THE DOM. On paper it is the cover — a full-page panel
   in the module's colour — so it is hidden for the screen only and the print
   block restores it. */
.bk-on .doc-head{display:none}
.bk-top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin:0 auto 9px;
}
.bk-top .tb-btn{padding-left:0;margin:0;flex:0 0 auto}
.bk-acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.bk-acts .btn{padding:7px 13px;font-size:12.5px}
/* ⚠️ THE SHEET IS AN A4 PAGE (user, 2026-08-19: "I need it to appear like an
   A4 page"). The pass before this one gave the reader the window's HEIGHT and
   capped the measure at 820px, and that was still not a page: it was a wide
   landscape panel, which is what a browser window is shaped like, not what
   paper is shaped like. The box below is 210:297 exactly — set as an
   aspect-ratio so the two dimensions cannot drift apart — sized to whatever
   height the window can give it, with paper margins, a running head, a foot
   folio and a drop shadow, and the turn arrows out in the gutters where the
   edges of a page are.
   ⚠️ THE PAGE IS NOT WHITE, AND MUST NOT BE MADE WHITE. In dark mode --tx is
   near-white; a white sheet would set white type on white paper and lose the
   chapter. The A4-ness is carried by the PROPORTION, the margins, the folio and
   the shadow — never by the colour. The surface is --card, the same raised fill
   every other panel in the app uses, so both themes stay measured (CLAUDE.md
   §6) and the light theme inherits this rule unchanged.
   ⚠️ THE MARGINS ARE SET IN JS, AND PERCENTAGES ARE THE TRAP. Percentage
   padding resolves against the CONTAINING BLOCK's width — the stage, 1124px on
   a 1440 window — not against the sheet's own 510px. `padding:6.6%` therefore
   put 74px margins on a 510px page and left a 360px type block: margins wider
   than a real A4's, and they GREW when the window widened while the page did
   not. bkMeasure() sets these three from the sheet's own width instead, at
   6.8 % / 5.8 % / 3.4 % of it — 14.3mm and 12.2mm on a 210mm page, close to the
   15mm and 18mm the @page block uses on paper. */
.bk-stage{display:flex;align-items:center;justify-content:center;gap:16px}
.bk-on .bk-sheet{
  position:relative;display:flex;flex-direction:column;
  aspect-ratio:210/297;
  height:var(--bk-sheet-h,660px);
  flex:0 0 auto;
  background:var(--card);
  border:1px solid var(--line-2);
  border-radius:var(--r-1);
  padding:var(--bk-pad-t,30px) var(--bk-pad-x,35px) var(--bk-pad-b,17px);
  overflow:hidden;
}
/* ⚠️ THE CHAPTER OPENS WITH ITS OWN TITLE, AND IT LIVES INSIDE THE FLOW (user,
   2026-08-19: "with the lecture title at first like we agreed before" — the
   agreement is 391c440, 2026-08-13: "the opening ... lives INSIDE the flow as
   the first page", so it is turned to rather than scrolled past). Hiding
   .doc-head for the screen removed the title that was printed twice and took
   the opening with it; this puts the opening back and leaves the duplication
   gone.
   ⚠️ IT IS A HEAD, NOT A TITLE PAGE. The notes carry straight on underneath it
   on the same sheet — a whole page spent on a title is exactly the "one point
   in each page" the user asked not to have. break-after:avoid holds the first
   block of the chapter with it so the opening cannot end up alone.
   Screen only: on paper .doc-head is already a full-page cover, and printing
   both would open the chapter with its title twice. */
.bk-title{margin:0 0 15px;padding-bottom:11px;border-bottom:2px solid var(--line-2)}
.bk-title .eyebrow{margin-bottom:8px}
.bk-title h1{margin:0;font-size:22px;line-height:1.16;letter-spacing:-.012em;color:var(--tx)}
.bk-title .doc-meta{margin-top:5px;font-size:11px}
.bk-on .bk-title{break-after:avoid;page-break-after:avoid}

/* The folio, at the foot of the page where a book puts it. */
.bk-foot{
  padding-top:9px;text-align:center;
  font-family:'EB Garamond',Georgia,serif;
  font-size:11.5px;font-weight:700;
  color:var(--ink-4);font-variant-numeric:tabular-nums;
}
/* A narrower measure needs its indents back — the section rule was set for an
   820px column and costs 25mm of a 210mm page. */
.bk-on .th-sec{padding-left:13px;border-left-width:3px;margin-bottom:22px}
/* ⚠️ A PAGE IS SET TIGHTER THAN A SCROLLING COLUMN. 1.78 leading was chosen for
   a column you scroll, where air costs nothing; on a fixed page it costs pages,
   and the printed chapter — the thing this is meant to look like — is set at
   1.5. Meeting nearer the print figure buys about a tenth of the chapter back
   without touching the type size, which stays at 14.6px because the sheet is
   already only 510px wide and shrinking the face is the one thing that would
   make a page-shaped reader worse than the panel it replaced. */
.bk-on .th-body{line-height:1.62}
.bk-on .th-body p{margin:0 0 11px}
.bk-on .th-body ul{margin:0 0 11px}
/* The running head has a page's width, not a window's, so the section name is
   allowed to end in an ellipsis rather than wrap the head onto two lines. */
.bk-on .bk-run{font-size:9.5px;padding-bottom:6px;margin-bottom:11px;gap:10px}
.bk-on .bk-run>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-on .bk-run>span:first-child{flex:0 0 auto}
.bk-on .bk-run .r{flex:1 1 auto;text-align:right}
.bk-on .bk-prog{max-width:var(--bk-sheet-w,520px);margin-left:auto;margin-right:auto}
.bk-on .th-intro{margin-top:0}
/* The intro opens the chapter, so it is a first page, not a tinted callout. */
.bk-on .th-intro.bk-first{
  border:none;background:none;padding:0;
}
.bk-on .bk-view{
  overflow:hidden;                    /* the window the pages slide behind */
  position:relative;
  flex:1 1 auto;min-height:0;         /* the type block of the page */
}
.bk-on .bk-flow{
  column-gap:var(--bk-gap,54px);
  column-fill:auto;                   /* fill each column fully before the next */
  height:var(--bk-h,70vh);
  transition:transform .42s cubic-bezier(.22,1,.36,1);
  will-change:transform;
}
/* Small blocks stay whole; a heading never sits alone at the foot of a page.
   ⚠️ TALL blocks are NOT in this list and must not be — see bkMeasure(). An
   element with break-inside:avoid that is taller than its column overflows or
   is clipped, and clipped means the learner silently loses content. */
.bk-on .fbox,.bk-on .qfig,.bk-on .th-h{break-inside:avoid;page-break-inside:avoid}
.bk-on .th-keep{break-inside:avoid;page-break-inside:avoid}
/* ⚠️⚠️ overflow:hidden MAKES A TABLE MONOLITHIC, AND A MONOLITHIC TABLE IS
   CLIPPED RATHER THAN BROKEN. The base .th-table rule sets it to clip the corner
   cells against the border-radius; the cost was that a table taller than the
   reader's page could not fragment, so its last rows were never drawn and
   nothing on screen said so. MEASURED in op-lid: 782px and 741px tables in a
   613px page, getClientRects().length === 1, and "7. TRAUMATIC" and "⚠️ The rule
   — IT MUST BE NEVER SQUEEZED" both invisible. The corner cells carry the radius
   themselves instead, which costs nothing and clips nothing.
   ⚠️ SCREEN ONLY. The printed PDF was checked with pdftotext and holds both rows,
   so paper fragments these tables as it stands and the base rule is left alone.
   ⚠️ THE READER REPEATS A BROKEN TABLE'S COLUMN LABELS, exactly as the print
   block has done since the tables were tightened, so a table that breaks across
   a page turn keeps its headings. Rows still never split. */
.bk-on .th-table{overflow:visible}
.bk-on .th-table thead th:first-child{border-top-left-radius:var(--r-1)}
.bk-on .th-table thead th:last-child{border-top-right-radius:var(--r-1)}
.bk-on .th-table tbody tr:last-child td:first-child{border-bottom-left-radius:var(--r-1)}
.bk-on .th-table tbody tr:last-child td:last-child{border-bottom-right-radius:var(--r-1)}
.bk-on .th-table thead{display:table-header-group}
.bk-on .th-table tr{break-inside:avoid;page-break-inside:avoid}
/* A heading with nothing under it is the other half of the same fault — the
   section head and the markdown sub-heads both keep the block that follows. */
.bk-on .th-h,.bk-on .th-body .th-sub{break-after:avoid;page-break-after:avoid}
/* One line of a paragraph alone at the top or foot of a page reads as a slip. */
.bk-on .th-body p{orphans:2;widows:2}
.bk-on .th-sec{margin-bottom:26px}

/* Turning furniture */
.bk-bar{
  display:flex;align-items:center;gap:14px;justify-content:center;
  margin:16px auto 4px;max-width:640px;
}
.bk-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line-2);background:var(--card);color:var(--tx);
  
  transition:transform .18s ease,background .18s ease;
}
.bk-btn:hover:not(:disabled){transform:translateY(-2px);background:var(--bg-2)}
.bk-btn:disabled{opacity:.32;cursor:default}
.bk-num{
  font-size:12.5px;font-weight:700;color:var(--ink-3);
  min-width:132px;text-align:center;font-variant-numeric:tabular-nums;
}
.bk-run{
  display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:14px;
  font-size:10.5px;font-weight:700;text-transform:none;
  color:var(--ink-4);
}
.bk-run .r{color:var(--ink-3);text-transform:none;font-weight:700}
/* A thin progress rule under the turning bar — how far through the chapter. */
.bk-prog{height:3px;border-radius:var(--r-1);background:var(--line);max-width:640px;margin:0 auto 6px}
.bk-prog i{display:block;height:100%;border-radius:var(--r-1);background:var(--gold);
  transition:width .42s cubic-bezier(.22,1,.36,1)}
/* Click the outer thirds of the sheet to turn, as you would a page. */
.bk-on .bk-tap{position:absolute;top:0;bottom:0;width:11%;cursor:pointer;z-index:2}
.bk-on .bk-tap.l{left:0}
.bk-on .bk-tap.r{right:0}
@media (max-width:700px){
  .bk-on .bk-tap{width:16%}
  .bk-num{min-width:104px;font-size:11.5px}
  /* Arrows beside a page are a luxury of a wide window. On a phone they would
     take a third of the sheet's width, so they go under it and the page keeps
     the whole measure; the tap zones on the sheet itself are unchanged. */
  /* ⚠️ NO flex-basis ON THE SHEET. `flex:0 0 100%` is a definite width, and a
     definite width beats aspect-ratio — the page came out 347x346, square. The
     sheet keeps flex:0 0 auto and the width clamp in bkMeasure() is what stops
     it overflowing; at 375px wide it lands on exactly the row width, so the
     arrows wrap under it on their own line, which is what order:-1 is for. */
  .bk-stage{flex-wrap:wrap;gap:10px}
  .bk-on .bk-sheet{order:-1}
  .bk-stage>.bk-btn{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  .bk-on .bk-flow,.bk-prog i{transition:none}
}
.th-h{display:flex;align-items:center;gap:11px;margin-bottom:13px;flex-wrap:wrap}
.th-h h2{
  margin:0;font-size:21px;font-weight:700;color:var(--tx);line-height:1.2;
}
.th-num{
  font-size:11px;font-weight:700;color:var(--tx);
  text-transform:none;
}
.wbadge{
  font-size:8.5px;font-weight:700;text-transform:none;padding:3px 8px;
  border-radius:var(--r-1);border:1.5px solid var(--line-2);flex-shrink:0;
}
.wbadge.must{background:var(--fill);color:var(--on-fill)}
.wbadge.high{background:var(--gold);color:var(--tx)}
.wbadge.know{background:var(--bg-2);color:var(--ink-3)}
.th-body{font-size:14.6px;line-height:1.78;color:var(--ink-2)}
.th-body p{margin:0 0 14px}
.th-body strong{color:var(--tx);font-weight:700}
.th-body em{color:var(--ink-3)}
.th-body ul{margin:0 0 14px;padding-left:22px}
.th-body li{margin-bottom:7px}
.th-body li::marker{color:var(--tx)}
/* Three line kinds mdBlock() now marks up. On screen they are STRUCTURAL only —
   the module colour they take in print is deliberately absent here, because
   those hues are chosen dark enough for white text to sit on them and are
   therefore poor as text on the dark ground (CLAUDE.md §6). */
.th-body .th-sub{
  margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line);
  font-family:var(--font-display),Georgia,serif;font-size:13px;font-weight:700;
  text-transform:none;color:var(--tx)}
.th-body .th-sub:first-child{margin-top:0}
.th-body .src{
  margin:14px 0 0;padding-top:7px;border-top:1px solid var(--line);
  font-size:11px;text-transform:none;color:var(--ink-4)}
.th-body .xref{color:var(--ink-4);font-size:13.6px}
.th-body .xref em{color:var(--ink-4)}
.th-body p.lead{margin-top:20px}
.th-body p.lead:first-child{margin-top:0}
.th-body blockquote{
  margin:0 0 15px;padding:13px 18px;background:var(--gold-bg);border-left:4px solid var(--gold);
  border-radius:0 var(--r-1) var(--r-1) 0;font-weight:700;color:var(--tx);font-size:14.5px;
}
.th-table{width:100%;border-collapse:separate;border-spacing:0;margin:4px 0 18px;font-size:13.3px;
  border:1px solid var(--line-2);border-radius:var(--r-1);overflow:hidden}
.th-table th{background:var(--fill);color:var(--on-fill);text-align:left;padding:10px 13px;font-weight:700;
  font-size:11px;text-transform:none;}
/* ⚠️ A header cell holding **bold** becomes <strong>, and `.th-body strong` sets
   it to the body ink — which is the SAME near-black as the header's own
   background, so the label vanishes. Invisible on screen and on paper both.
   Found by reading the printed PDF, not the source. */
.th-table th strong,.th-table th em{color:var(--on-fill)}
.th-table td{padding:10px 13px;border-bottom:1.5px solid var(--line);vertical-align:top;line-height:1.55}
.th-table tr:last-child td{border-bottom:none}
.th-table tbody tr:nth-child(odd) td{background:rgba(255,255,255,.03)}

.flow{margin:4px 0 18px;border:2.5px dashed var(--line-2);border-radius:var(--r-1);padding:16px 17px;background:var(--tint)}
.flow-title{font-size:11px;font-weight:700;text-transform:none;color:var(--tx);margin-bottom:14px}
.fstep{margin-bottom:9px}
.fbox{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-1);padding:11px 14px;
  }
.fbox .ft{font-weight:700;font-size:13.6px;line-height:1.42}
.fbox .fn{font-size:12.4px;color:var(--ink-3);margin-top:5px;line-height:1.5;font-weight:600}
.fbox.alert{background:var(--tint);border-color:var(--line-2);}
.fbox.alert .ft{color:#ff9aa2}
.fbox.dec{background:var(--gold-bg);border-color:var(--gold)}
.farrow{text-align:center;color:var(--tx);font-size:17px;line-height:1;margin:2px 0 7px;font-weight:700}
.fbranch{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.fb{border:2px solid var(--line-2);border-radius:var(--r-1);padding:9px 12px;font-size:12.6px;font-weight:700;line-height:1.45}
.fb.y{background:rgba(0,168,107,.14);border-color:var(--ok)}
.fb.n{background:rgba(255,71,87,.13);border-color:var(--bad)}
.fb b{display:block;font-size:9.5px;text-transform:none;margin-bottom:4px}
.fb.y b{color:var(--ok)}
.fb.n b{color:var(--bad)}
@media(max-width:600px){.fbranch{grid-template-columns:1fr}}

.th-test{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.th-test .lbl{font-size:12px;font-weight:700;color:var(--ink-3)}
.readtheory{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:16px;
  padding:12px 16px;background:var(--card);
  border:2.5px solid var(--line-2);border-radius:var(--r-1);font-weight:700;font-size:13.5px;
  
  transition:transform .13s ease;
}
.readtheory:hover{transform:translate(-2px,-2px);}
.th-ch{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-1);margin-bottom:9px;width:100%;text-align:left;
  transition:transform .13s ease}
.th-ch:hover:not(:disabled){transform:translate(-2px,-2px);}
.th-ch:disabled{opacity:.4;cursor:default;border-style:dashed}
.th-ch .n{flex:1;font-weight:700;font-size:14px}
.th-ch .m{font-size:11.5px;color:var(--ink-4);font-weight:700}
.doc-head{border-bottom:3px solid var(--line-2);padding-bottom:14px;margin-bottom:22px}
.doc-meta{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-top:6px}

/* ---------- Print / Save as PDF ---------- */
@media print{
  /* @page lives further down with the cover rules, so the margin and the page
     number are declared together. Two @page blocks would merge silently and the

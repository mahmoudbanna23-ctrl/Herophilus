     later one would win — one place is clearer. */
  /* ⚠️ .filterbar and .tb-btn were missing here, so "Test the whole lecture",
     "Save as PDF" and the "← ENT notes" back link all printed onto paper —
     three controls that do nothing on a sheet of paper. Reported by the user
     from a real saved PDF. */
  .rail,.topbar,.th-test,.readtheory,.toast,.modal-bg,.splash,.gate,.qzoom,
  .filterbar,.tb-btn,.clep,
  /* The schedule's own controls: the ✓/✗ marks and the Edit/Reset bar. Same
     reason as the buttons above — a printed plan is read, not clicked. */
  .mk,.edbar{display:none!important}
  /* The subject index's group heads stick to the topbar on screen. .topbar
     is hidden above, but position:sticky is still evaluated per printed
     page in Chrome's print engine, which would repeat or overlap a group
     head on every sheet. Pin it back to normal flow on paper. */
  .grouphdr{position:static!important}
  /* A question's photograph is content, so it PRINTS — unlike the module
     artwork below. It is an <img>, not a background, so it needs nothing but
     room; the caption's "tap to enlarge" is meaningless on paper. */
  .qfig img{max-width:78mm;}
  .qfig figcaption{color:#444}
  /* The module artwork is a background-image, and browsers do not print those by
     default — left in, it reserves a square of blank paper per card. It carries
     no information anyway, so drop it and let the card collapse to its text. */
  .mod-art{display:none!important}
  /* The app is dark on screen. Printing keeps paper white, so every colour token
     that carries text has to flip back to ink or the PDF comes out blank.

     The selector list is not decoration. :root[data-theme="light"] has a higher
     specificity than a bare :root, so once the light theme existed it outranked
     this block and printed its grey page background onto paper. Matching the
     specificity here — and sitting later in the file — puts print back on top
     for BOTH themes. */
  :root, :root[data-theme="light"], :root[data-theme="dark"]{
    /* ⚠️ THE MUTED RAMP WAS TOO LIGHT ON PAPER AND THE USER SAID IT HURT TO READ.
       --ink-3 and --ink-4 carry the italic "(not taken from the course material)"
       tags and every small label; at #4a5464/#6b7688 in a light serif they render
       as grey hairlines. Both pulled to near-ink — on white there is no reason for
       any text colour on this page to be pale. */
    --tx:#14181f; --ink:#14181f; --ink-2:#1b2028; --ink-3:#2f3742; --ink-4:#3a424e;
    --card:#fff; --bg:#fff; --bg-2:#f2f4f8; --fill:#14181f;
    --line:#d8dde5; --line-2:#b9c1cd;
    --ok-bg:#f3f3f3; --bad-bg:#f3f3f3; --gold-bg:#f3f3f3;
    /* Pale washes remain visible on white paper in either source theme. */
    --hl-y:#e3d3a4;
    --hl-g:#c9d8c0;
    --hl-p:#dfc5c9;
    --hl-b:#c5d2de;
    --stem:#14181f; --prose:#22282f; --strong:#000;
    --warn:#745800; --ok:#14181f; --bad:#92294f;
    --sh:rgba(0,0,0,.10); --sh-soft:rgba(0,0,0,.07); --sh-deep:rgba(0,0,0,.14);
    --sheen:var(--card); --tint:transparent; --tint-2:#f2f4f8;
    --glow:none;
  }
  mark.hl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff!important;background-image:none!important;font-size:11pt;color:#14181f}
  .ambient,.ambient *{display:none!important}
  /* Weight, not just colour. EB Garamond is a light serif and at 11pt its regular
     weight is a hairline on paper; 500 gives it a stem without turning it bold. */
  .th-body,.th-body p,.th-body li,.stem,.ex-body{color:#14181f!important;font-weight:500}
  .th-body em,.th-body i{color:#2f3742!important;font-weight:500}
  .th-body strong,.th-h h2,h1{color:#0d1117!important}
  /* ⚠️ Chrome's own print dialog has "Background graphics" OFF BY DEFAULT, so a
     user pressing Save as PDF gets NO table-header fill — and the header text is
     white, which prints white-on-white and loses every column label. Headless
     --print-to-pdf prints backgrounds regardless, so the harness could never
     have shown this. print-color-adjust makes the fill survive either way. */
  .th-table th,.th-table tbody tr:nth-child(odd) td,.fbox,.flow,.th-intro,.wbadge,.eyebrow{
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  /* Table heads take the module colour too, so a table reads as part of the
     chapter rather than as a black slab dropped into it. */
  .th-table{border:.6pt solid #d8dde5!important;border-radius:var(--r-1)!important;overflow:hidden}
  .th-table th{background:var(--mod,#14181f)!important;color:#fff!important}
  .th-table th strong,.th-table th em{color:#fff!important}
  /* The stripe was a neutral grey, which read as a printing artefact next to a
     coloured head. Tinting it from --mod at 7% ties the body of the table to its
     own header. The fallback keeps the old grey if a view sets no --mod. */
  .th-table tbody tr:nth-child(odd) td{
    background:color-mix(in srgb,var(--mod,#14181f) 7%,#fff)!important}
  .th-table td{border-bottom:.5pt solid #e4e8ee!important}
  /* A callout is the other thing the eye should catch. Tinted ground, a solid
     bar in the warn colour, and room to breathe. */
  .th-body blockquote{
    border-left:3pt solid #c08a1e!important;background:#fdf7e8!important;
    border-radius:0 var(--r-1) var(--r-1) 0!important;
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }
  .app{display:block}
  .page{padding:0;max-width:100%}
  .th-sec{break-inside:auto;page-break-inside:auto;margin-bottom:20px;padding-left:12px}
  .th-h{break-after:avoid;page-break-after:avoid}
  /* ⚠️⚠️ `.th-table` IS DELIBERATELY NOT IN THIS LIST ANY MORE, AND THAT ONE
     CHANGE IS WORTH MORE PAGES THAN ANY AMOUNT OF FURTHER WORD-CUTTING.
     Measured: rewriting a chapter from prose into tables cut it from 10,384
     words to 3,826 and left the page count at 16 — density fell from ~350 words
     a page to ~240. With `break-inside:avoid`, a ten-row table that will not fit
     in the space remaining jumps WHOLE to the next page and leaves the bottom
     third of the sheet blank; on a page made of medium tables that happens over
     and over. Rows still never split, and <thead> repeats the column labels on
     the continuation page, so a broken table stays readable. */
  .flow,.fbox,.th-body blockquote{break-inside:avoid;page-break-inside:avoid}
  .th-table thead{display:table-header-group}
  .th-table tr{break-inside:avoid;page-break-inside:avoid}
  .fbox,.th-table{}
  /* ⚠️ THE PDF IS A BOOK, NOT THE SCREEN (user's instruction, 2026-08-13):
     title page, contents, then straight into the notes. The exam-patterns
     intro is screen-only — on paper the user asked to start with the
     explanation directly. */
  .th-intro{display:none!important}
  /* ⚠️ PAGE COUNT. 47 pages for one chapter was too many. Nothing here removes a
     word — it is leading, section gaps and cell padding, all of which were set
     for a 15px screen and are wasteful at 11pt on A4. */
  /* ⚠️ TWO COLUMNS WAS TRIED AND MADE IT WORSE — 42 pages went to 50. MEASURED,
     not predicted. This chapter carries 21 tables, and a table has to span both
     columns to stay readable; every span closes the column set and reopens it,
     so the flow fragments into short stubs and the wasted half-columns cost more
     than the narrow measure saves. Do not re-try it on a table-heavy chapter.
     Below ~42 pages the only remaining lever is the WORD COUNT. */
  .th-body{line-height:1.5!important}
  .th-body p{margin:0 0 6pt!important}
  .th-body ul{margin:4pt 0 6pt!important}
  .th-body li{margin-bottom:2pt!important}
  /* ── THE PAGE IS SCANNED, NOT READ (user, 2026-08-14: the PDF "doesn't look
     appetising at all. Some parts just look like plain paragraphs") ───────────
     Nothing below changes a single word. It gives the four kinds of line the
     format already produces four different appearances, so the eye can tell an
     entity from a citation from an aside without reading any of them.
     ⚠️ COLOUR HERE IS PRINT-ONLY AND MUST STAY THAT WAY. The module hues are
     dark by design (CLAUDE.md §6) so white text passes on them — which is the
     same thing as saying they are nearly invisible AS text on the dark screen
     ground. On white paper they are exactly right. */
  /* The lead anchor, chosen by mdLead() — see the long note at that function
     for why this is not `strong:first-child`. Only the term is coloured; the
     rest of the bold statement stays near-black, so the colour marks WHERE a
     block starts instead of shouting the whole of it. */
  .th-body .lt{color:var(--mod,#14181f)!important}
  /* Entity blocks need air between them or they read as one slab. Ordinary
     paragraphs keep the tight 6pt above. */
  .th-body p.lead{margin-top:8pt!important}
  .th-body p.lead:first-child{margin-top:0!important}
  /* A citation is furniture. Small, spaced, muted, ruled off — findable when
     checked, skipped when reading. */
  .th-body .src{
    margin:7pt 0 0!important;padding-top:3pt!important;
    border-top:.4pt solid #e4e8ee!important;
    font-size:7.5pt!important;font-weight:500!important;
    text-transform:none!important;color:#8a94a3!important}
  /* ⚠️ `.th-body .xref` is TWO classes so it outranks the `.th-body p` weight
     rule above, which forces 500 on every paragraph. A single-class selector
     loses and the aside prints at full prose weight. */
  .th-body .xref{font-size:9pt!important;font-weight:400!important;color:#5a6472!important}
  .th-body .xref em,.th-body .xref i{color:#5a6472!important;font-weight:400!important}
  /* Sub-heading inside a section — the lever that breaks a long body into
     scannable blocks. Coloured text, hairline rule, never stranded at a foot. */
  .th-body .th-sub{
    margin:9pt 0 4pt!important;padding-bottom:2pt!important;
    border-bottom:.4pt solid #e4e8ee!important;
    font-family:var(--font-display),Georgia,serif!important;
    font-size:9.5pt!important;font-weight:700!important;
    text-transform:none!important;color:var(--mod,#14181f)!important;
    break-after:avoid;page-break-after:avoid}
  .th-body .th-sub:first-child{margin-top:0!important}
  /* ── SECTION HEADINGS ──────────────────────────────────────────────────────
     Revision notes are SCANNED, so a heading has to be findable at arm's length
     and cheap in vertical space. A tinted band in the module colour, the number
     in the colour, the weight badge inline. `break-after:avoid` already stops a
     heading stranding at the foot of a page. */
  .th-sec{margin-bottom:9pt!important;padding-left:0!important;border-left:none!important}
  /* The heading is a solid bar in the module colour with the type reversed out —
     the strongest cheap signal on the page, and it makes flicking to a section
     possible at arm's length. */
  /* ⚠️ `flex-wrap:wrap` (the screen default) DROPPED THE BADGE ONTO ITS OWN LINE
     and turned a one-line bar into a three-line slab on any section with a long
     title. nowrap + a flexible h2 keeps the number left, the badge right, and
     lets the TITLE be the thing that wraps. */
  .th-h{
    margin:0 0 6pt!important;padding:4pt 8pt!important;
    background:var(--mod,#b4472f)!important;border:none!important;
    align-items:baseline!important;border-radius:var(--r-1)!important;
    flex-wrap:nowrap!important;gap:7pt!important;
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }
  .th-h h2{
    font-size:11.4pt!important;margin:0!important;
    color:#fff!important;flex:1 1 auto;min-width:0;
  }
  .th-num{
    color:rgba(255,255,255,.72)!important;font-size:8.4pt!important;font-weight:900!important;
    flex:0 0 auto;
  }
  .th-h .wbadge{
    background:rgba(255,255,255,.2)!important;color:#fff!important;border:none!important;
    flex:0 0 auto;white-space:nowrap;
  }
  .wbadge{
    font-size:6.6pt!important;padding:1pt 4pt!important;
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }
  .wbadge.know{display:none!important}   /* "background" is the default; saying so costs a line */
  /* Cell padding is charged once per ROW, so on a table-heavy page it is the
     single biggest consumer of vertical space after the break behaviour above.
     4pt → 2.6pt saves ~2.8pt a row; a chapter with 150 table rows gets ~15 cm
     of paper back for nothing. */
  .th-table{margin:3pt 0 6pt!important;font-size:9.6pt!important}
  .th-table th{padding:2.6pt 6pt!important;font-size:8.4pt!important}
  .th-table td{padding:2.6pt 6pt!important;line-height:1.3!important}
  .th-body blockquote{margin:6pt 0!important;padding:6pt 9pt!important}
  .flow{margin:4pt 0 8pt!important;padding:7pt 9pt!important}
  .fbox{padding:5pt 7pt!important}
  .farrow{margin:2pt 0!important}
  /* ⚠️ UNDO THE BOOK READER ENTIRELY. A fixed-height, overflow-hidden,
     translated column-set prints as ONE page and silently loses the rest of the
     chapter. Paper does its own pagination and needs the plain flow back. */
  .bk-on .bk-view{overflow:visible!important}
  .bk-on .bk-flow{
    columns:auto!important;column-gap:normal!important;
    height:auto!important;transform:none!important;transition:none!important}
  .bk-bar,.bk-prog,.bk-run,.bk-tap,.bk-top,.bk-foot,.bk-title,
  .bk-stage>.bk-btn{display:none!important}
  /* The cover is .doc-head, which the screen hides while the reader is on. */
  .bk-on .doc-head{display:block!important}
  /* ⚠️ AND THE A4 BOX ITSELF COMES OFF. Paper does its own pagination; a fixed
     aspect-ratio, overflow-hidden sheet prints as one page and loses the rest of
     the chapter, exactly as the columned flow does. Every property the screen
     rule sets is unset here — height and aspect-ratio together, or the box keeps
     its shape from whichever survives. */
  .bk-on .bk-stage{display:block!important}
  .bk-on .bk-sheet{
    display:block!important;aspect-ratio:auto!important;height:auto!important;
    width:auto!important;padding:0!important;border:none!important;
    border-radius:0!important;background:none!important;
    overflow:visible!important}
  /* ── THE COVER ─────────────────────────────────────────────────────────────
     Typographic, not illustrated: Canva was considered and set aside because a
     cover image cannot be generated per chapter for 104 chapters, and the module
     colour already carries the identity. A rule above the title, the module in
     small caps, the chapter, a rule below, and the counts as a footer line. */
  /* A SOLID PANEL IN THE MODULE'S COLOUR, type reversed out of it. True
     full-bleed is not reachable through @page margins, so the panel is a wide
     band instead — it still reads as designed rather than as a bare title. */
  /* ⚠️ TRUE FULL BLEED IS NOT REACHABLE. Negative margins that would push the
     panel into the @page margin are clipped by Chrome — measured: -15mm left/
     right moved the edge not at all, and it left a stray rule at the foot of the
     sheet. So the panel fills the whole PRINTABLE area instead: A4 297mm less
     the 18mm/16mm page margins = 263mm, which reads as a cover rather than as a
     banner with white under it. */
  .doc-head{
    break-after:page;page-break-after:always;
    margin:0;padding:84mm 22mm 0;min-height:238mm;box-sizing:border-box;
    text-align:center;border-bottom:none;
    background:var(--mod,#b4472f)!important;color:#fff!important;
    -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;
  }

    color:rgba(255,255,255,.82)!important;font-size:9.5pt;
    font-weight:700;padding:0;border:none;
  }

  }

  }
  /* ── RUNNING HEAD AND PAGE NUMBERS ─────────────────────────────────────────
     @page margin boxes are the only way to repeat furniture on every sheet;
     Chrome supports the counter but not `string-set`, so the chapter name is
     written in by the renderer as a CSS variable rather than pulled from h1. */
  @page{
    margin:18mm 15mm 16mm;
    @bottom-center{
      content:counter(page);
      font-family:'EB Garamond',Georgia,serif;font-size:9pt;color:#5a6472;
    }
  }
  @page:first{ @bottom-center{content:''} }
  h1{font-size:22pt}
  .th-h h2{font-size:14pt}
  .th-body{font-size:10.5pt;line-height:1.55}
  a{text-decoration:none;color:inherit}
}

   readable at a glance, or you sit an exam on a filtered set without noticing. */
/* White text is correct again as of the Greek palette: bronze #9a6b1f, aegean
   #2f6b8f and madder #8f3f5c are all dark enough that white clears 4.6-6.9:1.
   Under the OLD bright bank colours it did not — white on amber #f59e0b
   measured 2.15:1, the worst reading in the app, and this rule had to carry
   dark text instead. Recheck by measurement if the bank colours ever change.

   The glow once used the text token, which is TEXT colour — parchment-white, so the

}

   unset --c would have made a white chip carrying white text */
.chip.on{background:var(--c,var(--fill));color:var(--on-fill)}

@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* ============================================================================
   CINEMATIC LAYER — added 2026-07-27
   Depth, glass and motion. The governing rule for this whole block:

       ALIVE TO BROWSE, CALM TO READ.

   Ambient motion runs on home / module / schedule / flagged / moved.
   It stops dead on quiz / mock / review / theory, because those are the screens
   where a clinical stem is read for minutes at a time and anything drifting in
   the periphery competes with it. The gate is body[data-view], set by render().
   ============================================================================ */

/* ---- ground ------------------------------------------------------------- */
body{
  background:var(--bg);
  background-image:var(--light-body-background-image,none);
  background-attachment:fixed;
}

/* Slow-moving colour behind everything. Fixed, non-interactive, z-index 0;
   .app sits at z-index 1. Blur is on an element that never scrolls and never
   repaints, which is the only place a 90px blur is affordable. */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
/* Pulled back from .55 when the film moved in underneath. Two ambient systems
   at full strength cancel each other out — the orbs are a 90px blur, so at
   their old weight they simply fogged the room away. They are a tint over the
   film now, not the atmosphere in their own right. */
.ambient .orb{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--light-ambient-orb-opacity,.38);
  will-change:transform;
}
.ambient .o1{width:46vw;height:46vw;left:-12vw;top:-14vh;background:radial-gradient(circle,var(--neuro),transparent 68%);animation:drift1 34s ease-in-out infinite}
.ambient .o2{width:40vw;height:40vw;right:-10vw;top:4vh;background:radial-gradient(circle,var(--peds),transparent 68%);animation:drift2 41s ease-in-out infinite}
.ambient .o3{width:38vw;height:38vw;left:26vw;bottom:-18vh;background:radial-gradient(circle,var(--ophtho),transparent 70%);animation:drift3 47s ease-in-out infinite}
.ambient .o4{width:26vw;height:26vw;right:16vw;bottom:-10vh;background:radial-gradient(circle,var(--gold),transparent 72%);opacity:var(--light-ambient-o4-opacity,.28);animation:drift1 52s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,5vh,0) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-7vw,7vh,0) scale(1.09)}}
@keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(5vw,-6vh,0) scale(1.14)}}

/* ---- the film ------------------------------------------------------------ */
/* A candlelit scholar's desk, playing under the whole app. It is the BOTTOM
   layer of .ambient: the orbs drift OVER it and the scrim sits over both, so
   the film reads as the deepest part of the colour field rather than as a
   video pasted behind the page.

   Everything that keeps it out of the way of reading:
     · the scrim, which is what actually guarantees contrast — the film never
       touches the page unmediated;
     · body[data-view], which fades .ambient to .3 on the four reading screens,
       and syncFilm(), which calls pause() so the frames stop decoding too;
     · prefers-reduced-motion, which drops it entirely — poster and all;
     · the print block above, whose `.ambient *` rule already covers it.

   The clip is a PING-PONG loop, forward then reverse, cut in ffmpeg. The source
   slowly pushes in, so a plain loop snapped back to the wide framing every six
   seconds — the one thing a background must never do. Reversed, the push-in
   becomes a slow breath with no seam at either end. */
/* .gate-amb rides on every one of these rules. The gate is opaque and sits at
   z-index 200 above .app, so the page's film is unreachable from behind it and
   it carries its own copy — but it must never drift out of step with this one,
   so the selectors are shared rather than duplicated. */
.ambient .film,.gate-amb .film{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 42%;
  opacity:var(--light-gate-amb-film-opacity,var(--light-ambient-film-opacity,.48));
  /* the source is warm amber against a navy ground; pulling the saturation
     back and easing the brightness settles it without draining the lamp */
  filter:var(--light-ambient-film-filter,saturate(.70) contrast(1.05) brightness(.82));
}
/* The scrim is the contrast guarantee, not a mood effect. It is heaviest top
   and bottom — behind the top bar and below the fold — and lightest across the
   middle band where the lamp and the figure actually are. */
.ambient .film-scrim,.gate-amb .film-scrim{
  position:absolute;inset:0;
  background:var(--light-ambient-film-scrim-background,linear-gradient(180deg,
      rgba(7,13,22,.88) 0%, rgba(7,13,22,.44) 18%,
      rgba(7,13,22,.26) 50%, rgba(7,13,22,.64) 100%),
    radial-gradient(150% 105% at 50% 48%, transparent 38%, rgba(7,13,22,.46) 100%));
}

/* PORTRAIT IS A DIFFERENT PICTURE, not the same one narrower.
   object-fit:cover crops to the middle of the frame, and on a tall viewport
   that middle is only about 39% of a 16:9 source. For this clip the middle
   band is the scholar's unlit back; the oil lamp — the one bright, legible
   thing in the shot — sits ~14% from the left and is cropped away entirely.
   The result on an iPad in portrait was an apparently blank navy page.

   So the framing moves toward the lamp rather than the figure, and the film
   lifts to carry a crop that is inherently darker. Found by rendering at
   820x1180; it is invisible in the CSS and invisible on a desktop window.

   And it needs a harder push than a wider screen does, because in portrait the
   cards run nearly edge to edge: the only film left showing is the strip above
   the first card and the gaps between sections. What survives has to carry the
   whole effect, so the film runs brighter here than it ever does on a desktop. */
@media (max-aspect-ratio:5/4){
  .ambient .film,.gate-amb .film{object-position:18% 45%;opacity:var(--light-gate-amb-film-opacity,var(--light-ambient-film-opacity,.72))}
  .ambient .film-scrim,.gate-amb .film-scrim{
    background:var(--light-ambient-film-scrim-background,linear-gradient(180deg,
        rgba(7,13,22,.78) 0%, rgba(7,13,22,.28) 14%,
        rgba(7,13,22,.14) 48%, rgba(7,13,22,.52) 100%),
      radial-gradient(170% 95% at 50% 45%, transparent 50%, rgba(7,13,22,.34) 100%));
  }
}

.app{position:relative;z-index:1}

/* ---- the gate: still while reading -------------------------------------- */
body[data-view="quiz"] .ambient,
body[data-view="mock"] .ambient,
body[data-view="review"] .ambient,
body[data-view="theory"] .ambient{opacity:.3;transition:opacity .5s ease}
body[data-view="quiz"] .orb,
body[data-view="mock"] .orb,
body[data-view="review"] .orb,
body[data-view="theory"] .orb{animation-play-state:paused}

/* ---- glass on the fixed furniture only ---------------------------------- */
/* Deliberately NOT on cards, chapter rows or question options: backdrop-filter
   on a long scrolling list is the single most expensive thing on the page. */
.rail{
  background:var(--light-rail-background,linear-gradient(180deg,rgba(10,20,34,.96),rgba(8,16,28,.99)));
  border-right:var(--light-rail-border-right,1px solid var(--line-2));
  backdrop-filter:var(--light-rail-blur,blur(14px));-webkit-backdrop-filter:var(--light-rail-webkit-blur,blur(14px));
}
.topbar{backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.modal{
  background:var(--light-modal-background,var(--card));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:var(--light-modal-border,1px solid var(--line-2));box-shadow:var(--light-modal-shadow,0 30px 80px rgba(0,0,0,.6),var(--glow));
}
.modal-bg{background:var(--light-modal-bg-background,rgba(3,7,14,.66));backdrop-filter:var(--light-modal-bg-blur,blur(5px))}
.results{background:var(--light-results-background,var(--glass));border:1px solid var(--line-2)}
.gate,.splash{background:var(--bg);background-image:inherit}

/* ---- surfaces get an inner highlight so edges read on dark -------------- */
/* Shadow ink and the sheen wash come from tokens so the light theme inherits
   these rules unchanged instead of restating all of them. */
.card,.stat,.ch-row,.qcard,.th-ch,.day,.modelans,.explain,.fbox,.conf,.bk-sheet{
  
}
.card,.stat,.qcard,.ch-row,.th-ch,.day{
  background:var(--sheen);
  background-color:var(--card);
}

/* hover lifts instead of sliding into a hard shadow */
button.card:hover:not(:disabled),.ch-row:hover:not(:disabled),.th-ch:hover:not(:disabled){
  transform:translateY(-3px);
  
}
button.card:active:not(:disabled){transform:translateY(-1px)}
.day:hover{transform:translateY(-2px);}

/* module cards glow in their own colour */
.mod-card::after{opacity:.5;filter:blur(26px);width:120px;height:120px;right:-40px;top:-40px}
.mod-ic{}
.pill{border:none;}

/* buttons: the primary action is now a lit surface, not a dark slab */
.btn{
  background:var(--card);
  background-color:var(--fill);border:1px solid var(--line-2);
  
}
.btn:hover:not(:disabled){transform:translateY(-2px);}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.go{background:var(--card);border-color:rgba(255,255,255,.2);}
.btn.go:hover:not(:disabled){}
.btn.flag.on{background:var(--card);color:var(--on-accent)}
.wbadge.high{color:var(--on-accent)}

/* options: selection and verdict read by glow, not by a hard offset */
.opt{background:var(--tint);border-color:var(--line-2)}
.opt:hover:not(:disabled){background:var(--tint-2);border-color:var(--line-2);transform:translateX(3px);}
.opt.sel{}
.opt.correct{}
.opt.wrong{}
.verdict{border:1px solid var(--line-2)}
.verdict.ok{}
.verdict.bad{}
.verdict.part{}

/* the reading surface — highest contrast on the page, deliberately.
   These three carry the clinical text, so they are the one place the theme is
   allowed its own dedicated tokens rather than reusing the general ramp. */
.qcard{border:1px solid var(--line-2)}
.stem{color:var(--stem);font-size:17px;line-height:1.7}
.th-body{color:var(--prose)}
.th-body strong,.ex-body strong{color:var(--strong)}
.stem th{background:var(--tint-2)}
.th-table th{background:var(--fill);color:var(--on-fill)}

/* inputs */
.search,.caseinput,.jumpin,.pind,.cfgbox,.ed-lab,.ed-txt,.keyin,.newday input[type=date]{
  background:var(--tint);border-color:var(--line-2);color:var(--tx);
}
.search:focus,.caseinput:focus{border-color:var(--line-2);}
/* --fill is a DARK solid in both themes, so the text on it must be white in
   both. Using var(--tx) here worked on dark only by coincidence — on light it
   put near-black text on a near-black chip. */
.eyebrow{background:var(--fill);color:var(--on-fill);border:1px solid var(--line-2)}
.toast{background:var(--card);border:1px solid var(--line-2);box-shadow:var(--light-toast-shadow,0 18px 44px rgba(0,0,0,.6))}
.kbd{background:var(--tint-2);border-color:var(--line-2)}
.grouphdr::after{height:1px;background:var(--line-2)}

/* ---- entrance motion ---------------------------------------------------- */
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#page{animation:pagein .34s cubic-bezier(.22,1,.36,1)}

/* scroll reveal — browse screens only, applied by the observer in JS */
.reveal{opacity:0;transform:translateY(16px)}
.reveal.in{opacity:1;transform:none;transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}

/* ---- accessibility ------------------------------------------------------ */
/* The original rule already killed animation and transition. Ambient orbs are
   background-position/transform loops, so they need explicitly stopping too. */
@media (prefers-reduced-motion:reduce){
  .ambient .orb{animation:none!important}
  /* The film is the most insistent motion on the page, so it goes entirely —
     poster included. Its scrim goes with it, or the page keeps a dark wash
     that is now shading nothing. */
  .ambient .film,.ambient .film-scrim,
  .gate-amb .film,.gate-amb .film-scrim{display:none!important}
  .reveal{opacity:1!important;transform:none!important}
  /* the gate is the most animated screen in the app, so it needs the most
     thorough opt-out: orbs, staggered entrances, the halo and the sheen */
  .gate-amb .gorb{animation:none!important}
  .gstep>*,.pcard,.gtitle{animation:none!important}
  .gmark::after,.gsign::after{animation:none!important;opacity:0}
}

/* ============================================================================
   LIGHT THEME — the rules tokens could not carry.
   Everything above is shared. What is left here is the handful of places where
   the dark theme hardcodes an atmosphere value: the ground wash, orb strength,
   the glass gradients and the modal scrim. Placed last so it wins on source
   order without needing !important.

   NOT overridden on purpose: .rail, .btn, .toast and .th-table th all stay dark
   in light mode. They are solid dark objects on a light page by design, and
   their hardcoded #fff text stays correct.
   ============================================================================ */
:root[data-theme="light"] body{
  /* same three orbs of colour, roughly a third of the strength — at dark-mode
     alpha they turn a white page murky rather than atmospheric */
  --light-body-background-image:none;
}
:root[data-theme="light"] .ambient .orb{--light-ambient-orb-opacity:.20}
:root[data-theme="light"] .ambient .o4{--light-ambient-o4-opacity:.13}

/* The film is a night scene and this is the page in daylight, so it cannot
   simply run dimmer here — a dark image at low opacity on parchment is a grey
   smudge, and at .14 it was invisible altogether, which is how it first
   shipped. The trick is to BRIGHTEN IT INTO A PALE PRINT rather than show a
   dark photograph faintly: brightness well above 1 lifts the shadows off the
   floor, low contrast keeps them there, and the warmth that survives reads as
   a faded fresco on the page rather than a window onto a dark room.
   Higher opacity than dark mode, therefore, not lower. */
:root[data-theme="light"] .ambient .film,
:root[data-theme="light"] .gate-amb .film{
  /* .42 -> .55 at the user's request: at .42 it was present but easy to miss.
     The brightening does the work, not the opacity — see the note above. */
  --light-ambient-film-opacity:.55;--light-ambient-film-filter:saturate(.58) contrast(.66) brightness(1.82);
}
:root[data-theme="light"] .ambient .film-scrim,
:root[data-theme="light"] .gate-amb .film-scrim{
  --light-ambient-film-scrim-background:linear-gradient(180deg,
      rgba(247,244,236,.64) 0%, rgba(247,244,236,.34) 22%,
      rgba(247,244,236,.26) 55%, rgba(247,244,236,.58) 100%),
    radial-gradient(140% 100% at 50% 50%, rgba(247,244,236,.08) 34%, rgba(247,244,236,.50) 100%);
}
/* Light mode's selector outranks the portrait media query, so portrait needs
   saying again here or it silently keeps the wide-screen values. */
@media (max-aspect-ratio:5/4){
  :root[data-theme="light"] .ambient .film,
  :root[data-theme="light"] .gate-amb .film{--light-ambient-film-opacity:.68}
}

/* ---- the gate runs the film harder than the app does ----------------------
   The user asked for it to be more obvious on the sign-in screen, and the gate
   can carry it: it is a five-second screen with nothing to read on it, so the
   calm-to-read half of the rule does not apply. What keeps the type legible is
   .film-scrim::after, the pool under the centre column — NOT the film opacity.
   Both were re-measured together after this change; raising one without
   checking the other is how the type would quietly slip below AA.

   Placed after every shared rule on purpose: these match the shared selectors'
   specificity exactly, so they win on source order alone. Moving this block
   higher silently disables it. */
.gate-amb .film{opacity:var(--light-gate-amb-film-opacity,var(--light-ambient-film-opacity,.66))}
:root[data-theme="light"] .gate-amb .film{--light-gate-amb-film-opacity:.62}
@media (max-aspect-ratio:5/4){
  .gate-amb .film{opacity:var(--light-gate-amb-film-opacity,var(--light-ambient-film-opacity,.86))}
  :root[data-theme="light"] .gate-amb .film{--light-gate-amb-film-opacity:.78}
}

/* ---- the rail follows the theme (2026-07-28, user's request) --------------
   It used to stay dark in light mode on purpose. The user asked for it to
   change with the theme, so it does — but the rail was built on the assumption
   that its ground is always near-black, and roughly a dozen colours inside it
   are hardcoded white or lilac rather than tokenised. Flipping only the
   background would have left white text on parchment. Every one of them is
   restated here, and the whole rail is re-measured after. */
:root[data-theme="light"] .rail{
  --rail:#eae2d3; --rail-2:#ded3bf; --rail-3:#cec0a6; --rail-text:#4f4536;
  --rail-dim:#60533e;   /* the one value four separate light overrides used to repeat */
  /* The token alone does NOTHING here. The cinematic layer re-declares .rail
     with a hardcoded dark gradient, so background-color computes to
     transparent and --rail is never consulted. Found by reading the computed
     background, which came back rgba(0,0,0,0) while --rail was correctly
     #eae2d3 — the token had applied and changed nothing. The gradient is what
     has to be replaced. Contrast below is measured against the DARKER stop. */
  --light-rail-background:linear-gradient(180deg,#ece5d7,#e6dccb);
  --light-rail-border-right:1px solid rgba(16,27,45,.14);
  --light-rail-blur:none;--light-rail-webkit-blur:none;
}
:root[data-theme="light"] .rail .logo{--light-rail-logo-color:#2a2118}
:root[data-theme="light"] .rail .logo .blip{
  /* the gold ring existed to separate a navy medallion from a near-black rail.
     On parchment the disc already stands out, so it becomes a plain soft edge */
  --light-rail-logo-blip-shadow:0 0 0 1px rgba(122,90,20,.30),0 3px 9px rgba(60,45,20,.20);
}
:root[data-theme="light"] .nav-item:hover,
:root[data-theme="light"] .nav-item.on,
:root[data-theme="light"] .railprof .rn{--light-nav-item-hover-color:#2a2118}
:root[data-theme="light"] .railprof .rav{--light-railprof-rav-border-color:rgba(42,33,24,.18)}
:root[data-theme="light"] .railsync{--light-railsync-background:rgba(42,33,24,.055);--light-railsync-color:var(--rail-dim)}
:root[data-theme="light"] .streak{
  --light-streak-background:var(--card);
  --light-streak-border-color:rgba(154,107,31,.38);
}
:root[data-theme="light"] .streak .n{--light-streak-n-color:#7a5200}
:root[data-theme="light"] .modal{
  --light-modal-background:var(--card);
  --light-modal-border:1px solid var(--line-2);
  --light-modal-shadow:0 30px 80px rgba(23,38,66,.22),var(--glow);
}
:root[data-theme="light"] .modal-bg{--light-modal-bg-background:rgba(28,42,66,.38);--light-modal-bg-blur:blur(5px)}
:root[data-theme="light"] .results{--light-results-background:var(--card)}
:root[data-theme="light"] .toast{
  /* stays dark — a light toast on a light page has no presence */
  --light-toast-shadow:0 18px 44px rgba(23,38,66,.3);
}
:root[data-theme="light"] .gsign{
  /* the Google button is white by brand, which on a light page needs a real
     border or it dissolves into the background */
  --light-gsign-border:1px solid rgba(16,27,45,.16);
  
}
:root[data-theme="light"] .gsign:hover{}
:root[data-theme="light"] .mod-ic{}
:root[data-theme="light"] .pill{}
:root[data-theme="light"] .btn:hover:not(:disabled){}



/* ============================================================================
   THE GREEK LAYER — 2026-07-28. Type, glyphs, and the artwork.
   ============================================================================ */

/* ---- glyphs -------------------------------------------------------------- */
/* Stroked SVG inherits currentColor, so a glyph is the colour of its context
   and needs no per-theme rule. Optical alignment is by eye against the cap
   height of EB Garamond, which sits lower than a sans. */
.gi{display:inline-block;vertical-align:-.17em;flex-shrink:0}
h1 .gi,h2 .gi{vertical-align:-.1em;margin-right:.3em;opacity:.85}
.nav-item .ic,.search-ic,.blip,.fl,.emo{display:inline-flex;align-items:center;justify-content:center}
.mod-ic .gi{width:25px;height:25px}
/* the glyph inside a coloured tile is on that colour, so it must be light */
.mod-ic{color:var(--on-fill)}

/* ---- display type -------------------------------------------------------- */
/* EB Garamond carries headings and reading text in one family. */
.logo,.glogo,.gtitle,.mod-name,.grouphdr,.nav-label,.stat .n,.gate h2,.hp-name,.hp-sub{
  font-family:var(--font-display);
}
.logo{font-weight:700}
.eyebrow{font-family:var(--font-display);font-weight:600}
.mod-name{font-weight:700;font-size:17.5px;text-transform:none}
.grouphdr{font-weight:600}
.nav-label{}
.stat .n{font-weight:600}
h2{font-family:var(--font-display);font-weight:600}
/* the question stem stays EB Garamond: it is the one place on the page that is
   read for minutes at a time, and a titling face there would be punishing */
.stem{font-family:var(--font-body)}

/* ---- module artwork ------------------------------------------------------ */
/* One painting per module, drained to greyscale and re-tinted in that module's
   own colour with background-blend-mode:color — hue and saturation come from
   the tint layer, luminance from the artwork. That is what makes four images
   from four different generations read as one commissioned set.

   THE WHOLE PAINTING IS SHOWN, NEVER CROPPED (user's decision, 2026-07-28).
   It used to be a full-bleed background behind the text at background-size:
   cover, which on a wide short card threw away about two thirds of a square
   image — the figure's head and the entire lower half. The art now owns a
   SQUARE panel of its own at the top of the card, so aspect-ratio:1 against a
   square source means cover and contain are the same thing and nothing is lost.

   .mod-grid is the reason this works at all: module cards drop to TWO per row
   while every other card grid stays at three or more, which is what buys the
   painting enough width to be worth showing whole. */
/* Exactly two, not auto-fill: the content column is 1180px, so auto-fill would
   put four across and the painting would be back to thumbnail size. The cap
   keeps a card near 430px — big enough to read the artwork, short of absurd. */
.mod-grid{grid-template-columns:repeat(2,1fr);max-width:880px}
/* button.card sets padding:17px at (0,1,1) — .mod-card alone would lose to it */
button.card.mod-card{display:flex;flex-direction:column;padding:0}
/* A subject whose bank is not finished. It keeps its artwork and its place in
   the grid — the syllabus is four subjects and the grid should say so — but it
   sits back: no hover lift, no pointer, dimmed enough to read as not-yet
   without reading as broken. The dashboard card is a <div>, so there is no
   disabled state to style; this is what carries it. */
.mod-card.locked{display:flex;flex-direction:column;padding:0;cursor:default}
.mod-card.locked:hover{transform:none;}
/* Dim the PAINTING, not the words. This card used to carry opacity:.55, which
   dims the text with everything else: measured against the page that put the
   title, the meta line and the badge at 2.65:1, well under AA, at 10px on the
   badge. The card still sits back — the artwork is what carries "not yet" —
   and the reading stays readable. §6: measured, not habit. */
.mod-card.locked .mod-art{opacity:var(--light-mod-card-locked-mod-art-opacity,var(--light-mod-art-opacity,.42))}
.mod-card.locked .mod-ic{opacity:.72}
.mod-card.locked .mod-name{color:var(--ink-2)}
/* The badge sits on the painting's top corner, not in the title row.
   Measured at 360px: in the title row it needed 328px of a 294px row, so it
   was clipped by the card on BOTH locked subjects, and Neuropsychiatry was
   still 4px over at 390px. Nothing numeric could have caught that — the card
   clips it, so the page never overflows and every width reported "fits". It
   came out of a screenshot. Out of the flow it cannot compete with a long
   subject name at any width, and both locked cards look identical.
   The fill is --card, not --fill: --fill is a dark solid in BOTH themes and
   --ink-3 on it is unreadable in light mode. */
.mod-card>.soon{
  position:absolute;top:11px;right:11px;z-index:2;
  font-size:10px;
  text-transform:none;padding:3px 8px;border-radius:var(--r-1);
  background:var(--card);border:1px solid var(--line);color:var(--ink-3)}
/* Print drops .mod-art, so anchoring to a corner of nothing would land the
   badge on top of the title. Put it back in the flow there. */
@media print{
  .mod-card>.soon{position:static;display:inline-block;margin:0 0 6px}
}
.mod-card>*{position:relative;z-index:1}
.mod-art{
  display:block;width:100%;aspect-ratio:1;flex:0 0 auto;
  border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;
  background-image:linear-gradient(var(--c),var(--c)),var(--art);
  background-size:cover;background-position:center;
  background-blend-mode:color;
  opacity:var(--light-button-card-locked-hover-mod-art-opacity,var(--light-mod-card-locked-mod-art-opacity,var(--light-button-card-hover-mod-art-opacity,var(--light-mod-art-opacity,.9))));
  transition:opacity .5s cubic-bezier(.22,1,.36,1),filter .5s cubic-bezier(.22,1,.36,1);
}
/* the body sits under the art and carries the padding the card gave up */
.mod-info{padding:15px 17px 17px;display:flex;flex-direction:column;gap:0}
/* a hairline between art and text, so the painting ends deliberately */
.mod-info::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line-2);
}
button.card:hover .mod-art{opacity:var(--light-button-card-hover-mod-art-opacity,var(--light-mod-art-opacity,1));filter:saturate(1.12)}
/* on parchment the art is dark against a light card, so it needs less presence */
:root[data-theme="light"] .mod-art{--light-mod-art-opacity:.82}
:root[data-theme="light"] button.card:hover .mod-art{--light-button-card-hover-mod-art-opacity:.95}
/* The locked card dims its artwork, and the rule that says so is further up —
   but the two rules directly above are (0,3,0) as well, and an equal-specificity
   tie is broken by source order, so up there it loses. This is measured, not
   deduced: a locked card in light mode computed .mod-art opacity .82, exactly
   what an unlocked card computes. Dark mode was already correct at .42, because
   dark is bare :root and carries no competing rule. .38 rather than .42 keeps
   the same step down from light's own .82 baseline.
   The theory view's locked card is a real <button class="card">, so the hover
   rule undims it on touch and focus; these two hold it dimmed. */
:root[data-theme="light"] .mod-card.locked .mod-art{--light-mod-card-locked-mod-art-opacity:.38}
button.card.locked:hover .mod-art{opacity:var(--light-button-card-locked-hover-mod-art-opacity,var(--light-mod-art-opacity,.42))}
:root[data-theme="light"] button.card.locked:hover .mod-art{--light-button-card-locked-hover-mod-art-opacity:.38}
/* the corner blob was drawn for a text-only card; over artwork it is noise */
.mod-card::after{display:none}
/* two 300px columns plus the gap need ~615px; below that go single file, where
   a square panel at full phone width is already as large as anyone needs */
@media(max-width:700px){
  .mod-grid{grid-template-columns:1fr;max-width:420px}
}

/* ---- the Herophilus panel ------------------------------------------------ */
.hero-panel{
  display:grid;grid-template-columns:minmax(130px,168px) 1fr;gap:28px;align-items:center;
  background:var(--sheen);background-color:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r);
  padding:24px 30px;margin-bottom:30px;position:relative;overflow:hidden;
  
}
/* a gold rule down the spine, the one ornament on the panel */
.hero-panel::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--card);opacity:.65;
}
.hp-art img{
  width:100%;display:block;border-radius:var(--r-1);border:1px solid var(--line-2);
  
}
/* the engraving is printed on parchment; on the dark theme it is lifted off the
   page so it reads as an object rather than a bright rectangle */
:root .hp-art img{filter:var(--light-hp-art-img-filter,sepia(.2) contrast(1.02) brightness(.94))}
:root[data-theme="light"] .hp-art img{--light-hp-art-img-filter:none}
.hp-kicker{font-size:10.5px;text-transform:none;color:var(--ink-4);font-weight:700}
.hp-name{font-size:33px;text-transform:none;margin:7px 0 3px;color:var(--tx);line-height:1}
.hp-sub{font-size:12.5px;text-transform:none;color:var(--gold-text);margin-bottom:13px}
.hp-txt p{margin:0 0 9px;color:var(--ink-2);font-size:15.5px;line-height:1.72;max-width:62ch}
.hp-txt p:last-child{margin-bottom:0;color:var(--ink-3);font-style:italic}
@media(max-width:720px){
  .hero-panel{grid-template-columns:1fr;gap:18px;padding:22px}
  .hp-art{max-width:150px}
}

/* ============================================================================
   THE CLEPSYDRA — the study companion.

   A κλεψύδρα is the Alexandrian water clock, which is why she is a clock and
   why she wears a laurel crown. She is a projection: a warm amber figure with
   scanlines, a flicker and an occasional glitch, standing on a pool of light.

   She is ONE fixed element, so glass and filters are affordable here in a way
   they are not on a list of cards. Deliberately no backdrop-filter even so —
   she floats above a scrolling page, and a blurred backdrop on a fixed element
   repaints every frame of that scroll.

   Layering: she sits at 150, under the gate (200), confetti (250), modal (300)
   and toast (400). A companion that covered a modal would be a bug.
   ============================================================================ */
.clep{
  position:fixed;right:20px;bottom:18px;z-index:150;
  display:flex;align-items:flex-end;gap:9px;
  touch-action:none;                 /* the figure is a drag handle */
  /* The figure is a PNG now, so it carries its own colour and needs no ramp.
     Six shading tokens went with the SVG. These three are still hers because
     the CHROME around her is drawn in CSS, not painted into the sprite. */
  --cl-1:#ffb96a;                    /* bold text in her speech bubble */
  --cl-2:#ef8228;                    /* the light pool, and tool-button hover */
  --cl-w:#fff1da;                    /* the small dial on her collapsed pill */
  --cl-glow:rgba(255,150,55,.5);
  --cl-glow2:rgba(255,125,30,.26);
  --cl-panel:rgba(24,15,4,.94);
  --cl-text:#ffe4bd;
  --cl-edge:rgba(255,190,110,.42);
}
.clep[hidden]{display:none}          /* display:flex would otherwise beat it */
.cl-col{display:flex;flex-direction:column;align-items:flex-end;gap:7px}

/* ---- the figure ---------------------------------------------------------
   NINE poses of the user's OWN artwork, supplied 2026-08-02, cut out of their
   white sheet and landed on one shared 360x360 canvas by scripts/poses*.ps1.
   She faces the viewer in every one of them and wears her own gold wreath, so
   the CSS stephane that used to be drawn here is GONE — leaving it would put a
   second crown on her head.

   ⚠️ THE CANVAS IS SQUARE NOW. .cl-body was 96x99 for the old 0.967 artwork;
   a non-square box letterboxes her inside her own drag handle, silently and
   with no error. Both the desktop and the mobile size must stay 1:1.

   ⚠️ The box is BIGGER than the old one (112 vs 96) because the new canvas
   has headroom: her figure occupies ~83% of it rather than filling it, so at
   96px she rendered noticeably smaller than before. 112 x 0.83 restores her
   old on-screen height.

   TWO stacked images, not one. The swap needs the outgoing frame to stay on
   screen while it is torn apart — see clepPose(). */
.cl-body{position:relative;width:112px;height:112px;cursor:grab;flex:0 0 auto}
.clep.drag .cl-body{cursor:grabbing}
.cl-stage{position:absolute;inset:0;animation:clBob 3.6s ease-in-out infinite}
.cl-fig{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  -webkit-user-drag:none;user-select:none;
  filter:drop-shadow(0 0 4px var(--cl-glow)) drop-shadow(0 0 13px var(--cl-glow2))}
.cl-ghost{opacity:0;pointer-events:none}   /* the outgoing frame, only alive mid-swap */

/* ---- the pose change ----------------------------------------------------
   A hologram does not dissolve, it FAILS and re-forms. So the outgoing pose is
   not cross-faded out: it is shunted sideways, squashed on the vertical and
   dropped in steps, while the incoming pose comes up underneath it doing the
   same thing out of phase. The existing burst (.gl) rides along on top and
   supplies the shake and the red/cyan split, so the two systems stay in sync
   by construction rather than by matching two sets of numbers.

   .46s is deliberate: shorter read as a flicker rather than a change of pose,
   and longer started to feel like a transition the reader has to wait out. */
@keyframes clSwapOut{
  0%  {opacity:1;  transform:translate3d(0,0,0)     scaleY(1)}
  18% {opacity:1;  transform:translate3d(-5px,0,0)  scaleY(1.05)}
  34% {opacity:.85;transform:translate3d(6px,0,0)   scaleY(.94)}
  52% {opacity:.35;transform:translate3d(-3px,0,0)  scaleY(1.08)}
  70% {opacity:.12;transform:translate3d(2px,0,0)   scaleY(.97)}
  100%{opacity:0;  transform:none}
}
@keyframes clSwapIn{
  0%  {opacity:0;  transform:translate3d(4px,0,0)   scaleY(1.06)}
  30% {opacity:.18;transform:translate3d(-4px,0,0)  scaleY(.95)}
  55% {opacity:.6; transform:translate3d(3px,0,0)   scaleY(1.04)}
  78% {opacity:.92;transform:translate3d(-1px,0,0)  scaleY(.99)}
  100%{opacity:1;  transform:none}
}
/* the lit slice jumps four times across the swap instead of sitting still */
@keyframes clTear{
  0%{top:14%} 25%{top:63%} 50%{top:31%} 75%{top:79%} 100%{top:46%}
}
.clep.swap .cl-ghost{animation:clSwapOut .46s cubic-bezier(.3,.9,.3,1) forwards}
.clep.swap .cl-main {animation:clSwapIn  .46s cubic-bezier(.3,.9,.3,1) forwards}
.clep.swap .cl-band {animation:clTear    .46s steps(4,end)}
.clep.swap .cl-scan {opacity:var(--light-cl-scan-opacity,.9)}

/* The light pool she stands on. It was part of the artwork's background and
   was removed with it, so it is redrawn here as a DOM element — it has to
   pulse with the bob, and it must not be baked into the sprite or it would
   drag a grey ellipse onto the parchment theme.
   ⚠️ bottom:9%, not 0. On the shared canvas her feet land at 89% of the
   height, not at the very bottom; a pool at the box edge floats below her. */
.cl-base{
  position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
  width:56%;height:9px;border-radius:50%;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,var(--cl-2),transparent 72%);
  opacity:.3;animation:clPool 3.6s ease-in-out infinite;
}

/* ---- she is alive ------------------------------------------------------- */
@keyframes clBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* The pool is centred with translateX(-50%), so every keyframe has to RESTATE
   it — a bare scaleX() replaces the whole transform and shunts the ellipse
   half its width to the right. */
@keyframes clPool{
  0%,100%{opacity:.3;transform:translateX(-50%) scaleX(1)}
  50%    {opacity:.42;transform:translateX(-50%) scaleX(1.07)}
}
/* Blink, wave and the sweeping hands are GONE with the SVG. They were per-part
   animations and a flat sprite has no parts; the artwork has no hands to sweep
   either. What still carries her is on the container, not the drawing: the bob,
   the scanlines, the glitch bursts and the glow. The session time now lives
   only in the HUD pill, which is where a reader actually looks for it. */

/* ---- projection artefacts ----------------------------------------------- */
.cl-scan{
  position:absolute;inset:-6px;pointer-events:none;opacity:var(--light-cl-scan-opacity,.55);mix-blend-mode:var(--light-cl-scan-mix-blend-mode,screen);
  background:repeating-linear-gradient(180deg,rgba(255,214,150,.17) 0 1px,transparent 1px 3px);
  animation:clScan 2.4s linear infinite;
  -webkit-mask-image:radial-gradient(62% 56% at 50% 44%,#000 38%,transparent 80%);
  mask-image:radial-gradient(62% 56% at 50% 44%,#000 38%,transparent 80%);
}
@keyframes clScan{from{background-position-y:0}to{background-position-y:3px}}
/* a lit slice that jumps to a new height on each burst — the height is set by
   JS, because a fixed keyframe position reads as a loop rather than a fault */
.cl-band{
  position:absolute;left:-8px;right:-8px;top:var(--cl-band-y,42%);height:7px;
  background:linear-gradient(90deg,transparent,rgba(255,224,178,.55),transparent);
  opacity:0;pointer-events:none;mix-blend-mode:screen;
}
@keyframes clGlitch{
  0%{transform:translate3d(0,0,0)}   20%{transform:translate3d(-2.5px,1px,0)}
  40%{transform:translate3d(2px,-1px,0)} 60%{transform:translate3d(-1px,0,0)}
  80%{transform:translate3d(1.5px,1px,0)} 100%{transform:translate3d(0,0,0)}
}
.clep.gl .cl-band{opacity:1}
.clep.gl .cl-stage{animation:clGlitch .18s steps(3,end) infinite}
.clep.gl .cl-fig{
  filter:drop-shadow(3px 0 rgba(255,72,60,.6)) drop-shadow(-3px 0 rgba(80,220,255,.5))
         drop-shadow(0 0 6px var(--cl-glow));
}

/* ---- what she says ------------------------------------------------------ */
.cl-say{
  position:relative;max-width:270px;min-width:0;
  background:var(--cl-panel);border:1px solid var(--cl-edge);border-radius:var(--r-1);
  padding:11px 30px 12px 14px;
  color:var(--cl-text);font:400 13.3px/1.58 var(--font-body);
  
  opacity:0;transform:translateY(6px) scale(.97);transform-origin:100% 100%;
  transition:opacity .26s cubic-bezier(.22,1,.36,1),transform .26s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
.cl-say.show{opacity:1;transform:none;pointer-events:auto}
.cl-say b,.cl-say strong{color:var(--light-cl-say-b-color,var(--cl-1));font-weight:700}
.cl-say::after{                       /* the tail, pointing at her */
  content:"";position:absolute;right:-6px;bottom:16px;width:10px;height:10px;
  background:var(--cl-panel);border-right:1px solid var(--cl-edge);
  border-bottom:1px solid var(--cl-edge);transform:rotate(-45deg);
}
.cl-x{
  position:absolute;top:6px;right:6px;width:19px;height:19px;border:0;border-radius:50%;
  background:transparent;color:var(--cl-text);opacity:.5;cursor:pointer;line-height:1;
  font-size:14px;display:flex;align-items:center;justify-content:center;
}
.cl-x:hover{opacity:1;background:rgba(255,190,110,.14)}

/* ---- the readout and controls ------------------------------------------- */
.cl-hud{
  display:none;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-1);
  background:var(--cl-panel);border:1px solid var(--cl-edge);color:var(--cl-text);
  font:700 13px/1 var(--font-display);
  font-variant-numeric:tabular-nums;white-space:nowrap;
  
}
.clep.timed .cl-hud{display:inline-flex}
.cl-hud .ph{font-size:9.5px;text-transform:none;opacity:.72;font-weight:700}
.cl-hud.rest{--cl-edge:rgba(127,174,111,.5)}
.cl-tools{display:flex;gap:5px;opacity:0;transition:opacity .2s}
.clep:hover .cl-tools,.clep:focus-within .cl-tools{opacity:1}
.cl-tool{
  width:23px;height:23px;border-radius:50%;cursor:pointer;line-height:1;
  background:var(--cl-panel);border:1px solid var(--cl-edge);color:var(--cl-text);
  font:700 12px/1 var(--font-body);display:flex;align-items:center;justify-content:center;
}
.cl-tool:hover{background:var(--cl-2);color:#241502;border-color:var(--cl-2)}
/* A phone has no hover, so the only thing left to reveal these is
   :focus-within — which means blind-tapping a control you cannot see to find
   out where it is. Where there is no pointer to hover with, show them, and
   give them and the dismiss a real target. 36px with an 8px gap is a 44px
   pitch, so the invisible 44px hit areas tile without overlapping: two
   overlapping targets would just move the mis-tap somewhere else. */
@media(hover:none){
  .cl-tools{opacity:1;gap:8px}
  .cl-tool{width:36px;height:36px;font-size:15px;position:relative}
  /* .cl-x is NOT in that list on purpose: it is position:absolute at a corner
     of the speech bubble, so it already anchors its own ::after, and setting
     it relative here would drop it back into the flow. */
  .cl-tool::after,.cl-x::after{
    content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
    transform:translate(-50%,-50%);
  }
}

/* ---- collapsed ---------------------------------------------------------- */
.cl-mini{
  display:none;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:var(--r-1);
  background:var(--cl-panel);border:1px solid var(--cl-edge);color:var(--cl-text);
  cursor:pointer;font:700 13px/1 var(--font-display);
  font-variant-numeric:tabular-nums;
}
.cl-mini svg{filter:drop-shadow(0 0 5px var(--cl-glow))}
.clep.mini .cl-body,.clep.mini .cl-col{display:none}
.clep.mini .cl-mini{display:inline-flex}

/* ---- docked to the other corner -----------------------------------------
   On the question screens she stands bottom-LEFT (user, 2026-08-02). Skip and
   Next are pushed hard against the RIGHT edge of the question card — .qactions
   does it with margin-left:auto — so in her usual corner she was sitting on
   top of the two buttons the reader presses most.

   The row is REVERSED rather than the figure being moved on its own: her
   bubble, readout and tools all hang off her, and left un-flipped they would
   run off the left edge of the window. Flipping puts the figure on the outside
   and everything that grows on the inside, where there is room.

   These rules only need to beat the base corner when nothing is stored;
   clepPlace() writes inline left/top when she has been dragged, and inline
   always wins. ------------------------------------------------------------ */
.clep.left{flex-direction:row-reverse;right:auto;left:20px}
.clep.left .cl-col{align-items:flex-start}
.clep.left .cl-say{transform-origin:0 100%}
.clep.left .cl-say::after{right:auto;left:-6px;transform:rotate(135deg)}

/* ---- light: only her CHROME re-themes now -------------------------------
   The figure itself does NOT change between themes and must not be made to:
   it is one fixed piece of artwork, and a filter that "adapts" it for
   parchment would be repainting the user's drawing. What still flips is the
   panel, the text, the edge and the halo — all CSS around her. */
:root[data-theme="light"] .clep{
  --cl-1:#a4540a; --cl-2:#c2670f; --cl-w:#fffaf0;
  --cl-glow:rgba(196,100,20,.26); --cl-glow2:rgba(196,100,20,.12);
  --cl-panel:#fff6e6; --cl-text:#4a2c07; --cl-edge:rgba(164,84,10,.42);
}
:root[data-theme="light"] .cl-say b,:root[data-theme="light"] .cl-say strong{--light-cl-say-b-color:#8a4408}
:root[data-theme="light"] .cl-scan{--light-cl-scan-opacity:.3;--light-cl-scan-mix-blend-mode:multiply}

/* ---- small screens: she gets out of the way ----------------------------- */
@media(max-width:700px){
  .clep{right:12px;bottom:12px}
  .clep.left{right:auto;left:12px}
  .cl-body{width:84px;height:84px}   /* SQUARE, like the desktop size — see above */
  .cl-say{max-width:min(64vw,240px);font-size:12.6px}
}

/* ---- opt-outs ----------------------------------------------------------- */
/* Reduced motion keeps the companion but stops every loop, including the ones
   JS starts: clepGlitch() checks the same query before scheduling a burst. */
@media (prefers-reduced-motion:reduce){
  .cl-stage,.cl-base,.cl-scan{animation:none!important}
  .clep.gl .cl-stage{animation:none!important}
  .clep.gl .cl-fig{filter:drop-shadow(0 0 4px var(--cl-glow))!important}
  /* the pose still changes — it just cuts, with no tear and no burst */
  .clep.swap .cl-ghost,.clep.swap .cl-main,.clep.swap .cl-band{animation:none!important}
  .cl-ghost{opacity:0!important}
  .cl-band{display:none}
  .cl-say{transition:none}
}

<!-- Ambient colour field. Fixed and non-interactive, sits behind .app.

<div class="ambient" aria-hidden="true">

<script>

/* ==========================================================================
   CLOUD SYNC  \u2014  paste your Firebase config between the braces below.
   Leave it empty and the app simply runs offline with local profiles.
   Setup instructions are in the app: profile screen \u2192 "Set up sync".
   ========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAg9OGSUbn7A04K5nRdStjzwGrO0nrvidk",
  authDomain: "ward-round-e4822.firebaseapp.com",
  projectId: "ward-round-e4822",
  storageBucket: "ward-round-e4822.firebasestorage.app",
  messagingSenderId: "353156608996",
  appId: "1:353156608996:web:1b8faf5f9fa01dafd48df1"
};




/* ============ SCHEDULE ============ */
const SUBJ_COLOURS=[['#b4472f','ENT'],['#5c7a52','Ophthalmology'],['#6d4c7d','Neuro/Psych'],
                    ['#2e5f8a','Pediatrics'],['#7a6a55','Revision'],['#9a6b1f','Buffer'],['#2f6b8f','Other']];

/* Shape: [{date, rest, items:[{label,text,hex}]}], sorted by date.

   THERE IS NO BUILT-IN PLAN, and that is deliberate. The app used to ship one
   author's revision timetable, built around one faculty's exam dates. Everyone
   who opened it inherited a stranger's plan and had to demolish it before their
   own could exist — and the dates were wrong for them the moment the calendar
   moved on. A schedule is the one thing here that cannot be written for someone
   else, so every profile starts empty and builds its own. `data/schedule.js` was
   deleted with this change; nothing else read it. */
function activeSchedule(){
  if(!S.schedule)S.schedule=[];
  return S.schedule;
}
function saveSchedule(){save();render()}

/* ============ STORAGE ============ */
let KEY='wardround.v2';
/* banks: per-module source filter, {ent:['endpoint','house'], …}. An absent or
   empty entry means "all sources" — never store the full set, so a bank added
   later is included by default instead of silently hidden. */
let S={answers:{},flags:{},conf:{},sched:{},srs:{},days:{},hl:{},banks:{},resumeByChapter:{},notes:{},reports:{}};
let storageMode='memory';

async function loadState(){
  const key=KEY,p=me,entry=profileLoad;
  let raw=null,mode='local';
  try{
    if(typeof window!=='undefined'&&window.storage&&window.storage.get){
      const r=await window.storage.get(key);
      if(entry!==profileLoad||me!==p)return;
      raw=r&&r.value;mode='cloud';
    }
  }catch(e){if(entry===profileLoad&&me===p)storageMode='cloud';return}
  /* Parsing and checking share their own try so a missing, unreadable or
     unusable value reaches the existing snapshot ladder instead of becoming
     live state or dropping the app to memory-only storage. */
  try{
    if(mode==='local'){try{ raw=localStorage.getItem(key) }catch(e){}}
    let parsed=null;
    if(raw){ try{ parsed=checkedProgressState(JSON.parse(raw)) }catch(e){ parsed=null } }
    if(!parsed){
      const r=bakNewest();
      if(r){
        try{ parsed=checkedProgressState(r.state); bakRestored=r.at }catch(e){}
      }
    }
    if(parsed)S=Object.assign(S,parsed);
    if(!S.hl)S.hl={};
    storageMode=mode;
    migrateSched();dropAI();
  }catch(e){storageMode='memory'}
}
function dropAI(){delete S.ai;delete S.aiKey;delete S.hideFileWarn}
function migrateSched(){
  const out={};
  Object.keys(S.sched||{}).forEach(k=>{
    if(/\|\d+$/.test(k)){out[k]=S.sched[k];return}
    if(k.indexOf('|main')>0){out[k.replace('|main','|0')]=S.sched[k];return}
    if(k.indexOf('|peds')>0){out[k.replace('|peds','|1')]=S.sched[k];return}
    out[k+'|0']=S.sched[k];out[k+'|1']=S.sched[k];
  });
  S.sched=out;
}
/* A toast disappears and the page is rebuilt on every answer. This notice lives
   outside the page, so a storage failure stays visible throughout this visit. */
function warnSaveFailure(message,id='saveWarning'){
  if(document.getElementById(id))return;
  const box=document.createElement('div');
  box.id=id;
  box.setAttribute('role','alert');
  box.innerHTML='<span class="warnico" aria-hidden="true">!</span>'+(message||'<p><strong>Saving failed during this visit.</strong> Recent progress may be missing from storage. Keep this tab open and download a copy before leaving.</p>'+
    '<button class="btn sec" onclick="exportData()">Download progress</button>');
  const page=document.getElementById('page');
  page.parentNode.insertBefore(box,page);
  if(!message)toast('Progress could not be saved. Please read the saving warning.');
}
/* The aggregators deliberately tolerate absent files. Checking their inputs
   here prevents a missing or unparseable script from looking like a small bank.
   Empty arrays and maps are valid, including subjects still being prepared. */
warnSaveFailure.checkData=function(){
  const missing=[];
  const subjects=[
    ['ENT','ent',['Q_ENT','C_ENT'],['T_ENT']],
    ['Pediatrics','pediatrics',['Q_PEDS','Q_PEDS_EP','Q_PEDS_EP2','C_PEDS'],['T_PEDS']],
    ['Ophthalmology','ophtho',['Q_OPHTHO','C_OPHTHO'],['T_OPHTHO']],
    ['Neuro/Psych','neuropsych',['Q_NEURO','C_NEURO'],['T_NEURO']]
  ];
  /* The launch build leaves out the data for a locked subject on purpose, and
     every theory file while that section is locked. Looking for those files is
     looking for something the build was told not to ship, which is why the
     upload showed all four subjects failing while the rail counted 4,049
     questions. Only the files that should be present are checked. */
  let locked=[];
  try{if(typeof LOCKED_MODULES!=='undefined'&&Array.isArray(LOCKED_MODULES))locked=LOCKED_MODULES}catch(e){}
  let notesLocked=false;
  try{notesLocked=typeof THEORY_LOCKED!=='undefined'&&!!THEORY_LOCKED}catch(e){}
  subjects.forEach(s=>{
    if(locked.indexOf(s[1])>=0)return;
    const banksGone=s[2].some(k=>!Array.isArray(window[k]));
    const notesGone=!notesLocked&&s[3].some(k=>
      !window[k]||typeof window[k]!=='object'||Array.isArray(window[k]));
    if(banksGone||notesGone)missing.push(s[0]);
  });
  /* MODULES is a lexical constant, so looking on window would falsely report
     a failure on every healthy boot. Without the catalogue no subject can open. */
  let catalogue=false;
  try{catalogue=typeof MODULES!=='undefined'&&Array.isArray(MODULES)}catch(e){}
  if(!catalogue)missing.push('all subjects (module list)');
  if(missing.length)warnSaveFailure('<p><strong>Part of the question bank failed to load.</strong> Affected: '+
    missing.join(', ')+'. Reload the page.'+(catalogue?' You can study the subjects that loaded.':'')+'</p>', 'dataWarning');
  return catalogue;
};
async function save(){
  S.updatedAt=Date.now();
  let saved=false;
  try{
    if(storageMode==='cloud'&&window.storage&&window.storage.set){
      const key=KEY,raw=JSON.stringify(S),storage=window.storage;
      /* Each key has one active write and one replaceable pending write, so
         a slow earlier request cannot overwrite a later answer. Keeping the
         key and payload together also prevents writes crossing profiles.
         A superseded caller gets false because its payload was not persisted. */
      const writes=save.cloudWrites||(save.cloudWrites=new Map());
      let queue=writes.get(key);
      if(!queue){queue={running:false,pending:null};writes.set(key,queue)}
      saved=await new Promise(resolve=>{
        if(queue.pending)queue.pending.resolve(false);
        queue.pending={raw:raw,storage:storage,resolve:resolve};
        if(queue.running)return;
        queue.running=true;
        (async()=>{
          while(queue.pending){
            const job=queue.pending;queue.pending=null;
            let ok=false;
            try{await job.storage.set(key,job.raw);ok=true}catch(e){warnSaveFailure()}
            job.resolve(ok);
          }
          writes.delete(key);
        })();
      });
    }
    else if(storageMode==='local'){localStorage.setItem(KEY,JSON.stringify(S));saved=true}
    else throw new Error('No persistent storage is available');
  }catch(e){warnSaveFailure()}
  schedulePush();
  bakSchedule();
  return saved;
}

const $=id=>document.getElementById(id);

/* The three question banks the material comes from. Order here is the order the
   filter chips render in. `bank` on a question is one of these ids; anything
   missing one is treated as 'endpoint', which is where every question
   transcribed before the field existed came from. */
const BANKS=[
  {id:'endpoint', name:'Endpoint',   hex:'#9a6b1f'},
  {id:'house',    name:'House',      hex:'#2f6b8f'},
  {id:'gradegain',name:'Grade Gain', hex:'#8f3f5c'}
];
/* Module id -> artwork basename. The ids and the filenames diverge (neuropsych
   vs mod-neuro), so this map exists rather than a string template. */
const MOD_ART={ent:'mod-ent',ophtho:'mod-ophtho',neuropsych:'mod-neuro',pediatrics:'mod-peds'};

/* A question's clinical photograph, cropped out of the bank by
   Design\scripts\q-images.ps1 and named for the source page it came from —
   q.image is 'q-2844', which cites ENT endpoint.pdf p.2844 by itself.

   ⚠️ The path is BUILT HERE and never written as a literal src in a template.
   A single-file build has no assets\ folder, so the bundler has to rewrite
   these to data: URIs — the same reason poseSrc() and MOD_ART exist. One
   function is one place for it to intercept; a literal src is a broken image
   that the bundler cannot see and that throws nothing when it fails. */
function qImgSrc(name){ return `assets/q/${name}.jpg`; }

/* The figure block. `imgAlt` is the bank's own wording for what the picture is
   ("otoscopy of the left ear"); where a question is unanswerable without the
   picture the caption says so, because a learner whose images failed to load
   otherwise just sees a question that makes no sense. */
function qFigure(q){
  if(!q.image) return '';
  const alt=q.imgAlt||'Clinical image printed with this question';
  return `<figure class="qfig">
    <div class="qfig-media"><img src="${qImgSrc(q.image)}" alt="${esc(alt)}" onclick="openZoom('${q.image}')" onerror="qFigure.failed(this)">
      <p class="qfig-failure" role="alert" hidden>The figure could not be loaded. This question needs it. Reload the page to try again.</p></div>
    <figcaption>${esc(alt)}${q.imgEssential?' — this question cannot be answered without it.':''}
      <span class="qfig-hint">Tap to enlarge.</span></figcaption>
  </figure>`;
}
/* The image gives up its place to an explanation and loses the zoom it can no
   longer open, so a missing file cannot leave the browser's broken-image glyph
   sitting in a question the student cannot answer without the picture. The
   caption's invitation to enlarge goes with it, because there is nothing left
   to enlarge. */
qFigure.failed=function(img){
  img.onerror=null;
  img.onclick=null;
  img.style.display='none';
  img.setAttribute('aria-hidden','true');
  const box=img.parentNode;
  box.querySelector('.qfig-failure').hidden=false;
  const fig=box.closest('.qfig');
  const hint=fig?fig.querySelector('.qfig-hint'):null;
  if(hint)hint.hidden=true;
};
function openZoom(name){
  const d=document.createElement('div');
  d.className='qzoom';
  d.innerHTML=`<img src="${qImgSrc(name)}" alt="" onerror="qFigure.failed(this)">
    <p class="qfig-failure" role="alert" hidden>The figure could not be loaded. This question needs it. Reload the page to try again. Tap to close.</p>`;
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
}

const bankOf=q=>q.bank||'endpoint';
const bankName=b=>(BANKS.find(x=>x.id===b)||{name:b}).name;
/* ---- a question can belong to MORE THAN ONE bank ------------------------
   The commercial banks reprint each other, so the same question genuinely
   appears in two of them. It used to be stored as TWO entries, one per bank,
   which meant that ticking both sources showed the learner the same question
   twice (user, 2026-08-03).

   So a question now carries its origin bank in `bank` and any OTHER bank it
   also appears in in `alsoIn`. One entry, several banks: it shows up whichever
   of its banks is ticked, exactly once however many are ticked, and vanishes
   only when none of them is.

   ⚠️ EVERYTHING THAT TOUCHES A BANK MUST GO THROUGH banksOf(), NOT bankOf().
   Miss one and the failure is silent and asymmetric — the question filters
   correctly but is missing from a count, or counts but cannot be filtered to.
   `bankOf` survives only as "which bank was this transcribed from", which is
   what the id prefix and the source citation record.
   ------------------------------------------------------------------------ */
const banksOf=q=>[bankOf(q)].concat(q.alsoIn||[]);
/* One pill per bank the question appears in, origin first. */
const bankPills=q=>banksOf(q).map(id=>
  `<span class="pill bankpill" style="background:${(BANKS.find(b=>b.id===id)||{hex:'#7a6a55'}).hex}">${esc(bankName(id))}</span>`
).join('');
/* Empty or absent filter = show everything. Filtering lives here, in the two
   selectors the whole app already reads through, so chapter rows, counts,
   quizzes, search and progress all agree without any of them knowing about it. */
/* A subject whose bank is not finished. QUESTIONS and THEORY already exclude
   these in data/questions.js and data/theory.js, so nothing here has to filter
   anything — this is only for the places that walk MODULES itself, which still
   holds all four so the cards keep appearing. */
const isLocked=id=>LOCKED_MODULES.indexOf(id)>=0;
const openModules=()=>activeModules().filter(m=>!isLocked(m.id));
const bankOn=q=>{const f=S.banks&&S.banks[q.module];
  return !f||!f.length||banksOf(q).some(b=>f.indexOf(b)>=0)};
const qsIn=ch=>QUESTIONS.filter(q=>q.chapter===ch&&bankOn(q));
const qsInModule=m=>QUESTIONS.filter(q=>q.module===m&&bankOn(q));
/* Unfiltered, for the filter UI itself — it must count what it would reveal. */
const allQsInModule=m=>QUESTIONS.filter(q=>q.module===m);
/* Banks this module actually holds questions from. The filter must work over
   THIS, not over all of BANKS — otherwise a bank with no questions yet counts
   as "still selected", so turning off every visible source leaves the module
   showing nothing while the guard below thinks a source is still on. */
const banksPresent=mod=>BANKS.map(x=>x.id).filter(id=>QUESTIONS.some(q=>q.module===mod&&banksOf(q).indexOf(id)>=0));
function toggleBank(mod,b){
  const present=banksPresent(mod);
  const stored=S.banks[mod]||[];
  /* Drop anything stored that this module no longer has, so a stale id cannot
     linger invisibly and desync the chips from what is actually shown. */
  let cur=stored.length?stored.filter(x=>present.indexOf(x)>=0):present.slice();
  if(!cur.length)cur=present.slice();
  cur=cur.indexOf(b)>=0?cur.filter(x=>x!==b):cur.concat([b]);
  if(!cur.length){toast('Keep at least one source turned on');return}
  /* Store [] when everything present is on, so a bank added later is included
     by default rather than silently filtered out. */
  S.banks[mod]=(cur.length===present.length)?[]:cur;
  save();render();
}
function clearBanks(mod){S.banks[mod]=[];save();render()}
/* Run once after state loads. A saved filter can name a bank the module no
   longer has — content gets re-chaptered and re-sourced as transcription goes
   on — and a filter that matches nothing would show an empty module with no
   obvious cause. Anything left with no live banks falls back to "show all". */
function sanitiseBanks(){
  if(!S.banks)S.banks={};
  Object.keys(S.banks).forEach(mod=>{
    /* A hidden subject has no visible banks, which does not mean its saved
       filter is obsolete. Leave it intact until that subject is available. */
    if(!activeModules().some(m=>m.id===mod)||isLocked(mod))return;
    const present=banksPresent(mod);
    const kept=(S.banks[mod]||[]).filter(b=>present.indexOf(b)>=0);
    S.banks[mod]=(!kept.length||kept.length===present.length)?[]:kept;
  });

const isCorrect=id=>S.answers[id]&&S.answers[id].ok;
/* ⚠️⚠️ NEVER BUILD A CALENDAR DATE WITH toISOString() — IT CONVERTS TO UTC.
   This app's user is at UTC+3, so every night between 00:00 and 03:00 local
   `new Date().toISOString().slice(0,10)` returns YESTERDAY. Measured, not
   reasoned: at 00:41 local on 14 Aug the schedule highlighted 13 Aug as TODAY,
   and the same off-by-one moved every SRS due date and broke `nextFreeDate()`,
   which returned the last scheduled day again instead of the day after it.
   A study app is used late at night; this was wrong for three hours a night.
   Dates here are CALENDAR days in the reader's own timezone — read the local
   components. */
const isoLocal=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO=()=>isoLocal(new Date());

/* Light/dark is a DEVICE preference, not a profile one — it is about the room
   you are sitting in, not who is studying. So it lives in its own localStorage

   the same account on a phone at night and a laptop by a window wants two

const THKEY='wardround.theme';

/* Follow the operating system, but only until the user overrides it once.
   After that their choice wins on this device for good. */

function toast(msg){

  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){
  if(!s)return '';
  let h=esc(s);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  const lines=h.split('\n');let out='',tbl=[],para=[];
  const flushT=()=>{
    if(!tbl.length)return;
    out+=mdTable(tbl,'');tbl=[];
  };
  const flushP=()=>{if(para.length){out+='<p>'+para.join(' ')+'</p>';para=[]}};
  for(const ln of lines){
    if(ln.trim().startsWith('|')){flushP();tbl.push(ln);continue}
    flushT();
    if(!ln.trim()){flushP();continue}
    para.push(ln.trim());
  }

}
function ring(pct,color,size){

  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e5e2f5" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/>

function confetti(){
  const cols=['#b4472f','#ffc94a','#6d4c7d','#2e5f8a','#5c7a52'];
  for(let i=0;i<44;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'vw';
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.9+Math.random()*1.5)+'s';
    d.style.animationDelay=(Math.random()*.35)+'s';

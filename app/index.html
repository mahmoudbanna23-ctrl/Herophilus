<title>Herophilus — 2nd Term Question Bank</title>
<!-- Theme is chosen BEFORE any CSS parses, so a light-mode user never sees a
     dark flash on load. It has to be inline and it has to be here: a deferred
     script, or one at the end of <body>, runs after first paint and the flash
     is then unavoidable. Kept deliberately tiny for the same reason.
     No stored choice = follow the operating system. -->
<script>
(function(){
  var t=null;
  try{t=localStorage.getItem('wardround.theme')}catch(e){}
  if(t!=='light'&&t!=='dark'){
    t=(window.matchMedia&&matchMedia('(prefers-color-scheme:light)').matches)?'light':'dark';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<!-- Classical faces, embedded as data URIs. Must sit HERE, in <head> and before
     the stylesheet: a classic script blocks parsing and runs immediately, so the
     @font-face rules are registered before first paint. Moved to the end of
     <body> with the other data files, the whole page would render in a fallback
     face and then reflow. See data/fonts.js for why they are base64 and not
     .woff2 files sitting next door. -->
<script src="data/fonts.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/print.css">
<link rel="stylesheet" href="css/views.css">
</head>
<body>
<!-- Ambient colour field. Fixed and non-interactive, sits behind .app.
     Its motion is paused by CSS on the reading views — see the cinematic layer.
     Source order IS the stacking order here (all children are absolute, none
     carries a z-index): film at the back, orbs tinting it, scrim over both. -->
<div class="ambient" aria-hidden="true">
  <!-- muted + playsinline are what make autoplay legal at all; without both,
       iOS Safari refuses and we fall back to the poster frame, which is a
       perfectly good still. A failure here costs atmosphere, never function. -->
  <video class="film" autoplay muted loop playsinline preload="auto"
         poster="assets/ambient-library.jpg" tabindex="-1">
    <source src="assets/ambient-library.mp4" type="video/mp4">
  </video>
  <span class="orb o1"></span><span class="orb o2"></span>
  <span class="orb o3"></span><span class="orb o4"></span>
  <span class="film-scrim"></span>
</div>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="logo"><span class="blip"><img src="assets/icon-96.png" alt="" width="32" height="32"></span> Herophilus</div>
      <div class="rail-sub" id="railTerm">Choose your semester</div>
    </div>
    <button class="railprof" id="railProf" onclick="switchProfile()"></button>
    <div class="railsync" id="railSync" style="display:none"></div>
    <div class="streak" id="streakBox"></div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="tb-btn mobile-only" onclick="toggleRail()" aria-label="Menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="search-wrap">
        <span class="search-ic"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M11 11m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0"/><path d="M20 20l-4.2-4.2"/></svg></span>
        <input class="search" id="search" placeholder="Search questions, topics, explanations…" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="results">
        <div class="results" id="results" role="listbox" aria-label="Search results"></div>
      </div>
      <div class="topbar-actions">
        <button class="tb-btn themebtn" onclick="toggleTheme()"></button>
        <button class="tb-btn kbd-btn" onclick="showShortcuts()" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h19v11h-19z"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
        <!-- Backup used to be a pair of Export / Import buttons the user had to
             remember to press. It is automatic now: this is a status light that
             opens the snapshot list. The file input stays as the rescue path. -->
        <button class="tb-btn bak-btn" id="bakBtn" onclick="showBackup()"
                title="Backup" aria-label="Backup"></button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="splash" id="splash">
  <div class="glogo"><span class="blip"><img src="assets/icon-96.png" alt="" width="38" height="38"></span> Herophilus</div>
  <div class="spinner"></div>
  <div class="msg" id="splashMsg">Restoring your session&hellip;</div>
</div>
<div class="gate" id="gate"></div>
<!-- The Clepsydra. Empty here and filled by clepMount(): the dial's ticks and
     the laurel are computed rather than hand-written, so the figure lives in
     JS beside the maths that places it. -->
<div class="clep" id="clep" hidden></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

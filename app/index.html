const SRS=[1,3,7,21,60];
function scheduleSRS(qid,ok){
  const cur=S.srs[qid]||{lvl:0};
  cur.lvl = ok ? Math.min(cur.lvl+1,SRS.length-1) : 0;
  const d=new Date();d.setDate(d.getDate()+SRS[cur.lvl]);
  cur.due=isoLocal(d);
  S.srs[qid]=cur;
}
/* Guessed and unsure questions belong in the deck even when correct.
   Unsure used to be excluded here, which is what made the middle button of
   the confidence rating dead: it stored a 1 and nothing read it, so the
   question never came back and the toast promising it would was false.
   Confident is deliberately still out — that is what confident means.
   An old record saved before ratings existed has no conf at all, and
   undefined matches neither number, so it stays out exactly as before. */
function inDeck(q){
  if(!isAnswered(q.id))return false;
  if(!isCorrect(q.id))return true;
  const c=S.answers[q.id].conf;
  return c===0||c===1;
}
function deckAll(){return QUESTIONS.filter(inDeck)}
function dueNow(){
  const t=todayISO();
  return deckAll().filter(q=>{
    const s=S.srs[q.id];
    if(!s)return true;
    if(isCorrect(q.id)&&s.lvl>=SRS.length-1)return false;
    return s.due<=t;
  });
}
function streakCount(){
  const days=Object.keys(S.days).sort().reverse();
  if(!days.length)return 0;
  let n=0;const d=new Date();
  for(;;){
    const iso=isoLocal(d);
    if(S.days[iso]){n++;d.setDate(d.getDate()-1)}
    else if(iso===todayISO()){d.setDate(d.getDate()-1)}
    else break;
    if(n>400)break;
  }
  return n;
}

/* ⚠️⚠️ IS THIS ROW THE `|---|---|` RULE? The old test was
   `/^\s*\|?\s*[-: ]+\|/`, and it ATE THE HEADER of every table whose first
   column is unlabelled: in `| | **A** | **B** |` the `[-: ]+` happily matched
   the single SPACE between the first two pipes, so the header was discarded as
   a separator and the first data row was promoted into it — silently, with
   every column label shifted one row up. The rule row contains nothing but
   pipes, dashes, colons and spaces, and it must contain a dash; test for
   exactly that. */
function isMdRule(row){
  const t=String(row).trim();
  return /^[|\s:-]+$/.test(t)&&t.indexOf('-')>=0;
}
/* ⚠️ SPLIT A PIPE-TABLE ROW WITHOUT LOSING ITS EMPTY CELLS. The old code was
   `row.split('|').filter(c=>c.trim()!=='')`, which drops the two empty
   fragments either side of the row — and every empty cell INSIDE it too. A
   comparison table's header almost always starts with a blank corner cell
   (`| | **A** | **B** |`), so its header came out one column short and every
   column label shifted left by one against the body. Found by rendering a
   two-column comparison to PDF and reading it; nothing throws, and the table
   still looks like a table. Trim only the outer delimiters. */
/* ⚠️⚠️ THE HEADER ROW GOES IN A <thead>, AND IT IS A PRINT DECISION, NOT TIDINESS.
   Measured: compressing a chapter from prose into tables cut its word count by
   63 % and its PAGE count by nothing at all — 3,826 words still printed 16
   pages, where the 10,384-word prose version printed 30. Density fell from ~350
   words a page to ~240. The cause is `break-inside:avoid` on a page full of
   medium tables: a ten-row table that will not fit in the space left jumps
   whole to the next page and leaves the bottom third of the sheet blank, over
   and over. Letting tables break is only safe if the reader can still see the
   column labels on the continuation page, and `display:table-header-group` on a
   real <thead> is what repeats them. Emitted here so md() and mdBlock() cannot
   drift apart. */
function mdTable(rows,attr){
  const body=rows.filter(r=>!isMdRule(r)).map(mdCells);
  if(!body.length)return '';
  const cell=(c,t)=>`<${t}>${c.trim()}</${t}>`;
  let t='<table'+(attr||'')+'>';
  t+='<thead><tr>'+body[0].map(c=>cell(c,'th')).join('')+'</tr></thead>';
  if(body.length>1)t+='<tbody>'+body.slice(1).map(r=>'<tr>'+r.map(c=>cell(c,'td')).join('')+'</tr>').join('')+'</tbody>';
  return t+'</table>';
}
function mdCells(row){
  const c=String(row).split('|');
  if(c.length&&c[0].trim()==='')c.shift();
  if(c.length&&c[c.length-1].trim()==='')c.pop();
  return c;
}
/* The coloured anchor at the head of an entity block or a "**Term** — fact"
   bullet. ⚠️ IT CANNOT BE DONE IN CSS. `strong:first-child` was tried and
   painted whole paragraphs terracotta: measured over all 30 ENT chapters, the
   MEDIAN line that opens in bold carries 71 characters of it and the longest
   440, because the telegraphic format bolds the whole clinical statement, not
   just its subject. Colouring that is a wall, not a rail.
   What the format really writes is `**TERM: rest**` or `**TERM — rest**`, so
   the anchor is the part before that punctuation — "Definition:", "TRUE:",
   "FETOR = OSTEITIS". 65 % of bold-opening lines yield one; the rest keep plain
   bold, which is the correct outcome for a line that has no single subject.
   Returns null when there is no anchor, so the caller leaves the line alone. */
function mdLead(t){
  if(!t.startsWith('<strong>'))return null;
  const end=t.indexOf('</strong>');
  if(end<0)return null;
  const inner=t.slice(8,end);
  /* Only ever cut inside the leading run of PLAIN text. An organism name is
     `<em>`-wrapped inside the bold, and splitting across a tag boundary would
     emit crossed tags — which browsers silently repair into something else. */
  const lt=inner.indexOf('<');
  const plain=lt<0?inner:inner.slice(0,lt);
  const ci=plain.slice(0,44).search(/[:—]/);
  let cut=-1;
  if(ci>0)cut=ci+1;
  else if(lt<0&&inner.length<=44)cut=inner.length;   // a short bold IS the term
  if(cut<0)return null;
  return '<strong><span class="lt">'+inner.slice(0,cut)+'</span>'+
         inner.slice(cut)+'</strong>'+t.slice(end+9);
}
function mdBlock(s){
  if(!s)return '';
  let h=esc(s);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+?)\*/g,'$1<em>$2</em>');
  const lines=h.split('\n');
  let out='',para=[],list=[],quote=[],tbl=[],pcls='';
  /* ⚠️ THE PARAGRAPH CLASS IS DECIDED BY THE LINE THAT OPENS THE PARAGRAPH, so it
     is captured when the first line is pushed and cleared when the paragraph is
     flushed. Deciding it at flush time would read the LAST line instead. */
  const fp=()=>{if(para.length){out+='<p'+(pcls?' class="'+pcls+'"':'')+'>'+para.join(' ')+'</p>';para=[];pcls=''}};
  const fl=()=>{if(list.length){out+='<ul>'+list.map(i=>'<li>'+i+'</li>').join('')+'</ul>';list=[]}};
  const fq=()=>{if(quote.length){out+='<blockquote>'+quote.join(' ')+'</blockquote>';quote=[]}};
  /* Pipe tables. The `table:{head,rows}` field still works and is unchanged — this
     is for tables written inline in `body`, which a section may hold several of.
     Same logic md() already runs on every question explanation, emitting the
     th-table class so it inherits the styling tableHTML() gets. Bold and italic
     are applied to the whole string above, so cells arrive already formatted. */
  const ft=()=>{
    if(!tbl.length)return;
    out+=mdTable(tbl,' class="th-table"');tbl=[];
  };
  lines.forEach(ln=>{
    const t=ln.trim();
    if(t.startsWith('|')){fp();fl();fq();tbl.push(t);return}
    ft();
    if(!t){fp();fl();fq();return}
    /* ⚠️ esc() runs above, so a markdown "> " has ALREADY become "&gt; " by the
       time we get here — matching only '> ' meant blockquotes never rendered at
       all and the marker showed as literal text. Match the escaped form too. */
    if(t.startsWith('&gt; ')){fp();fl();quote.push(t.slice(5));return}
    if(t.startsWith('> ')){fp();fl();quote.push(t.slice(2));return}
    /* A bare '>' separating two quotes has no text after it, so it matches
       neither test above and fell through to become a paragraph containing a
       single stray angle bracket. Close the open quote and drop the marker. */
    if(t==='&gt;'||t==='>'){fp();fl();fq();return}
    if(t.startsWith('- ')){fp();fq();const b=t.slice(2);list.push(mdLead(b)||b);return}
    /* ── THREE LINE KINDS THAT ARE NOT PROSE ────────────────────────────────
       ⚠️ ALL THREE MATCH THE CONVERTED HTML, NOT THE MARKDOWN. esc() and the
       bold/italic replacement both run over the WHOLE string above, before this
       loop, so by the time a line arrives here `**X**` is already `<strong>X…`
       and `*x*` is already `<em>x</em>`. Matching asterisks here finds nothing —
       and finds it silently, since a missed match just falls through to <p>. */
    if(t.startsWith('### ')){fp();fl();fq();out+='<h3 class="th-sub">'+t.slice(4)+'</h3>';return}
    /* The `Src:` line closes almost every section written under the §14 format.
       It is a citation, not a sentence — styled as a caption so the eye skips it
       while reading and finds it when checking. Every merged chapter already
       ends its sections this way, so they all take the new look with no rewrite. */
    if(t.startsWith('Src:')){fp();fl();fq();out+='<p class="src">'+t+'</p>';return}
    /* A whole line in italics is a cross-reference or an aside — "*full table in
       ent-csom*". Anchored at both ends and allowing no inner tag, so a paragraph
       that merely BEGINS with an italic phrase is not mistaken for one. */
    if(/^<em>[^<]*<\/em>$/.test(t)){fp();fl();fq();out+='<p class="xref">'+t+'</p>';return}
    fl();fq();
    /* A paragraph opening on a bold term is an ENTITY BLOCK — "**DIPHTHERIA (L3):**
       …". Marking it lets print colour just that first term, which is what turns a
       column of grey paragraphs into a scannable list without touching the words. */
    if(!para.length&&t.startsWith('<strong>')){pcls='lead';para.push(mdLead(t)||t);return}
    para.push(t);
  });
  fp();fl();fq();ft();
  return out;
}

function tableHTML(t){

  return h+'</tbody></table>';
}
function mdInline(s){
  return esc(String(s||'')).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

      h+=`<button class="card mod-card${lock?' locked':''}" style="--c:${m.color}" ${chs.length?`onclick="go({name:'theory',mod:'${m.id}'})"`:'disabled style="opacity:.45"'}>
        ${(m.art||MOD_ART[m.id])?`<span class="mod-art" style="--art:url('assets/${m.art||MOD_ART[m.id]}.jpg')"></span>`:''}
        ${lock?'<span class="soon">Coming soon</span>':''}
        <div class="mod-info">
          <div class="mod-top"><span class="mod-ic">${ico(m.icon,25)}</span><span class="mod-name">${m.name}</span></div>
          <div class="mod-meta" style="margin-bottom:0">${lock?'Being written':chs.length?`${chs.length} lecture${chs.length===1?'':'s'} written`:'no notes yet'}</div>
        </div>
      </button>`;
    });
    p.innerHTML=h+'</div>';return;
  }
  const m=moduleOf(view.mod);
  if(!view.ch){
    const chs=theoryChapters(view.mod);
    let h=`<button class="tb-btn" style="padding-left:0;margin-bottom:8px" onclick="go({name:'theory'})">&larr; Theory</button>
    <div class="eyebrow" style="background:${m.hex}">${m.name}</div><h1>${ico(m.icon,26)} ${m.name} notes</h1>
    <p class="page-sub">Tap a lecture to open its full summary.</p>`;
    chs.forEach(([cid,cname])=>{
      const t=THEORY[cid];
      const nq=(t.sections||[]).reduce((n,s)=>n+(s.qs||[]).length,0);
      const must=(t.sections||[]).filter(s=>s.w==='must').length;
      h+=`<button class="th-ch" onclick="go({name:'theory',mod:'${view.mod}',ch:'${cid}'})">
        <span class="ch-dot" style="background:${m.hex}"></span>
        <span class="n">${esc(cname)}</span>
        <span class="m">${t.sections.length} sections \u00b7 ${must} must-know \u00b7 ${nq} linked Qs</span></button>`;
    });
    p.innerHTML=h;return;
  }

  /* ---- the lecture as one continuous document ---- */
  const t=THEORY[view.ch];
  if(!t){p.innerHTML=`<div class="empty"><div class="big">${ico('scroll',46)}</div><h3>No notes for this lecture</h3></div>`;return}
  const secs=t.sections||[];
  const allQs=[];
  secs.forEach(s=>(s.qs||[]).forEach(q=>{if(allQs.indexOf(q)<0)allQs.push(q)}));
  const LBL={must:'must know',high:'high yield',know:'background'};
  /* The printed chapter is designed in the MODULE's colour, so the stylesheet
     needs to know which module this is. Chrome supports neither `string-set` nor
     a var() inside an @page margin box, so the running head is written as a
     literal into a style element instead — one per chapter, replaced each time. */
  document.documentElement.style.setProperty('--mod',m.hex);
  (function(){
    let st=document.getElementById('printhead');
    if(!st){st=document.createElement('style');st.id='printhead';document.head.appendChild(st);}
    const esq=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
    st.textContent='@media print{@page{@top-right{content:"'+esq(chapterName(view.ch))+
      '";font-family:\'EB Garamond\',Georgia,serif;font-size:8.5pt;color:#8a94a3;'+
      'letter-spacing:.06em}}@page:first{@top-right{content:""}}}';
  })();
  const HEX={must:'var(--ent)',high:'var(--gold)',know:'var(--ink-4)'};

  /* .doc-head is the PRINTED COVER and nothing else now — the screen hides it
     while the reader is on, because the running head already names the chapter
     and the title was being set twice. */
  let h=`<div class="doc-head">
    <div class="eyebrow" style="background:${m.hex}">${ico(m.icon,13)} ${m.name}</div>
    <h1>${esc(chapterName(view.ch))}</h1>
    <div class="doc-meta">${secs.length} sections \u00b7 ${secs.filter(s=>s.w==='must').length} must-know \u00b7 ${allQs.length} linked questions</div>
  </div>`;

  /* ⚠️ ONE STRIP OF FURNITURE, ABOVE THE SHEET. The back link and the two
     actions used to sit in two separate bands, one above the reader and one
     below it, and between them they pushed the turn bar off the bottom of the
     window. Side by side they cost one line.
     The opening still goes INSIDE the book as its first page — left above it,
     it had to be scrolled past before the reader was even visible. */
  h+=`<div class="bk-wrap" id="bkWrap">
    <div class="bk-top">
      <button class="tb-btn" onclick="go({name:'theory',mod:'${view.mod}'})">&larr; ${esc(m.name)} notes</button>
      <div class="bk-acts">
        ${allQs.length?`<button class="btn go" onclick="startQuiz(${JSON.stringify(allQs).replace(/"/g,'&quot;')},'${esc(chapterName(view.ch)).replace(/'/g,"\\'")}')">\u25b6 Test the lecture (${allQs.length})</button>`:''}
        <button class="btn sec" onclick="window.print()">${ico('scroll',16)} Save as PDF</button>
      </div>
    </div>
    <div class="bk-stage" id="bkStage">
      <button class="bk-btn" id="bkPrev" onclick="bkTurn(-1)" aria-label="Previous page">${ico('chev-l',18)}</button>
      <div class="bk-sheet" id="bkSheet">
        <div class="bk-run"><span>${esc(chapterName(view.ch))}</span><span class="r" id="bkRun"></span></div>
        <div class="bk-view">
          <div class="bk-tap l" onclick="bkTurn(-1)" title="Previous page"></div>
          <div class="bk-tap r" onclick="bkTurn(1)" title="Next page"></div>
          <div class="bk-flow" id="bkFlow">`;

  h+=`<div class="bk-title">
    <div class="eyebrow" style="background:${m.hex}">${ico(m.icon,13)} ${m.name}</div>
    <h1>${esc(chapterName(view.ch))}</h1>
    <div class="doc-meta">${secs.length} sections \u00b7 ${secs.filter(s=>s.w==='must').length} must-know \u00b7 ${allQs.length} linked questions</div>
  </div>`;

  if(t.intro)h+=`<div class="th-intro bk-first">${mdBlock(t.intro)}</div>`;

  secs.forEach((s,i)=>{
    const c=HEX[s.w||'know'];
    h+=`<section class="th-sec" id="sec-${s.id}" style="--c:${c}">
      <div class="th-h">
        <span class="th-num">${String(i+1).padStart(2,'0')}</span>
        <h2>${esc(s.h)}</h2>
        <span class="wbadge ${s.w||'know'}">${LBL[s.w||'know']}</span>
      </div>
      <div class="th-body">${mdBlock(s.body)}`;
    if(s.table)h+=tableHTML(s.table);
    if(s.flow)h+=flowHTML(s.flow);
    if((s.qs||[]).length){
      h+=`<div class="th-test"><span class="lbl">Test yourself \u2014</span>
        <button class="btn go" onclick="startQuiz(${JSON.stringify(s.qs).replace(/"/g,'&quot;')},'${esc(s.h).replace(/'/g,"\\'")}')">${s.qs.length} question${s.qs.length===1?'':'s'} on this</button></div>`;
    }
    h+=`</div></section>`;
  });

  h+=`</div></div>
        <div class="bk-foot" id="bkNum"></div>
      </div>
      <button class="bk-btn" id="bkNext" onclick="bkTurn(1)" aria-label="Next page">${ico('chev-r',18)}</button>
    </div>
    <div class="bk-prog"><i id="bkProg"></i></div>
  </div>`;

  p.innerHTML=h;
  bkInit(view.sec);
}

/* ---------- book reader ----------
   BK.page is the current column index. Everything else is derived from the
   layout, never stored, so a resize or a font swap cannot leave it stale. */
var BK={page:0,pages:1,step:0,secs:[]};
function bkOn(){return document.body.classList.contains('bk-on')}
function bkInit(jumpTo){
  const wrap=document.getElementById('bkWrap');
  if(!wrap)return;
  document.body.classList.add('bk-on');
  BK.page=0;
  bkMeasure();
  if(jumpTo)bkToSec(jumpTo);
  else bkPaint();
  /* ⚠️ MEASURE AGAIN ONCE LAYOUT HAS SETTLED. The first pass runs in the same
     tick as the render, and anything that changes height afterwards — a font
     finishing, an image arriving — repaginates the columns while BK.pages still
     describes the old layout. The symptom is silent and ugly: the final pages
     turn up BLANK, because the transform walks past where the content now ends.
     Two rAFs cover same-frame layout; fonts.ready covers the slow case. */
  const settle=()=>{
    if(!bkOn())return;
    let anchor='';BK.secs.forEach(s=>{if(s.page<=BK.page)anchor=s.id});
    const was=BK.pages;
    bkMeasure();
    if(BK.pages!==was&&anchor)bkToSec(anchor);else bkPaint();
  };
  requestAnimationFrame(()=>requestAnimationFrame(settle));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(settle).catch(()=>{});
}
function bkMeasure(){
  const flow=document.getElementById('bkFlow'),view=flow&&flow.parentElement;
  if(!flow)return;
  /* ⚠️ THE PAGE IS SIZED FIRST, AND EVERYTHING ELSE IS MEASURED OUT OF IT. The
     sheet is A4 by aspect-ratio, so only its HEIGHT is chosen here; the width
     follows, and the type block is then whatever the flex column leaves between
     the running head and the folio. Reading the type block back out of the DOM
     rather than computing it is what keeps the two in step when a font or a
     hairline changes.
     ⚠️ RESERVE WHAT THE FURNITURE ACTUALLY MEASURES, never a constant. The old
     reserve was the constant 118, measured once against a layout that has since
     changed three times; too small a reserve is what put the turn controls below
     the fold. */
  const wrap=document.getElementById('bkWrap');
  const stage=document.getElementById('bkStage'),sheet=document.getElementById('bkSheet');
  if(stage&&sheet){
    const host=wrap.parentElement;
    let tail=parseFloat(getComputedStyle(host).paddingBottom)||0;
    const pr=wrap.querySelector('.bk-prog');
    if(pr){const cs=getComputedStyle(pr);
      tail+=pr.offsetHeight+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0);}
    let sh=Math.round(window.innerHeight-stage.getBoundingClientRect().top-tail-6);
    /* ⚠️ AND THE WIDTH CAN BE THE BINDING CONSTRAINT, not the height — a short
       wide window, or a phone where the arrows sit beside the page. A4 is taller
       than it is wide, so a sheet sized only by height silently overflows the
       stage and the arrows fall off the side. */
    const btns=[].slice.call(stage.querySelectorAll(':scope > .bk-btn'));
    const arrows=btns.reduce((acc,b)=>acc+b.offsetWidth,0);
    const sgap=parseFloat(getComputedStyle(stage).columnGap)||16;
    /* ⚠️ ASK THE LAYOUT WHERE THE ARROWS ARE — do not assume. Below 700px they
       wrap onto their own line under the page, where they cost HEIGHT and no
       width at all; charging the row for them there squeezed the sheet to a
       square. flex-wrap is the media query's own signal, so the two cannot drift
       apart the way a duplicated breakpoint in JS would. */
    const wrapped=getComputedStyle(stage).flexWrap==='wrap';
    const availW=stage.clientWidth-(wrapped?0:arrows+sgap*2)-2;
    if(wrapped&&btns.length)sh-=btns[0].offsetHeight+sgap;
    /* ⚠️ THE ORDER MATTERS. Math.max(floor, Math.min(sh, byWidth)) lets the
       floor beat the width clamp, and the page then overflows the stage and
       pushes an arrow off the side — seen at 435x311, where a 420px floor asked
       for a 297px width the row could not give. The floor is applied FIRST and
       the width clamp last, so the narrow case degrades by shrinking rather
       than by breaking. */
    sh=Math.min(Math.max(340,sh),Math.floor(availW*297/210));
    sheet.style.setProperty('--bk-sheet-h',sh+'px');
    /* The paper margins are a fraction of the PAGE's width — see the note on
       .bk-sheet for why they cannot be percentages in CSS. */
    const sw=sh*210/297;
    sheet.style.setProperty('--bk-pad-x',Math.round(sw*0.068)+'px');
    sheet.style.setProperty('--bk-pad-t',Math.round(sw*0.058)+'px');
    sheet.style.setProperty('--bk-pad-b',Math.round(sw*0.034)+'px');
    /* The progress rule under the page is set to the page's width, not the
       stage's, so it reads as part of the sheet rather than of the window. */
    wrap.style.setProperty('--bk-sheet-w',Math.round(sw)+'px');
  }
  const gap=parseFloat(getComputedStyle(flow).columnGap)||54;
  const h=Math.max(180,view.clientHeight);
  flow.style.setProperty('--bk-h',h+'px');
  const w=view.clientWidth;
  flow.style.columnWidth=w+'px';
  BK.step=w+gap;
  /* ⚠️ Decide per element whether it may be kept whole, by MEASURING it against
     the page height. A table or flowchart that fits gets `th-keep` and is never
     split; one that is taller than the page must be allowed to break, because
     break-inside:avoid on an over-tall block clips it — and a clipped table is
     content the learner never sees, with nothing on screen to say so.
     Measured with the class off, so a previous pass cannot bias the reading.
     ⚠️⚠️ A LIST IS NOT A TABLE, AND TREATING THEM ALIKE IS WHAT EMPTIED THE
     BOTTOM OF PAGES. A table broken across a page turn loses its column labels,
     so it is worth a gap; a list broken across a turn loses nothing at all, and
     keeping a twelve-item list whole strands the heading above it at the foot of
     the page with a third of the sheet blank under it — measured on op-glauc
     page 1, 140px of nothing. Lists and quotes are now held together only while
     they are SHORT enough that doing so cannot cost much: 45 % of the page. Past
     that they break, and the page fills.
     ⚠️ The two limits are different numbers on purpose. Do not collapse them. */
  const keepIf=(sel,limit)=>[].slice.call(flow.querySelectorAll(sel)).forEach(el=>{
    el.classList.remove('th-keep');
    if(el.getBoundingClientRect().height<=limit)el.classList.add('th-keep');
  });
  /* ⚠️ "IT FITS" IS THE WRONG TEST FOR A BIG BLOCK. A table 90 % of the page
     tall fits, so it was kept whole, so it jumped — and left 90 % of a sheet
     blank with only a heading on it. MEASURED before this line existed: op-lid
     and op-ret each carried a page filled to 3 %. What a table loses by breaking
     is its column labels, and .th-table thead is a table-header-group in the
     reader now, so the continuation column repeats them and it loses nothing.
     Past 60 % of the page a table or a flowchart therefore breaks. */
  keepIf('.th-table,.flow',h*0.6);
  keepIf('.th-body blockquote,.th-body ul',h*0.45);
  /* ⚠️ WHERE DOES THE CONTENT ACTUALLY STOP? Two obvious answers are both
     wrong and both give a BLANK FINAL PAGE, which only a screenshot reveals:
       - scrollWidth: the arithmetic is exact (N columns span N*w + (N-1)*gap)
         but the browser keeps a trailing empty column once content ends near a
         boundary, so it counts one too many;
       - the greatest offsetLeft in the flow: inside a multi-column container
         Chrome does not reliably report the FRAGMENTED position, so this
         returned the same inflated number.
     A Range over the flow's contents does report one rect per column fragment,
     so the right-most rect is the last column holding anything. Measured with
     the transform off, or every rect is displaced by the current page. */
  const prevT=flow.style.transform;
  flow.style.transform='none';
  const fr=flow.getBoundingClientRect();
  let maxL=0;
  const note=r=>{const rel=r.left-fr.left;if(r.width>0&&r.height>0&&rel>maxL)maxL=rel;};
  /* ⚠️ ONLY REAL TEXT COUNTS. A range over the whole flow also returns a rect
     for a section's BOX fragment — its border-left and padding spill into the
     next column carrying no words — which is what kept manufacturing a blank
     last page. Walk the text nodes instead and ignore whitespace-only ones. */
  const tw=document.createTreeWalker(flow,NodeFilter.SHOW_TEXT,{
    acceptNode:n=>n.nodeValue&&n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT
  });
  const rg=document.createRange();
  let n;
  while((n=tw.nextNode())){
    rg.selectNodeContents(n);
    const rs=rg.getClientRects();
    for(let i=0;i<rs.length;i++)note(rs[i]);
  }
  [].slice.call(flow.querySelectorAll('img')).forEach(im=>note(im.getBoundingClientRect()));
  flow.style.transform=prevT;
  BK.pages=Math.max(1,Math.round(maxL/BK.step)+1);
  BK.secs=[].slice.call(flow.querySelectorAll('.th-sec')).map(el=>({
    id:el.id.replace(/^sec-/,''),
    h:(el.querySelector('h2')||{}).textContent||'',
    page:Math.max(0,Math.round(el.offsetLeft/BK.step))
  }));
  if(BK.page>BK.pages-1)BK.page=BK.pages-1;
}
function bkPaint(){
  const flow=document.getElementById('bkFlow');
  if(!flow)return;
  flow.style.transform='translateX('+(-BK.page*BK.step)+'px)';
  const n=document.getElementById('bkNum');
  if(n)n.textContent='Page '+(BK.page+1)+' of '+BK.pages;
  const pr=document.getElementById('bkProg');
  if(pr)pr.style.width=(BK.pages<2?100:(BK.page/(BK.pages-1))*100)+'%';
  const pv=document.getElementById('bkPrev'),nx=document.getElementById('bkNext');
  if(pv)pv.disabled=BK.page<=0;
  if(nx)nx.disabled=BK.page>=BK.pages-1;
  /* Running head: the last section that has started on or before this page. */
  const run=document.getElementById('bkRun');
  if(run){
    let cur='';
    BK.secs.forEach(s=>{if(s.page<=BK.page)cur=s.h});
    run.textContent=cur;
  }
}
function bkTurn(d){
  if(!bkOn())return;
  const p=BK.page+d;
  if(p<0||p>BK.pages-1)return;
  BK.page=p;bkPaint();
}
function bkToSec(id){
  const s=BK.secs.filter(x=>x.id===id)[0];
  BK.page=s?s.page:0;
  bkPaint();
}
function openTheoryFor(qid){
  if(THEORY_LOCKED)return;
  const t=qTheory(qid);
  if(!t)return;
  const q=QUESTIONS.find(x=>x.id===qid);
  go({name:'theory',mod:q?q.module:'pediatrics',ch:t.ch,sec:t.sec});
}

/* ============ CLOUD SYNC ============ */
const SDK=['https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
           'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',
           'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'];
let fbApp=null, fbUser=null, syncState='off', pushTimer=null, sdkLoading=null;
let cloudSession=null, cloudAuth=0;

function cloudConfig(){
  if(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey)return FIREBASE_CONFIG;
  try{
    const c=JSON.parse(localStorage.getItem('wardround.fbconfig')||'null');
    if(c&&c.apiKey)return c;
  }catch(e){}
  return null;
}
function cloudEnabled(){return location.protocol!=='file:'&&!!cloudConfig()}

function loadSDK(){
  if(window.firebase)return Promise.resolve(true);
  if(sdkLoading)return sdkLoading;
  sdkLoading=new Promise(res=>{
    let settled=false;
    const done=v=>{if(!settled){settled=true;res(v)}};
    /* never let a slow or blocked CDN strand the user on the splash */
    setTimeout(()=>done(!!window.firebase),8000);
    let i=0;
    const next=()=>{
      if(settled)return;
      if(i>=SDK.length)return done(!!window.firebase);
      const s=document.createElement('script');
      s.src=SDK[i++];
      s.onload=next;
      s.onerror=()=>done(false);
      document.head.appendChild(s);
    };
    next();
  });
  return sdkLoading;
}
async function initCloud(){
  if(!cloudEnabled())return false;
  const cfg=cloudConfig();
  if(!cfg)return false;
  const ok=await loadSDK();
  if(!ok)return false;
  try{
    if(!fbApp)fbApp=firebase.initializeApp(cfg);
  }catch(e){
    if(firebase.apps&&firebase.apps.length)fbApp=firebase.apps[0];
    else return false;
  }
  /* keep the session across browser restarts */
  try{await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){}
  return true;
}
function isStandalone(){
  return (window.navigator&&window.navigator.standalone===true)||
         (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
}
let lastSyncAt=0;
const syncClock=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function setSync(s){
  if(s==='idle')lastSyncAt=Date.now();
  if(s==='off')lastSyncAt=0;
  syncState=s;const el=$('railSync');if(el&&me)drawRailSync();
}
function drawRailSync(){
  const el=$('railSync');
  if(!el)return;
  if(!fbUser){el.innerHTML='';el.style.display='none';return}
  el.style.display='flex';
  /* "Synced" alone is a claim with no time on it, and a push that quietly
     stopped an hour ago looks identical to one that finished a second ago.
     Say when. */
  const when=lastSyncAt?' '+syncClock(lastSyncAt):'';
  const label={idle:'Synced'+when,busy:'Syncing\u2026',err:'Sync failed \u2014 retry on next change',off:'Offline'}[syncState]||'Synced'+when;
  const cls={idle:'ok',busy:'busy',err:'err',off:''}[syncState]||'ok';
  el.innerHTML=`<span class="syncdot ${cls}"></span>${label}`;
}

async function signInGoogle(){
  const ok=await initCloud();
  if(!ok){toast('Sync is not available right now');return}
  const prov=new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  /* popups are unreliable inside the iOS home-screen app \u2014 use a redirect there */
  if(isStandalone()){
    try{await firebase.auth().signInWithRedirect(prov)}
    catch(e){toast('Sign-in failed: '+(e&&e.code||e))}
    return;
  }
  try{
    const res=await firebase.auth().signInWithPopup(prov);
    await afterSignIn(res.user);
  }catch(e){
    const m=String(e&&e.code||e);
    if(/popup-closed|cancelled/i.test(m))return;
    if(/unauthorized-domain/i.test(m)){toast('This address is not authorised in Firebase');return}
    if(/popup-blocked/i.test(m)){
      try{await firebase.auth().signInWithRedirect(prov)}catch(e2){toast('Sign-in blocked by the browser')}
      return;
    }
    toast('Sign-in failed: '+m);
  }
}
async function afterSignIn(u){
  resetCloud();cloudAuth++;
  fbUser=u;
  const auth=cloudAuth;
  const local=new Map(profiles.map(p=>[p.id,JSON.stringify(rosterProfile(p))]));
  /* Signing in while studying keeps the local profile and merges its work.
     The picker stays usable while another device's roster is arriving. */
  if(me)pullCloud();else showGate('profiles');
  try{
    const ref=rosterRef();
    if(!ref)return;
    const snap=await cloudWait(ref.get());
    if(auth!==cloudAuth||!fbUser||fbUser.uid!==u.uid)return;
    rosterList(snap.exists?snap.data():{}).forEach(p=>{
      const old=profiles.find(x=>x.id===p.id);
      if(!old){if(!local.has(p.id))profiles.push(Object.assign({pin:''},p))}
      else if(local.get(p.id)===JSON.stringify(rosterProfile(old)))Object.assign(old,p);
    });
    saveProfiles();
    if(!me&&!draft){
      showGate('profiles');
      if(!profiles.length){
        draft={id:'g:'+u.uid,name:(u.displayName||'Me').split(' ')[0],
               /* No Google picture, so the account is given a portrait rather
                  than one house default: avKey hashes whatever it is handed, so
                  two colleagues signing in on the same laptop are not twins. */
               av:u.photoURL?{t:'p',v:u.photoURL,c:'#6d4c7d'}
                            :{t:'g',v:avKey({v:u.uid||u.email||''}),c:'#6d4c7d'},pin:''};
        drawProfileEditor(false);
      }
    }
  }catch(e){if(auth===cloudAuth)setSync('err')}
}
async function signOutCloud(){
  resetCloud();cloudAuth++;
  fbUser=null;setSync('off');
  me=null;closeModal();showGate();
  try{if(window.firebase&&firebase.auth)await cloudWait(firebase.auth().signOut())}catch(e){}
  toast('Signed out \u2014 your progress stays on this device');
}

function cloudWait(work){
  let timer;
  return Promise.race([work,new Promise((_,reject)=>{
    timer=setTimeout(()=>reject(new Error('Sync timed out')),8000);
  })]).finally(()=>clearTimeout(timer));
}
function resetCloud(){
  clearTimeout(pushTimer);pushTimer=null;cloudSession=null;
}
function currentCloud(c){
  return !!(c&&c===cloudSession&&fbUser&&me&&c.auth===cloudAuth&&
            c.uid===fbUser.uid&&c.pid===me.id);
}
function rosterRef(uid=fbUser&&fbUser.uid){
  if(!uid||!cloudEnabled()||!window.firebase||!firebase.firestore)return null;
  try{return firebase.firestore().collection('users').doc(uid)}catch(e){return null}
}
function docRef(){
  if(!me||!fbUser)return null;
  const ref=rosterRef();
  return ref?ref.collection('profiles').doc(me.id):null;
}
function rosterProfile(p){
  const av=p.av||{};
  return {id:p.id,name:p.name||'Untitled',av:{t:av.t||'e',v:av.v||'',c:av.c||'#6d4c7d'}};
}
function rosterList(data,p,remove=false){
  const list=(Array.isArray(data.profiles)?data.profiles:[])
    .filter(x=>x&&typeof x.id==='string'&&x.id&&(!p||x.id!==p.id)).map(rosterProfile);
  if(p&&!remove)list.push(rosterProfile(p));
  return list;
}
async function syncRoster(p,remove=false){
  const ref=rosterRef(),auth=cloudAuth;
  if(!ref)return;
  const entry=rosterProfile(p);
  let live=true;
  try{
    await cloudWait(firebase.firestore().runTransaction(async tx=>{
      const snap=await tx.get(ref);
      if(!live||auth!==cloudAuth||!fbUser)return;
      /* Keep a legacy state until profile entry can adopt it atomically. */
      tx.set(ref,{profiles:rosterList(snap.exists?snap.data():{},entry,remove)},{merge:true});
      if(remove)tx.delete(ref.collection('profiles').doc(entry.id));
    }));
  }catch(e){if(auth===cloudAuth)setSync('err')}
  finally{live=false}
}
function mergeStates(a,b){
  const at=a.updatedAt||0, bt=b.updatedAt||0;
  const newer=at>=bt?a:b, older=at>=bt?b:a;
  const out=JSON.parse(JSON.stringify(newer));
  /* Answering on another device advances updatedAt without changing the
     student's semester. Only an explicit selection advances this clock.
     Equal clocks use the same tie-break in either merge direction. */
  const termA=termChoice(a.term), termB=termChoice(b.term);
  const chosenTerm=!termA?termB:!termB?termA:
    (termA.at>termB.at||(termA.at===termB.at&&termA.id>=termB.id)?termA:termB);
  if(chosenTerm)out.term=chosenTerm; else delete out.term;
  out.answers={};
  const ids=new Set(Object.keys(a.answers||{}).concat(Object.keys(b.answers||{})));
  ids.forEach(id=>{
    const x=(a.answers||{})[id], y=(b.answers||{})[id];
    if(!x){out.answers[id]=y;return}
    if(!y){out.answers[id]=x;return}
    out.answers[id]=((x.at||0)>=(y.at||0))?x:y;
  });
  ['srs','hl','flags','conf','days','sched'].forEach(k=>{
    out[k]=Object.assign({},older[k]||{},newer[k]||{});
  });
  /* Each chapter has its own clock: practising another chapter on a second
     device must not discard a more recent place in this one. */
  out.resumeByChapter={};
  const chapters=new Set(Object.keys(a.resumeByChapter||{}).concat(Object.keys(b.resumeByChapter||{})));
  chapters.forEach(cid=>{
    const x=(a.resumeByChapter||{})[cid], y=(b.resumeByChapter||{})[cid];
    out.resumeByChapter[cid]=!x?y:!y?x:((x.at||0)>=(y.at||0)?x:y);
  });
  /* A note and a report are written per question and stamped, so they merge the
     way answers do. Object.assign would let the whole of an older device's notes
     lose to the whole of a newer one's, which is how a note gets typed on a phone
     and vanishes on a laptop. */
  ['notes','reports'].forEach(k=>{
    out[k]={};
    const keys=new Set(Object.keys(a[k]||{}).concat(Object.keys(b[k]||{})));
    keys.forEach(id=>{
      const x=(a[k]||{})[id], y=(b[k]||{})[id];
      out[k][id]=!x?y:!y?x:((x.at||0)>=(y.at||0)?x:y);
    });
  });
  out.schedule=newer.schedule||older.schedule||null;
  /* A paper travels as one record. Combining picks from different sittings would
     invent a paper; a dated empty record also prevents an older copy returning. */
  const x=a.mockResume, y=b.mockResume;
  out.mockResume=!x?(y||null):!y?x:
    x.at!==y.at?(x.at>y.at?x:y):
    x.paper===null?x:y.paper===null?y:
    (JSON.stringify(x)>=JSON.stringify(y)?x:y);
  out.updatedAt=Math.max(at,bt);
  return out;
}
async function pullCloud(){
  const ref=docRef();
  if(!ref)return;
  if(!currentCloud(cloudSession))cloudSession={uid:fbUser.uid,pid:me.id,auth:cloudAuth,
    ref:ref,key:KEY,mode:storageMode,running:false,again:false};
  await pushCloud(cloudSession);
}
function schedulePush(){
  const c=cloudSession;
  if(!currentCloud(c))return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{if(currentCloud(c))pushCloud(c)},1200);
}
async function pushCloud(c=cloudSession){
  if(!currentCloud(c))return;
  if(c.running){c.again=true;return}
  c.running=true;c.again=false;
  let live=true;
  setSync('busy');
  try{
    const local=JSON.parse(JSON.stringify(S)),entry=rosterProfile(me),root=rosterRef(c.uid);
    /* mergeStates rebuilds answers and resumeByChapter key by key, so its output
       does not compare byte-for-byte against its input even when nothing moved.
       Merging local with itself gives the same normal form, which is what makes
       the comparison below mean "another device changed something" rather than
       "the keys came back in a different order". */
    const before=JSON.stringify(mergeStates(local,local));
    const merged=await cloudWait(firebase.firestore().runTransaction(async tx=>{
      const roster=await tx.get(root),snap=await tx.get(c.ref);
      if(!live||!currentCloud(c))return null;
      const data=roster.exists?roster.data():{};
      let out=local;
      if(snap.exists&&snap.data().state)out=mergeStates(out,JSON.parse(snap.data().state));
      /* Removing the old field and adopting its contents in the same commit
         makes retries and simultaneous first sign-ins adopt it only once. */
      if(Object.prototype.hasOwnProperty.call(data,'state'))out=mergeStates(out,JSON.parse(data.state));
      tx.set(c.ref,{state:JSON.stringify(out),updatedAt:Date.now()});
      const list=rosterList(data);
      if(!list.some(p=>p.id===entry.id))list.push(entry);
      tx.set(root,{profiles:list});
      return out;
    }));
    if(!merged||!currentCloud(c))return;
    /* Include edits made during the request without scheduling an endless
       save/push loop. Their existing debounce sends them on the next pass. */
    S=mergeStates(S,merged);
    if(!S.hl)S.hl={};
    /* Apply a remote semester before another input can use the old quiz.
       Profile entry draws its own screen after loading has finished. */
    const termChanged=!termEntryPending&&termChoice(S.term)&&S.term.id!==activeTerm;
    if(termChanged)render();
    const raw=JSON.stringify(S);
    try{
      if(c.mode==='cloud'&&window.storage&&window.storage.set)await cloudWait(window.storage.set(c.key,raw));
      else if(c.mode==='local')localStorage.setItem(c.key,raw);
    }catch(e){warnSaveFailure()}
    if(!currentCloud(c))return;
    bakSchedule();
    /* A push runs 1.2 s after every answer. Repainting unconditionally would
       rebuild the page under the student mid-question — losing the caret in a
       case's answer box — for a merge that changed nothing, which is what a
       merge changes on a single device. Repaint only when a second device
       actually sent something back. */
    if(!termEntryPending&&!termChanged&&JSON.stringify(merged)!==before)render();
    setSync('idle');
  }catch(e){if(currentCloud(c))setSync('err')}
  finally{
    live=false;c.running=false;
    if(currentCloud(c)&&c.again)schedulePush();
  }
}

/* restore an existing session on load */
async function restoreSession(){
  if(!cloudEnabled())return false;
  const ok=await initCloud();
  if(!ok)return false;
  /* if we came back from a redirect sign-in, pick that up first */
  try{
    const r=await firebase.auth().getRedirectResult();
    if(r&&r.user){await afterSignIn(r.user);return true}
  }catch(e){}
  return new Promise(res=>{
    let done=false;
    const un=firebase.auth().onAuthStateChanged(async u=>{
      if(done)return;
      done=true;un();
      if(!u){res(false);return}
      await afterSignIn(u);
      res(true);
    });
    setTimeout(()=>{if(!done){done=true;try{un()}catch(e){}res(false)}},12000);
  });
}

const PKEY='wardround.profiles', LASTKEY='wardround.lastprofile';

/* THE EIGHT PORTRAITS. These were emoji first, then line emblems, and both
   failed the same way: an amphora and a lamp are objects, and nobody is an
   object. A profile picture is meant to be somebody, so these are people —
   the physicians and the healing gods this app is named out of, painted in
   the same low-key oil manner as the rest of the artwork so a profile sits
   inside the design instead of on top of it.

   Four men and four women, in that order, and each one carries a readable
   attribute because the picture is seen at 32px in the rail far more often
   than at 96px on a gate card: a stylus, a bald dome and a white beard, a
   scalpel, a serpent staff, an astrolabe, a serpent and bowl, a flask, a
   bronze helmet. Colour separates them before the face does.

   Eight, not twenty-four, because a wall of choices is not generosity: it is
   a picker to get through. */
const AVATARS=['herophilus','hippocrates','erasistratus','asclepius',
               'hypatia','hygieia','panacea','athena'];
const AVSET=new Set(AVATARS);
/* The file, not a data URI: eight portraits inlined would put a quarter of a
   megabyte of base64 in front of the first paint. Relative, so the app still
   opens from file:// with no server. */
function avSrc(k){return 'assets/av/'+k+'.jpg'}
/* Who each one is, for the picker's tooltip and the image's alt text. A face
   with no name is a decoration; with a name it is a choice. */
const AVNAMES={
  herophilus:'Herophilus of Alexandria',
  hippocrates:'Hippocrates of Kos',
  erasistratus:'Erasistratus of Ceos',
  asclepius:'Asclepius, god of medicine',
  hypatia:'Hypatia of Alexandria',
  hygieia:'Hygieia, goddess of health',
  panacea:'Panacea, goddess of remedies',
  athena:'Athena, goddess of wisdom'
};

/* A profile saved before this list existed holds an emoji, or an emblem key
   from the set before it, and those profiles are not rewritten — a stored
   record is not touched to suit a redesign, and a photo profile must keep its
   photo. So whatever is stored is resolved at DRAWING time, by hashing it into
   the current list. Deterministic, so a profile wears the same face on every
   device and every reload; and the moment it is next saved from the editor it
   writes a real key and stops hashing.

   Reordering or replacing AVATARS therefore changes which face those older
   profiles wear. That is accepted: it is cosmetic, it corrects itself on the
   next save, and the alternative is never being able to change the list. */
function avKey(av){
  if(!av)return AVATARS[0];
  if(av.t==='g'&&AVSET.has(av.v))return av.v;
  const s=String(av.v||'');
  if(!s)return AVATARS[0];
  let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(h,31)+s.charCodeAt(i))>>>0;
  return AVATARS[h%AVATARS.length];
}
const AVCOLS=['#b4472f','#5c7a52','#6d4c7d','#2e5f8a','#9a6b1f','#8f3f5c','#3f7d7a','#7a6a55'];

function stateKey(id){return 'wardround.v3.'+id}
function loadProfiles(){
  try{profiles=JSON.parse(localStorage.getItem(PKEY))||[]}catch(e){profiles=[]}
}
function saveProfiles(){try{localStorage.setItem(PKEY,JSON.stringify(profiles))}catch(e){}}
function bootstrapProfiles(){

  try{old=localStorage.getItem('wardround.v2')}catch(e){}
  if(old){

    profiles.push(p);saveProfiles();
    try{localStorage.setItem(stateKey(p.id),old)}catch(e){}
  }
}
/* One place draws an avatar, and every surface that shows one goes through it:
   the gate cards, the editor's preview, the rail. A portrait and an uploaded
   photo are now the same shape — an <img> filling the box — so both branches
   emit the same markup and the existing object-fit:cover rules size them.

   av.c survives as the ring rather than the backdrop. An opaque portrait hides
   whatever is painted behind it, and a colour picker that changes nothing is a
   dead control; on the border it still tells two profiles apart at a glance.
   class="${cls}" stays the first attribute — manageProfiles() rewrites it. */
function avHTML(av,cls){
  av=av||{t:'g',v:AVATARS[0],c:'#6d4c7d'};
  const src=av.t==='p'?av.v:avSrc(avKey(av));
  return `<div class="${cls}" style="background:${av.c};border-color:${av.c}"><img src="${src}" alt=""></div>`;
}

  }

    <div class="pgrid">`;
  profiles.forEach(p=>{
    /* The card cannot call avHTML: it hangs a PIN dot and a Google badge inside
       the same box. So it builds its own wrapper and borrows the resolver, which
       is the part that must not drift — a profile showing one emblem here and a
       different one in the rail is the bug this line exists to prevent. */
    const av=p.av||{t:'g',v:AVATARS[0],c:'#6d4c7d'};

      <div class="pname">${esc(p.name)}</div></button>`;
  });
  h+=`<button class="pcard add" style="${step()}" onclick="editProfile(null)">
      <div class="pav">+</div><div class="pname">Add profile</div></button></div>`;
  h+=`<div class="gfoot" style="${step()}">`;
  if(canBack)h+=`<button class="btn sec" onclick="showGate('signin')">← Back</button>`;
  if(profiles.length)h+=`<button class="btn sec" onclick="manageProfiles()">Manage profiles</button>`;
  h+=`</div>`;
  /* cloudEnabled() is false whenever the app is opened as a file rather than
     from an address, which is the ordinary way a student ends up with a copy
     on a laptop. This used to offer them a "Set up sync" button, and behind it
     instructions for creating a Firebase project — a developer's door left in
     the front of the building. What they actually need is the plain fact: this
     copy keeps their work, and it keeps it here. syncSetup() still exists and
     is still callable by name for a rebuild of the file; it is simply not
     something to hand a reader. */
  if(!cloudEnabled())h+=`<p class="goffline" style="${step()}">Running from a file, so this copy is yours alone &mdash; your progress is saved on this device and does not travel. Open the app at its web address to sign in and carry it between devices.</p>`;
  h+=`</div>`;
  return h;
}

/* ---- one-time colour migration, 2026-07-28 --------------------------------
   The Greek palette replaced every module colour, but two things had already
   BAKED the old hex values into localStorage and so could never pick the change
   up from CSS:

     • a schedule the user has edited — buildSchedule() stores {label,text,hex}
       per item, so an edited plan keeps rendering vermilion tags forever
     • profile avatars — the colour is chosen once and saved on the profile

   Found by auditing the running app, not by reading the code: the contrast pass
   kept reporting rgb(255,90,95) on the schedule long after that hex was gone
   from the source. Anything that stores a colour rather than a token needs a
   migration; that is the general lesson.

   Keyed on the old values, so it is idempotent — a second run matches nothing. */
const COLOUR_MIGRATION={
  '#ff5a5f':'#b4472f','#00b37e':'#5c7a52','#8b5cf6':'#6d4c7d','#3b82f6':'#2e5f8a',
  '#f59e0b':'#9a6b1f','#ec4899':'#8f3f5c','#6a6390':'#7a6a55','#0e7490':'#2f6b8f',
  '#14b8a6':'#3f7d7a','#ffc94a':'#d9b44a'
};
function migrateColours(){
  const map=h=>COLOUR_MIGRATION[String(h||'').toLowerCase()];
  let stateChanged=false,profilesChanged=false;
  if(S.schedule&&S.schedule.length){
    S.schedule.forEach(d=>{
      (d.items||[]).forEach(it=>{const n=map(it.hex);if(n){it.hex=n;stateChanged=true}});
    });
  }
  profiles.forEach(p=>{
    if(p.av&&p.av.c){const n=map(p.av.c);if(n){p.av.c=n;profilesChanged=true}}
  });
  if(stateChanged)save();
  if(profilesChanged)saveProfiles();
}

async function enterProfile(p){
  flushNote();
  resetCloud();
  const entry=++profileLoad;
  termEntryPending=true;
  termLoading=true;
  activateTerm(null,true);
  me=p;
  KEY=stateKey(p.id);
  try{localStorage.setItem(LASTKEY,p.id)}catch(e){}
  S={answers:{},flags:{},conf:{},sched:{},srs:{},days:{},hl:{},banks:{},resumeByChapter:{},notes:{},reports:{},schedule:null};
  showGate('profiles');
  await loadState();
  if(entry!==profileLoad||me!==p)return;
  /* A new device may already have this preference in the cloud. Try that
     before asking for another selection; offline entry still reaches the picker. */
  if(fbUser&&!termChoice(S.term)){
    await pullCloud();
    if(entry!==profileLoad||me!==p)return;
  }
  termLoading=false;
  if(!termChoice(S.term)){showGate('profiles');return}
  finishProfileEntry();
}
function finishProfileEntry(){
  termEntryPending=false;
  termLoading=false;
  activateTerm(S.term.id,true);
  sanitiseBanks();
  migrateColours();
  closeModal();hideGate();
  view={name:'home'};
  /* The companion belongs to a profile session, not to the gate — she appears
     once someone is actually studying. A session left running is picked back
     up here rather than restarted, because its clock is a timestamp. */

     ${[0,1,2,3].map(i=>`<input class="pind" id="pd${i}" inputmode="numeric" maxlength="1"

   </div>

     <button class="btn sec" onclick="closeModal();showGate()">Back</button>

function pinHop(i){
  const el=$('pd'+i);
  if(el&&el.value&&i<3){const n=$('pd'+(i+1));if(n&&n.focus)n.focus()}
}
function pinBack(e,i){
  if(e.key==='Backspace'&&!$('pd'+i).value&&i>0){const pv=$('pd'+(i-1));if(pv&&pv.focus)pv.focus()}
  if(e.key==='Enter'){const b=document.querySelector('.modal .btn.go');if(b)b.click()}
}
function readPin(){return [0,1,2,3].map(i=>($('pd'+i)||{}).value||'').join('')}
function tryPin(id){
  const p=profiles.find(x=>x.id===id);
  if(!p)return;
  if(readPin()===p.pin){enterProfile(p);return}
  const e=$('pinErr');if(e)e.textContent='Wrong PIN \u2014 try again';
  [0,1,2,3].forEach(i=>{const el=$('pd'+i);if(el)el.value=''});
  const f=$('pd0');if(f&&f.focus)f.focus();
}

function pfUpload(e,isEdit){
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'),SZ=160;
      c.width=SZ;c.height=SZ;
      const x=c.getContext('2d');
      const s=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,SZ,SZ);
      draft.av={t:'p',v:c.toDataURL('image/jpeg',0.8),c:draft.av.c};
      drawProfileEditor(isEdit);
    };
    img.onerror=()=>toast('Could not read that image');
    img.src=r.result;
  };
  r.readAsDataURL(f);
  e.target.value='';
}

let view={name:'home'};
/* The backstop for the one route that outlives a lock: a student who bookmarked
   a note, or whose last view was restored from a session on another device. */
function go(v){
  if(!v)v={name:'home'};
  if(v.name==='theory'&&THEORY_LOCKED)v={name:'home'};

       (!THEORY[v.ch]||!m.groups.some(g=>g.chapters.some(c=>c[0]===v.ch))))){
      v={name:'home'};
    }
  }

/* Screens where the learner READS for minutes at a time. The cinematic layer
   pauses the ambient orbs on these, so nothing drifts beside a clinical stem.
   Everything else is a browse screen and stays alive. */
const STILL_VIEWS=['quiz','mock','review','theory'];

/* The ambient film obeys the same gate as the orbs, but CSS can only fade it —
   a paused <video> is the difference between a still picture and a decoder
   running behind a clinical stem, which costs battery and, on a slow machine,
   frames the reader can feel. So the opacity is CSS and the pause is here.

   Reduced motion is checked live rather than cached: the CSS already hides the
   film, and pausing as well means a viewer who flips the OS setting mid-session
   is not left with an invisible video still decoding. Every failure path is
   silent — play() rejects whenever autoplay is blocked, and that is a
   perfectly acceptable outcome that must never surface as an error. */
function setFilm(f,on){
  if(!f) return;
  if(!on){ f.pause(); return }
  const p=f.play();
  if(p&&p.catch) p.catch(()=>{});
}
function syncFilm(){
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  setFilm(document.querySelector('.ambient .film'),
          !reduce && !STILL_VIEWS.includes(view.name));
  /* The gate's copy. A hidden <video> keeps decoding — display:none does not
     stop it — so it has to be paused explicitly the moment the gate closes,
     or it runs for the whole session behind a screen nobody is looking at. */
  const g=$('gate');
  setFilm(document.querySelector('.gate-amb .film'),
          !reduce && !!g && !g.classList.contains('hide'));
}

function render(){
  /* Imports, snapshots and cloud merges can replace S without entering a
     profile again. Reconcile here before any page reads its question pool. */
  if(me){
    const choice=termChoice(S.term);
    if(!choice){
      termEntryPending=true;
      activateTerm(null);
      showGate('profiles');
      return;
    }
    if(termEntryPending)return;
    if(activateTerm(choice.id))toast('Semester updated to '+termName()+'. Saved progress is kept.');
  }
  renderNav();
  const p=$('page');
  // Drives body[data-view] in CSS — the alive-to-browse / calm-to-read gate.
  document.body.dataset.view=view.name||'home';
  /* ⚠️ Drop the reader before EVERY render. bk-on is set by bkInit() on the way
     into a chapter; left on, its overflow:hidden and fixed column height apply
     to whatever view comes next and clip it. Clearing here means only the
     chapter view can ever turn it back on. */
  document.body.classList.remove('bk-on');
  syncFilm();
  const emptyCourse=activeModules().length===0&&
    ['home','module','quiz','review','theory','flagged','mock','weak'].indexOf(view.name)>=0;
  if(emptyCourse)vEmptyTerm(p);
  else ({home:vHome,module:vModule,quiz:vQuiz,review:vReview,schedule:vSchedule,theory:vTheory,
    moved:vMoved,flagged:vFlagged,mock:vMock,session:vSession,weak:vWeak}[view.name]||vHome)(p);
  if((view.name==='home'||view.name==='mock')&&hasSavedMock()){
    p.insertAdjacentHTML('afterbegin','<p><button class="btn sec" onclick="offerMockResume()">Open saved mock exam</button></p>');
  }
  revealOnScroll(p);
  /* The companion travels with the view: she repaints her readout and, the
     first time she meets a screen, explains it. */
  clepPaint(); clepPlace(); clepOnView();
}

/* Fade cards up as they enter the viewport — browse screens only. Reading
   screens get the page entrance animation and then hold completely still.
   Falls back to showing everything if IntersectionObserver is unavailable. */
let _revealObs=null;
function revealOnScroll(root){
  if(_revealObs){_revealObs.disconnect();_revealObs=null}
  if(STILL_VIEWS.includes(view.name)) return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const items=root.querySelectorAll('.card,.stat,.ch-row,.th-ch,.day');
  if(!items.length||!('IntersectionObserver' in window)) return;
  _revealObs=new IntersectionObserver((entries,obs)=>{
    entries.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)} });
  },{rootMargin:'0px 0px -40px 0px',threshold:.06});
  items.forEach((el,i)=>{
    el.classList.add('reveal');
    el.style.transitionDelay=Math.min(i,10)*26+'ms';
    _revealObs.observe(el);
  });
}

/* ============ DASHBOARD ============ */
function vHome(p){
  const total=QUESTIONS.length;
  const done=QUESTIONS.filter(q=>isAnswered(q.id)).length;
  const acc=accuracy(QUESTIONS);
  const due=dueNow().length;
  /* A profile that has answered nothing has nothing to stand on, and the four
     stat tiles say so in the bluntest possible way: 0 / — / 0 / 0. That is an
     empty scoreboard shown to somebody who has not played yet, and it was the
     first sentence the app spoke to a new colleague. The first run asks for a
     subject instead, and puts the subjects directly underneath the question.
     The moment one answer lands the dashboard becomes the ledger it was built
     to be — nothing is removed, it is deferred until it means something. */
  const fresh=done===0;

  let h=`<div class="eyebrow">${esc(termName())}</div>`;
  h+=fresh
    ?`<h1>Choose a subject to begin</h1>
      <p class="page-sub">${total} questions, transcribed from the printed banks. Start anywhere — every chapter remembers where you stopped.</p>`
    :`<h1>Where you stand</h1>
      <p class="page-sub">${total} questions loaded. Work through them by chapter, by module, or build a custom set.</p>`;

  if(!fresh){
    h+=`<div class="grid g4" style="margin-bottom:30px">
    <div class="stat"><span class="emo">${ico('stylus',20)}</span><div class="n">${done}<span style="font-size:15px;color:var(--ink-4)">/${total}</span></div><div class="l">Answered</div></div>
    <div class="stat"><span class="emo">${ico('target',20)}</span><div class="n" style="color:${accColor(acc)}">${acc===null?'—':acc+'%'}</div><div class="l">Accuracy</div></div>
    <div class="stat"><span class="emo">${ico('hourglass',20)}</span><div class="n" style="color:${due?'var(--ent)':'var(--ok)'}">${due}</div><div class="l">Due for review</div></div>
    <div class="stat"><span class="emo">${ico('laurel',20)}</span><div class="n">${QUESTIONS.filter(q=>S.flags[q.id]).length}</div><div class="l">Flagged</div></div>
  </div>`;
  }

  /* openModules(), not MODULES: a student who practised a subject before it was
     locked still has its place saved, and offering to continue it would open a
     chapter with nothing in it. The pointer is kept, just not offered. */
  const recent=Object.keys(S.resumeByChapter||{}).filter(cid=>
    openModules().some(m=>m.groups.some(g=>g.chapters.some(c=>c[0]===cid)))
  ).sort((a,b)=>S.resumeByChapter[b].at-S.resumeByChapter[a].at)[0];
  if(recent){
    const r=S.resumeByChapter[recent];
    h+=`<div class="filterbar"><button class="btn go" onclick="startChapter('${recent}')">${r.finished?'Restart':'Continue'} &mdash; ${esc(chapterName(recent))}</button></div>`;
  }

  const t=todayISO();
  const rows=buildSchedule().rows;
  const today=rows.find(d=>d.date===t);
  let todayHTML='';
  if(today&&today.items&&today.items.length){
    todayHTML=`<h2>${ico('laurel',20)} On today</h2><div class="card" style="margin-bottom:28px;--c:rgba(109,76,125,.4)">
      ${today.items.map(it=>`<div class="day-line">${it.label?`<span class="tag" style="background:${it.hex}">${esc(it.label)}</span>`:''}${esc(it.text)}</div>`).join('')}
      </div>`;
  }

  /* The man the app is named after. The engraving and the biography both come
     from the user's own supplied image (Design\Images\Father of anatomy 2.jpg) — this
     is NOT from the Semester 8 course material and carries no page citation,
     which is why it is kept to biography and never touches clinical content. */
  const heroHTML=`<section class="hero-panel">
    <div class="hp-art"><img src="assets/herophilus-bust.jpg" alt="Engraved bust of Herophilus" loading="lazy"></div>
    <div class="hp-txt">
      <div class="hp-kicker">Alexandria · c. 335–280 BC</div>
      <div class="hp-name">Herophilus</div>
      <div class="hp-sub">Father of Anatomy</div>
      <p>An ancient Greek physician, the first to dissect and study the human body. His work laid the foundations for understanding the <b>brain</b>, the <b>nerves</b>, the <b>eye</b> and the <b>blood vessels</b>.</p>
      <p>Twenty-three centuries later, you are revising the same four things.</p>
    </div>
  </section>`;

  let modsHTML=`<h2>${fresh?'Subjects':'Modules'}</h2><div class="grid g3 mod-grid">`;
  activeModules().forEach(m=>{
    const qs=qsInModule(m.id);
    const d=qs.filter(q=>isAnswered(q.id)).length;
    const a=accuracy(qs);
    const pct=qs.length?d/qs.length*100:0;
    const chs=m.groups.reduce((n,g)=>n+g.chapters.length,0);
    /* A locked subject keeps its card and its artwork — dropping it would read
       as an app that only covers two subjects — but shows no counts and no
       progress ring, because both would be zero and a zero reads as broken. */
    if(isLocked(m.id)){
      modsHTML+=`<div class="card mod-card locked" style="--c:${m.color}" aria-disabled="true">
        ${(m.art||MOD_ART[m.id])?`<span class="mod-art" style="--art:url('assets/${m.art||MOD_ART[m.id]}.jpg')"></span>`:''}
        <span class="soon">Coming soon</span>
        <div class="mod-info">
          <div class="mod-top"><span class="mod-ic">${ico(m.icon,25)}</span><span class="mod-name">${m.name}</span></div>
          <div class="mod-meta">${chs} chapters on the syllabus. The questions are still being transcribed.</div>
        </div>
      </div>`;
      return;
    }
    /* An untouched subject has no ring worth drawing. A 0% arc, a dash for
       accuracy and "0/1598 answered" are three separate ways of printing the
       same nothing, and printed three times they read as a fault rather than a
       beginning. The card says what to do instead, and earns its ring with the
       first answer. Same height either way, so the grid does not jump when one
       subject crosses over. */
    const foot=d===0
      ?`<div class="ringrow startrow"><span class="startgo">Start studying</span></div>`
      :`<div class="ringrow">${ring(pct,m.hex)}

    modsHTML+=`<button class="card mod-card" style="--c:${m.color}" onclick="go({name:'module',id:'${m.id}'})">
      ${(m.art||MOD_ART[m.id])?`<span class="mod-art" style="--art:url('assets/${m.art||MOD_ART[m.id]}.jpg')"></span>`:''}
      <div class="mod-info">
        <div class="mod-top"><span class="mod-ic">${ico(m.icon,25)}</span><span class="mod-name">${m.name}</span></div>
        <div class="mod-meta">${chs} chapters · ${qs.length} question${qs.length===1?'':'s'}</div>
        ${foot}
      </div>
    </button>`;
  });
  modsHTML+=`</div>`;

  /* First run leads with the subjects and keeps the biography as a closing
     note; once there is progress to report the page goes back to reporting it
     first and the subjects sit where a returning reader already looks for
     them. */
  h+=fresh?modsHTML+todayHTML+heroHTML:todayHTML+heroHTML+modsHTML;
  p.innerHTML=h;
}

function vModule(p){
  const m=moduleOf(view.id);
  const qs=qsInModule(m.id);
  const a=accuracy(qs);
  let h=`<button class="tb-btn" style="padding-left:0;margin-bottom:8px" onclick="go({name:'home'})">← Dashboard</button>

  /* Source filter. Only rendered for banks this module actually has questions
     from, so an empty module does not offer three dead toggles. */
  const allQ=allQsInModule(m.id);
  const present=BANKS.filter(b=>allQ.some(q=>banksOf(q).indexOf(b.id)>=0));
  if(present.length>1){
    const sel=S.banks[m.id]||[];
    const filtering=sel.length>0;
    h+=`<div class="bankbar">
      <span class="bank-lbl">Source</span>
      ${present.map(b=>{
        /* A shared question counts for EVERY bank it is in, so these chips can
           sum to more than the module's question count. That is the honest
           reading — the question really is in both banks — and it is the
           user's choice (2026-08-03). Do not "fix" it by counting origins. */
        const on=!filtering||sel.indexOf(b.id)>=0;
        const n=allQ.filter(q=>banksOf(q).indexOf(b.id)>=0).length;
        return `<button class="bankchip ${on?'on':''}" style="--bk:${b.hex}"

      }).join('')}
      ${filtering?`<button class="bankchip reset" onclick="clearBanks('${m.id}')">Show all</button>`:''}
    </div>`;

  if(qs.length){

      <button class="btn go" onclick="startQuiz(${JSON.stringify(qs.map(q=>q.id)).replace(/"/g,'&quot;')},'${m.name} — all')">▶ Practise all ${qs.length}</button>

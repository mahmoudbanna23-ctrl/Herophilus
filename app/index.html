     <button class="btn go" onclick="saveProfile()">Save</button>
   </div>`,true);
}
function pfUpload(e,isEdit){
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'),SZ=160;
      c.width=SZ;c.height=SZ;
      const x=c.getContext('2d');
      const s=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,SZ,SZ);
      draft.av={t:'p',v:c.toDataURL('image/jpeg',0.8),c:draft.av.c};
      drawProfileEditor(isEdit);
    };
    img.onerror=()=>toast('Could not read that image');
    img.src=r.result;
  };
  r.readAsDataURL(f);
  e.target.value='';
}
function saveProfile(){
  const n=$('pfName');
  draft.name=((n&&n.value)||draft.name||'').trim()||'Untitled';
  if(draft.pin&&draft.pin.length!==4){toast('PIN must be 4 digits, or blank');return}
  const i=profiles.findIndex(p=>p.id===draft.id);
  if(i>=0)profiles[i]=draft; else profiles.push(draft);
  saveProfiles();
  const saved=draft;draft=null;
  closeModal();
  if(me&&me.id===saved.id){me=saved;render();toast('Profile updated')}
  else if(!me)enterProfile(saved);
  else{showGate()}
}
function deleteProfile(id){
  const p=profiles.find(x=>x.id===id);
  if(!p)return;
  showModal(`<h3>Delete ${esc(p.name)}?</h3>
   <p>This erases that profile's answers, highlights, schedule and review deck. It cannot be undone.</p>
   <div class="modal-actions">
     <button class="btn sec" onclick="editProfile('${id}')">Cancel</button>
     <button class="btn" style="background:var(--bad);border-color:var(--bad)" onclick="doDeleteProfile('${id}')">Delete</button>
   </div>`);
}
function doDeleteProfile(id){
  profiles=profiles.filter(p=>p.id!==id);
  saveProfiles();
  try{localStorage.removeItem(stateKey(id))}catch(e){}
  if(me&&me.id===id)me=null;
  closeModal();showGate();toast('Profile deleted');
}
function manageProfiles(){
  let h=`<h3>Manage profiles</h3><p>Pick one to rename, change its picture or PIN, or delete it.</p>`;
  profiles.forEach(p=>{
    h+=`<button class="ch-row" style="margin-bottom:8px" onclick="editProfile('${p.id}')">
      ${avHTML(p.av,'rav').replace('class="rav"','class="rav" style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;background:'+(p.av?p.av.c:'#6d4c7d')+'"')}
      <span class="ch-name">${esc(p.name)}</span>
      <span class="ch-count">${p.pin?'\uD83D\uDD12 PIN set':'no PIN'}</span></button>`;

     <button class="btn sec" onclick="closeModal();showGate()">Back</button>

}

/* ============ ROUTER ============ */
let view={name:'home'};
function go(v){view=v;render();window.scrollTo(0,0);closeRail()}
/* Screens where the learner READS for minutes at a time. The cinematic layer
   pauses the ambient orbs on these, so nothing drifts beside a clinical stem.
   Everything else is a browse screen and stays alive. */
const STILL_VIEWS=['quiz','mock','review','theory'];

/* The ambient film obeys the same gate as the orbs, but CSS can only fade it —
   a paused <video> is the difference between a still picture and a decoder
   running behind a clinical stem, which costs battery and, on a slow machine,
   frames the reader can feel. So the opacity is CSS and the pause is here.

   Reduced motion is checked live rather than cached: the CSS already hides the
   film, and pausing as well means a viewer who flips the OS setting mid-session
   is not left with an invisible video still decoding. Every failure path is
   silent — play() rejects whenever autoplay is blocked, and that is a
   perfectly acceptable outcome that must never surface as an error. */
function setFilm(f,on){
  if(!f) return;
  if(!on){ f.pause(); return }
  const p=f.play();
  if(p&&p.catch) p.catch(()=>{});
}
function syncFilm(){
  const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  setFilm(document.querySelector('.ambient .film'),
          !reduce && !STILL_VIEWS.includes(view.name));
  /* The gate's copy. A hidden <video> keeps decoding — display:none does not
     stop it — so it has to be paused explicitly the moment the gate closes,
     or it runs for the whole session behind a screen nobody is looking at. */
  const g=$('gate');
  setFilm(document.querySelector('.gate-amb .film'),
          !reduce && !!g && !g.classList.contains('hide'));
}

function render(){
  renderNav();
  const p=$('page');
  // Drives body[data-view] in CSS — the alive-to-browse / calm-to-read gate.
  document.body.dataset.view=view.name||'home';
  syncFilm();
  ({home:vHome,module:vModule,quiz:vQuiz,review:vReview,schedule:vSchedule,theory:vTheory,
    moved:vMoved,flagged:vFlagged,mock:vMock,session:vSession}[view.name]||vHome)(p);
  revealOnScroll(p);
  /* The companion travels with the view: she repaints her readout and, the
     first time she meets a screen, explains it. */
  clepPaint(); clepPlace(); clepOnView();
}

/* Fade cards up as they enter the viewport — browse screens only. Reading
   screens get the page entrance animation and then hold completely still.
   Falls back to showing everything if IntersectionObserver is unavailable. */
let _revealObs=null;
function revealOnScroll(root){
  if(_revealObs){_revealObs.disconnect();_revealObs=null}
  if(STILL_VIEWS.includes(view.name)) return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const items=root.querySelectorAll('.card,.stat,.ch-row,.th-ch,.day');
  if(!items.length||!('IntersectionObserver' in window)) return;
  _revealObs=new IntersectionObserver((entries,obs)=>{
    entries.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)} });
  },{rootMargin:'0px 0px -40px 0px',threshold:.06});
  items.forEach((el,i)=>{
    el.classList.add('reveal');
    el.style.transitionDelay=Math.min(i,10)*26+'ms';
    _revealObs.observe(el);
  });
}

function vHome(p){
  const total=QUESTIONS.length;

  }

  m.groups.forEach(g=>{
    h+=`<div class="grouphdr">${g.name}</div>`;
    g.chapters.forEach(([cid,cname])=>{
      const cq=qsIn(cid);

      const dot=cq.length?(ca===null?'#fff':accColor(ca)):'transparent';
      h+=`<button class="ch-row" ${cq.length?'':'disabled'} onclick="startQuiz(${JSON.stringify(cq.map(q=>q.id)).replace(/"/g,'&quot;')},'${esc(cname).replace(/'/g,"\\'")}')">

        <span class="ch-acc" style="color:${accColor(ca)}">${ca===null?'':ca+'%'}</span>
      </button>`;

  });
  p.innerHTML=h;

let Q={ids:[],i:0,title:'',sel:null,shown:false,t0:null,txt:'',peek:false};
function startQuiz(ids,title){
  if(!ids||!ids.length){toast('No questions there yet 🤷');return}

/* ---- Free-text cases ----------------------------------------------------
   Some sources print a vignette and a diagnosis with no options at all.
   Those become type:'case': the learner types a diagnosis and it is graded
   on concept keys, never on exact wording — "right otomycosis" and
   "fungal otitis externa of the right ear" both earn the same key.       */
function normTxt(s){
  return String(s||'').toLowerCase()
    .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){                        // edit distance, for typo tolerance
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j),cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function keyHit(hay,terms){
  const words=hay.split(' ');
  return (terms||[]).some(t=>{
    const n=normTxt(t); if(!n)return false;
    if(hay.indexOf(n)>=0)return true;
    if(n.indexOf(' ')>=0)return false;          // multi-word: exact only
    const tol=n.length>7?2:(n.length>4?1:0);    // single word: allow typos
    return tol>0&&words.some(w=>Math.abs(w.length-n.length)<=tol&&lev(w,n)<=tol);
  });
}
function gradeCase(q,txt){
  const hay=normTxt(txt), keys=q.keys||[];
  const hits=keys.map(k=>keyHit(hay,k.terms));
  const got=hits.filter(Boolean).length;
  return {hits:hits,got:got,total:keys.length,ok:keys.length>0&&got===keys.length,blank:!hay};
}
function revealCase(){
  const q=QUESTIONS.find(x=>x.id===Q.ids[Q.i]);
  const el=document.getElementById('caseInput');
  const txt=el?el.value:'';
  if(!normTxt(txt)){toast('Type a diagnosis first ✍️');return}
  Q.txt=txt; Q.shown=true; Q.peek=false;
  const g=gradeCase(q,txt);
  if(!S.answers[q.id]||S.answers[q.id].text!==txt){
    S.answers[q.id]={text:txt,got:g.got,total:g.total,ok:g.ok,at:Date.now()};
    scheduleSRS(q.id,g.ok);
  }
  markDayActive();save();render();
  /* a case is graded got/total, so partly right gets its own reading */
  clepPose(g.ok?'dancing':(g.got>0?'thinking':'surprised')); clepSettle(3200);
}
/* Deliberate escape hatch for a learner who is stuck. It is never automatic,
   it scores nothing and it records no answer — otherwise a case with no
   recallable diagnosis would be a dead end, since Skip never shows the
   explanation either. */
function peekCase(){
  Q.txt=''; Q.shown=true; Q.peek=true;
  render();
}
function vCase(p,q,m,prev){
  /* A case is NEVER auto-revealed, not even one answered before — the whole
     point is to type the diagnosis first (user's instruction, 2026-07-26).
     Returning to an answered case therefore starts blank again; the previous
     attempt is shown as a chip so the earlier score is not lost. */
  const flagged=!!S.flags[q.id];
  const g=(Q.shown&&!Q.peek)?gradeCase(q,Q.txt):null;
  const verdict=Q.peek?['bad',ico('eye',18),'Revealed — not scored']
    :!g?null:(g.ok?['ok',ico('target',18),'Spot on']
    :g.got>0?['part',ico('hourglass',18),'Partly right — '+g.got+' of '+g.total+' key points']
    :['bad',ico('laurel',18),'Not quite']);

  let h=`<div class="qwrap">
   <div class="qhead">

   </div>

    ${markbar(q.id)}

    ${qFigure(q)}

    <textarea id="caseInput" class="caseinput" rows="3" ${Q.shown?'disabled':''}
      placeholder="Type the diagnosis in your own words — wording is not marked, the concepts are."
      >${esc(Q.txt||'')}</textarea>`;

  if(!Q.shown&&prev&&prev.text){
    h+=`<div class="lastgo">${ico('hourglass',15)} You answered this before — ${prev.got} of ${prev.total} key points. Have another go.</div>`;
  }

  if(!Q.shown){
    h+=`<div class="qactions">
      <button class="btn go" onclick="revealCase()">Check my answer</button>
      <button class="btn sec" onclick="peekCase()">${ico('eye',15)} Reveal</button>
      <button class="btn sec flag ${flagged?'on':''}" onclick="toggleFlag('${q.id}')">${ico('laurel',15)} ${flagged?'Flagged':'Flag'}</button>
      <div style="margin-left:auto;display:flex;gap:9px">
        ${Q.i>0?'<button class="btn sec" onclick="navQ(-1)">←</button>':''}
        <button class="btn sec" onclick="navQ(1)">Skip →</button>
      </div></div>`;
  }else{
    h+=`<div class="verdict ${verdict[0]}"><span class="big">${verdict[1]}</span>${verdict[2]}</div>`;
    h+=`<div class="modelans"><b>The source's diagnosis</b><div>${md(q.answer)}</div></div>`;
    if((q.keys||[]).length){
      h+=`<div class="keys"><div class="keys-h">What was being looked for</div>`;
      q.keys.forEach((k,i)=>{
        const hit=g?g.hits[i]:false;
        h+=`<div class="key ${g?(hit?'hit':'miss'):''}"><span>${g?(hit?'✅':'⬜'):'•'}</span>
            <span>${esc(k.label)}</span></div>`;
      });
      h+=`</div>`;
    }
    if(!Q.peek&&(!prev||prev.conf===undefined)){
      h+=`<div class="conf"><div class="conf-q">${ico('target',15)} How sure were you? This sets when it comes back.</div>
       <div class="conf-btns">
        <button class="conf-b" onclick="setConf('${q.id}',0)">Guessed</button>
        <button class="conf-b" onclick="setConf('${q.id}',1)">Unsure</button>
        <button class="conf-b" onclick="setConf('${q.id}',2)">Confident</button>
       </div></div>`;
    }
    const hasExp=q.explanation&&q.explanation.trim().length>0;
    h+=`<div class="explain">
      <button class="ex-head" onclick="toggleExp(this)">${ico('lamp',16)} Explain this case<span class="chev">▾</span></button>
      <div class="ex-body">${hasExp?md(q.explanation):'<div class="noexp">No explanation came with this case.</div>'}
      ${q.objective?`<div class="objective"><b>${ico('laurel',15)} Educational objective</b>${md(q.objective).replace(/<\/?p>/g,'')}</div>`:''}
      </div></div>`;
    const th=qTheory(q.id);
    if(th)h+=`<button class="readtheory" onclick="openTheoryFor('${q.id}')">
      &#128218; <span>Read the notes on this &mdash; <b>${esc(th.h)}</b></span>
      <span style="margin-left:auto">&rarr;</span></button>`;
    h+=`<div class="qactions">
      <button class="btn sec flag ${flagged?'on':''}" onclick="toggleFlag('${q.id}')">${ico('laurel',15)} ${flagged?'Flagged':'Flag'}</button>
      <div style="margin-left:auto;display:flex;gap:9px">
        ${Q.i>0?'<button class="btn sec" onclick="navQ(-1)">←</button>':''}
        <button class="btn go" onclick="navQ(1)">${Q.i===Q.ids.length-1?'Finish':'Next →'}</button>
      </div></div>`;
  }
  h+=`</div></div>`;
  p.innerHTML=h;
  const stemEl=p.querySelector('.stem');
  if(stemEl){
    applyHighlights(stemEl,S.hl[q.id]||[]);
    stemEl.addEventListener('mouseup',onStemSelect);
    stemEl.addEventListener('touchend',onStemSelect);
  }
  const inp=document.getElementById('caseInput');
  if(inp&&!Q.shown){
    inp.focus();
    inp.addEventListener('keydown',e=>{        // Ctrl/Cmd+Enter submits
      if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();revealCase()}
    });
  }
}

function vQuiz(p){
  const q=QUESTIONS.find(x=>x.id===Q.ids[Q.i]);
  /* backticks, not quotes: ico() contains single quotes, which would close a
     single-quoted string and take the whole script down with it */
  if(!q){p.innerHTML=`<div class="empty"><div class="big">${ico('laurel',46)}</div><h3>Set complete</h3></div>`;return}
  const m=moduleOf(q.module)||{hex:'#7a6a55'};
  const prev=S.answers[q.id];
  if(q.type==='case'){vCase(p,q,m,prev);return}
  if(prev&&!Q.shown&&Q.sel===null){Q.sel=prev.pick;Q.shown=true}
  const flagged=!!S.flags[q.id];

  let h=`<div class="qwrap">
   <div class="qhead">
    <button class="tb-btn" style="padding-left:0" onclick="go({name:'module',id:'${q.module}'})">←</button>
    <span class="pill" style="background:${m.hex}">${esc(chapterName(q.chapter))}</span>
    ${bankPills(q)}
    ${q.source?`<span class="pill ghost">${mdInline(q.source)}</span>`:''}
    <button class="qprog" title="Jump to a question (J)" onclick="openJump()">${Q.i+1} / ${Q.ids.length} &nbsp;&#9776;</button>
   </div>
   <div class="qcard">
    ${markbar(q.id)}
    <div class="stem${armed?' arm':''}">${md(q.stem)}</div>
    ${qFigure(q)}
    <div class="opts">`;
  q.options.forEach((o,i)=>{
    let cls='opt';
    if(Q.shown){ if(i===q.answer)cls+=' correct'; else if(i===Q.sel)cls+=' wrong' }
    else if(i===Q.sel)cls+=' sel';
    const mark=Q.shown?(i===q.answer?'<span class="mark">✅</span>':(i===Q.sel?'<span class="mark">❌</span>':'')):'';
    h+=`<button class="${cls}" ${Q.shown?'disabled':''} onclick="pick(${i})">
      <span class="ltr">${'ABCDE'[i]}</span><span>${esc(o)}</span>${mark}</button>`;
  });
  h+=`</div>`;

  if(!Q.shown){
    h+=`<div class="qactions">
      <button class="btn go" ${Q.sel===null?'disabled':''} onclick="reveal()">Check answer</button>
      <button class="btn sec flag ${flagged?'on':''}" onclick="toggleFlag('${q.id}')">${ico('laurel',15)} ${flagged?'Flagged':'Flag'}</button>
      <div style="margin-left:auto;display:flex;gap:9px">
        ${Q.i>0?'<button class="btn sec" onclick="navQ(-1)">←</button>':''}
        <button class="btn sec" onclick="navQ(1)">Skip →</button>
      </div></div>`;
  }else{
    const ok=Q.sel===q.answer;
    h+=`<div class="verdict ${ok?'ok':'bad'}"><span class="big">${ok?ico('target',26):ico('laurel',26)}</span>
      ${ok?'Correct!':'Not quite — the answer is '+'ABCDE'[q.answer]}</div>`;

    if(!prev||prev.conf===undefined){
      h+=`<div class="conf"><div class="conf-q">${ico('target',15)} How sure were you? This sets when it comes back.</div>
       <div class="conf-btns">
        <button class="conf-b" onclick="setConf('${q.id}',0)">Guessed</button>
        <button class="conf-b" onclick="setConf('${q.id}',1)">Unsure</button>
        <button class="conf-b" onclick="setConf('${q.id}',2)">Confident</button>
       </div></div>`;
    }

    const hasExp=q.explanation&&q.explanation.trim().length>0;
    h+=`<div class="explain">
      <button class="ex-head" onclick="toggleExp(this)">${ico('lamp',16)} Explain this answer<span class="chev">▾</span></button>
      <div class="ex-body">${hasExp?md(q.explanation):'<div class="noexp">No explanation came with this question. Flag it and I can write one.</div>'}
      ${q.objective?`<div class="objective"><b>${ico('laurel',15)} Educational objective</b>${md(q.objective).replace(/<\/?p>/g,'')}</div>`:''}
      </div></div>`;

    const th=qTheory(q.id);
    if(th)h+=`<button class="readtheory" onclick="openTheoryFor('${q.id}')">
      &#128218; <span>Read the notes on this &mdash; <b>${esc(th.h)}</b></span>
      <span style="margin-left:auto">&rarr;</span></button>`;

    h+=`<div class="qactions">
      <button class="btn sec flag ${flagged?'on':''}" onclick="toggleFlag('${q.id}')">${ico('laurel',15)} ${flagged?'Flagged':'Flag'}</button>
      <div style="margin-left:auto;display:flex;gap:9px">
        ${Q.i>0?'<button class="btn sec" onclick="navQ(-1)">←</button>':''}
        <button class="btn go" onclick="navQ(1)">${Q.i===Q.ids.length-1?'Finish':'Next →'}</button>
      </div></div>`;
  }
  h+=`</div></div>`;
  p.innerHTML=h;
  const stemEl=p.querySelector('.stem');
  if(stemEl){
    applyHighlights(stemEl,S.hl[q.id]||[]);
    stemEl.addEventListener('mouseup',onStemSelect);
    stemEl.addEventListener('touchend',onStemSelect);
  }
}
function pick(i){if(Q.shown)return;Q.sel=i;render()}
function reveal(){
  if(Q.sel===null)return;
  const q=QUESTIONS.find(x=>x.id===Q.ids[Q.i]);
  const ok=Q.sel===q.answer;
  Q.shown=true;
  if(!S.answers[q.id]||S.answers[q.id].pick!==Q.sel){
    S.answers[q.id]={pick:Q.sel,ok:ok,at:Date.now()};
    scheduleSRS(q.id,ok);
  }
  markDayActive();save();render();
  /* she reacts, then settles back to the screen's own pose */
  clepPose(ok?'dancing':'surprised'); clepSettle(3200);
}
function setConf(id,c){
  S.conf[id]=c;
  if(S.answers[id]){
    S.answers[id].conf=c;
    if(c===0){ /* guessed → back tomorrow, in the deck */
      S.srs[id]={lvl:0,due:(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)})()};
    }
  }
  save();render();
  toast(c===0?'Added to your review deck 🎲':c===1?'Noted — it will come back soon':'Nice 💪');
}
function navQ(d){
  const n=Q.i+d;
  if(n<0)return;
  if(n>=Q.ids.length){finishSet();return}
  Q.i=n;Q.sel=null;Q.shown=false;Q.txt='';Q.peek=false;render();
  /* a new question: back to the screen's own pose. clepOnView cannot do this —
     the view key has not changed, so its dedupe returns early. */
  clearTimeout(CLEP.settleT); clepPose(clepViewPose());
}
function finishSet(){
  const done=Q.ids.filter(id=>isAnswered(id));
  const right=done.filter(id=>isCorrect(id)).length;
  const mins=Math.round((Date.now()-Q.t0)/60000);
  const pct=done.length?Math.round(right/done.length*100):0;
  if(pct>=80&&done.length>=3)confetti();
  /* the end of a set is the one moment she gets to jump */
  clepPose(pct>=80&&done.length>=3?'jumping':'presenting'); clepSettle(5000);
  const face=ico(pct>=90?'laurel':pct>=75?'target':pct>=50?'hourglass':'scroll',40);
  showModal(`<h3>${face} ${pct}%</h3>

/* ============ HIGHLIGHTER ============ */
let armed='y';           /* active pen: y/g/p/b, or 'er' to erase */
const PENS=[['y','Yellow'],['g','Green'],['p','Pink'],['b','Blue']];

function setPen(c){armed=(armed===c)?null:c;render()}

function offsetOf(root,node,off){
  let acc=0;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let n;
  while(n=w.nextNode()){
    if(n===node)return acc+off;
    acc+=n.nodeValue.length;
  }
  return -1;
}
function stripMarks(root){
  root.querySelectorAll('mark.hl').forEach(m=>{
    const p=m.parentNode;
    while(m.firstChild)p.insertBefore(m.firstChild,m);
    p.removeChild(m);
  });
  root.normalize();
}
function paint(root,s,e,c){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let acc=0,n;const hits=[];
  while(n=w.nextNode()){
    const len=n.nodeValue.length, ns=acc, ne=acc+len;
    if(ne>s&&ns<e)hits.push({node:n,from:Math.max(s-ns,0),to:Math.min(e-ns,len)});
    acc=ne;
  }
  hits.forEach(({node,from,to})=>{
    if(to<=from)return;
    const r=document.createRange();
    r.setStart(node,from);r.setEnd(node,to);
    const m=document.createElement('mark');
    m.className='hl';m.dataset.c=c;
    try{r.surroundContents(m)}
    catch(err){const f=r.extractContents();m.appendChild(f);r.insertNode(m)}
  });
}
function applyHighlights(root,list){
  stripMarks(root);
  (list||[]).slice().sort((a,b)=>a.s-b.s).forEach(h=>paint(root,h.s,h.e,h.c));
}
function carve(list,s,e){
  const out=[];
  (list||[]).forEach(h=>{
    if(h.e<=s||h.s>=e){out.push(h);return}
    if(h.s<s)out.push({s:h.s,e:s,c:h.c});
    if(h.e>e)out.push({s:e,e:h.e,c:h.c});
  });
  return out;
}
function onStemSelect(){
  if(!armed)return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount)return;
  const root=document.querySelector('.stem');
  if(!root)return;
  const r=sel.getRangeAt(0);
  if(!root.contains(r.commonAncestorContainer))return;
  const s=offsetOf(root,r.startContainer,r.startOffset);
  const e=offsetOf(root,r.endContainer,r.endOffset);
  if(s<0||e<0||e<=s)return;
  const q=QUESTIONS.find(x=>x.id===Q.ids[Q.i]);
  if(!q)return;
  let list=carve(S.hl[q.id]||[],s,e);
  if(armed!=='er')list.push({s:s,e:e,c:armed});
  list.sort((a,b)=>a.s-b.s);
  /* merge touching runs of the same colour */
  const merged=[];
  list.forEach(h=>{
    const p=merged[merged.length-1];
    if(p&&p.c===h.c&&h.s<=p.e)p.e=Math.max(p.e,h.e);
    else merged.push(Object.assign({},h));
  });
  S.hl[q.id]=merged;
  sel.removeAllRanges();
  save();
  applyHighlights(root,merged);
}
function clearHl(){
  const q=QUESTIONS.find(x=>x.id===Q.ids[Q.i]);
  if(!q)return;
  delete S.hl[q.id];save();render();
  toast('Highlights cleared');
}
function markbar(qid){
  const n=(S.hl[qid]||[]).length;
  let h='<div class="mkbar"><span class="lb">&#128396;&#65039; Marker</span>';
  PENS.forEach(([c,name])=>{
    h+=`<button class="pen ${c} ${armed===c?'on':''}" title="${name} highlighter" onclick="setPen('${c}')"></button>`;
  });
  h+=`<button class="pen er ${armed==='er'?'on':''}" title="Eraser" onclick="setPen('er')">&#9003;</button>`;
  if(n)h+=`<button class="clr" onclick="clearHl()">Clear all</button>`;
  h+=`<span class="hint">${armed?(armed==='er'?'Select text to erase':'Select text to highlight'):'Pick a colour to start'}</span>`;
  return h+'</div>';
}

function sessRing(frac,color){
  const r=54, c=2*Math.PI*r;
  return `<svg class="sr-ring" viewBox="0 0 128 128" aria-hidden="true">
    <circle cx="64" cy="64" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="9"/>
    <circle id="srArc" cx="64" cy="64" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}"
      stroke-dashoffset="${(c*(1-frac)).toFixed(1)}" transform="rotate(-90 64 64)"/></svg>`;
}
/* The tick repaints these four nodes and nothing else. A full render() every
   second would rebuild the page under the reader's cursor once a second. */
function paintSessionLive(){
  const s=sess(); if(!s||view.name!=='session')return;

    const r=54,c=2*Math.PI*r;

  const ph=$('sessPhase');
  if(ph)ph.textContent=s.paused?'Paused':(s.phase==='focus'?`Focus · block ${s.cycle} of ${s.plan.cycles}`:'Break');
  const st=sessStats(s);
  const n=$('sessCount'); if(n)n.textContent=st.n;

}

      }

      landed.forEach(c=>{
        h+=`<div class="track catchup">

function fmtShort(iso){
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function trackRow(date,idx,label,hex,text,mark){
  return `<div class="track ${mark==='missed'?'is-missed':mark==='done'?'is-done':''}">
    <span class="track-body">${label?`<span class="tag" style="background:${hex}">${esc(label)}</span>`:''}${esc(text)}</span>
    <span class="day-marks">
      <button class="mk done ${mark==='done'?'on':''}" title="Mark done" onclick="setMark('${date}',${idx},'done')">&#10003;</button>
      <button class="mk miss ${mark==='missed'?'on':''}" title="Mark missed" onclick="setMark('${date}',${idx},'missed')">&#10007;</button>
    </span></div>`;
}
function setMark(date,idx,mark){
  const k=date+'|'+idx;
  if(S.sched[k]===mark)delete S.sched[k]; else S.sched[k]=mark;
  markDayActive();save();render();
  if(S.sched[k]==='missed'){
    const {overflow}=buildSchedule();
    toast(overflow>0?`Queued for catch-up \u2014 \u26a0\ufe0f ${overflow} with no slot left`:'Queued for catch-up \u2705');
  }else if(S.sched[k]==='done')toast('Nice work \u2705');
  else toast('Cleared');
}

/* Rebuild the plan. Content from missed days flows forward into later study days. */
function buildSchedule(){
  const rows=activeSchedule().map(d=>({
    date:d.date,rest:!!d.rest,
    items:(d.items||[]).map((it,i)=>({label:it.label,text:it.text,hex:it.hex||'#7a6a55',idx:i}))
  }));
  const missed=[];
  rows.forEach(r=>{
    if(r.rest)return;
    r.items.forEach(it=>{
      if(S.sched[r.date+'|'+it.idx]==='missed')
        missed.push({date:r.date,idx:it.idx,text:it.text,label:it.label,hex:it.hex});
    });
  });
  if(!missed.length)return {rows,catchups:[],overflow:0,capacity:0};

  const earliest=missed[0].date;
  const slots=[];
  rows.forEach(r=>{
    if(r.date<=earliest)return;
    if(r.rest||!r.items.length)slots.push({date:r.date,kind:'rest',cap:2});
  });
  const catchups=[];
  let si=0,used=0;
  missed.forEach(m=>{
    while(si<slots.length&&used>=slots[si].cap){si++;used=0}
    if(si>=slots.length){catchups.push(Object.assign({to:null,kind:null},m));return}
    catchups.push(Object.assign({to:slots[si].date,kind:slots[si].kind},m));
    used++;
  });
  return {rows,catchups,overflow:catchups.filter(c=>!c.to).length,
          capacity:slots.reduce((n,s)=>n+s.cap,0)};
}


/* ============ SCHEDULE EDITOR ============ */
function editItem(di,idx,field,val){
  const s=activeSchedule();
  if(!s[di]||!s[di].items[idx])return;
  s[di].items[idx][field]=val;
  save();
}
function cycleColour(di,idx){
  const s=activeSchedule();
  const it=s[di]&&s[di].items[idx];
  if(!it)return;
  const cur=SUBJ_COLOURS.findIndex(c=>c[0].toLowerCase()===String(it.hex).toLowerCase());
  it.hex=SUBJ_COLOURS[(cur+1)%SUBJ_COLOURS.length][0];
  saveSchedule();
}
function addItem(di){
  const s=activeSchedule();
  if(!s[di])return;
  s[di].rest=false;
  s[di].items.push({label:'',text:'',hex:'#7a6a55'});
  saveSchedule();
}
function delItem(di,idx){
  const s=activeSchedule();
  if(!s[di])return;
  const date=s[di].date;
  s[di].items.splice(idx,1);
  /* marks are index-based, so re-key them for this day */
  const keep={};
  Object.keys(S.sched).forEach(k=>{
    const [d,i]=k.split('|');
    if(d!==date){keep[k]=S.sched[k];return}
    const n=+i;
    if(n===idx)return;
    keep[d+'|'+(n>idx?n-1:n)]=S.sched[k];
  });
  S.sched=keep;
  saveSchedule();
}
function addDay(){
  const inp=$('newDate');
  const v=inp&&inp.value;
  if(!v){toast('Pick a date first');return}
  const s=activeSchedule();
  if(s.some(d=>d.date===v)){toast('That day is already in the plan');return}
  s.push({date:v,rest:false,items:[]});
  s.sort((a,b)=>a.date<b.date?-1:1);
  saveSchedule();toast('Day added');
}
function delDay(di){
  const s=activeSchedule();
  if(!s[di])return;
  const date=s[di].date;
  s.splice(di,1);
  Object.keys(S.sched).forEach(k=>{if(k.split('|')[0]===date)delete S.sched[k]});
  saveSchedule();toast('Day removed');
}
function nextFreeDate(){
  const s=activeSchedule();
  if(!s.length)return todayISO();
  const last=s[s.length-1].date;
  const d=new Date(last+'T00:00:00');
  d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function resetSchedule(){
  showModal(`<h3>Reset the schedule?</h3>
   <p>This restores the original plan and clears every done / missed mark on it. Your answers, highlights and review deck are not affected.</p>
   <div class="modal-actions">
     <button class="btn sec" onclick="closeModal()">Cancel</button>
     <button class="btn" style="background:var(--bad);border-color:var(--bad)" onclick="doResetSchedule()">Reset</button>
   </div>`);
}
function doResetSchedule(){
  S.schedule=defaultSchedule();S.sched={};
  save();closeModal();render();toast('Schedule reset');
}

/* ============ SEARCH ============ */
function doSearch(){
  const v=$('search').value.trim().toLowerCase();
  const box=$('results');
  if(v.length<2){box.classList.remove('show');return}
  const hits=[];
  for(const q of QUESTIONS){
    const hay=(q.stem+' '+((q.options||[]).join(' '))+' '+(q.type==='case'?(q.answer||'')+' ':'')+(q.explanation||'')+' '+(q.objective||'')+' '+chapterName(q.chapter)).toLowerCase();
    const idx=hay.indexOf(v);
    if(idx>=0)hits.push({kind:'q',q:q,idx:idx});
    if(hits.length>=40)break;
  }
  const thits=[];
  Object.keys(THEORY).forEach(ch=>{
    (THEORY[ch].sections||[]).forEach(s=>{
      const hay=(s.h+' '+(s.body||'')+' '+JSON.stringify(s.table||'')+' '+JSON.stringify(s.flow||'')).toLowerCase();
      const idx=hay.indexOf(v);
      if(idx>=0)thits.push({kind:'t',ch:ch,sec:s,idx:idx});
    });
  });
  thits.sort((a,b)=>a.idx-b.idx);
  hits.sort((a,b)=>a.idx-b.idx);
  if(!hits.length&&!thits.length){
    box.innerHTML='<div class="res-empty">Nothing matched \u2014 try a shorter term. Search covers questions, explanations and the notes.</div>';
    box.classList.add('show');return;
  }
  let h='';
  thits.slice(0,5).forEach(t=>{
    h+=`<div class="res-item" onclick="jumpTheory('${t.ch}','${t.sec.id}')">
      <div class="res-tag" style="color:var(--neuro)">&#128218; Notes \u00b7 ${esc(chapterName(t.ch))}</div>
      <div class="res-txt"><b>${esc(t.sec.h)}</b></div></div>`;
  });
  hits.slice(0,12).forEach(({q})=>{
    const m=moduleOf(q.module)||{hex:'#7a6a55'};
    h+=`<div class="res-item" onclick="jump('${q.id}')">
      <div class="res-tag" style="color:${m.hex}">${esc(chapterName(q.chapter))}</div>
      <div class="res-txt">${esc(q.stem.slice(0,130))}\u2026</div></div>`;
  });
  const more=(hits.length-12)+(thits.length-5);
  if(more>0)h+=`<div class="res-empty">+${more} more</div>`;
  box.innerHTML=h;box.classList.add('show');
}
function jumpTheory(ch,sec){
  $('search').value='';$('results').classList.remove('show');
  const mod=(QUESTIONS.find(q=>q.chapter===ch)||{}).module||'pediatrics';
  go({name:'theory',mod:mod,ch:ch,sec:sec});
}

/* ============================================================================
   THE CLEPSYDRA — the study companion.

   A κλεψύδρα is the Alexandrian water clock, so she is a clock, and she wears
   a laurel. She keeps the session timer, and she explains whatever screen she
   is standing on. Everything she states about the app is computed here from
   the same data the screen is built from — she must never be able to drift out
   of date with what the app actually does.

   Where she lives is a DEVICE preference, like the theme: which corner suits
   you depends on the screen you are looking at, not on who is studying. So her
   position, her mute and her collapsed state sit in their own localStorage key
   and are deliberately not synced.
   ============================================================================ */
const CLKEY='wardround.clep';
const CLEP={on:false,mini:false,muted:false,pos:null,posQ:null,seen:{},
            typer:null,hideT:null,glT:null,tickT:null,lastSay:0,idleT:null,
            pose:null,swapT:null,settleT:null,shiftT:null};

/* ---- the figure, in nine poses ------------------------------------------
   THE USER'S OWN ARTWORK, not a drawing of it. Nine poses supplied on
   2026-08-02, cut out of their white sheet and landed on one shared 360x360
   canvas — see CLAUDE.md for the cutout and the alignment, and why a colour
   threshold cannot do either.

   She faces the viewer in all nine and wears her own gold wreath. That
   retired two earlier pieces of work: the CSS stephane (she has a real crown
   now) and the note that she could not be turned to face the reader.

   An <img> is NOT CORS-blocked over file:// the way a font or an ES module
   is, so a relative path works from a double-clicked copy. Only the bundler
   turns these into data: URIs, because a single file has no assets/ folder —
   which is why the filename is a VALUE in this map rather than being built
   inline, exactly as MOD_ART is.
   ------------------------------------------------------------------------ */
const CLEP_POSES={
  waving:'waving', welcoming:'welcoming', talking:'talking', pointing:'pointing',
  thinking:'thinking', surprised:'surprised', dancing:'dancing',
  jumping:'jumping', presenting:'presenting'
};
const CL_REST='waving';
function poseSrc(p){ return `assets/clep/${CLEP_POSES[p]||CLEP_POSES[CL_REST]}.png`; }

/* Which pose belongs to which screen. Anything not named here falls back to
   CL_REST, so a view added later cannot throw. */
const CL_POSE_VIEW={
  home:'welcoming', module:'pointing', theory:'pointing', flagged:'pointing',
  moved:'pointing', schedule:'presenting', session:'presenting',
  quiz:'thinking', mock:'thinking', review:'thinking'
};
/* The rest poses she drifts between when nothing is happening. Kept to the two
   that read as "waiting" — the expressive ones are reserved for events, or
   they stop meaning anything. */
const CL_IDLE_POSES=['waving','welcoming'];

/* Every pose is fetched once, up front. Without this the first swap to a pose
   shows an EMPTY frame while the file loads — the ghost has already faded and
   the incoming image has no pixels yet. Decoding costs nothing later. */
function clepPreload(){
  Object.keys(CLEP_POSES).forEach(p=>{ const i=new Image(); i.src=poseSrc(p); });
}
function clepFigure(){
  return `<img class="cl-fig cl-main" id="clepFig" src="${poseSrc(CL_REST)}"
            alt="" draggable="false" width="360" height="360">`+
         /* the ghost carries a src from the start: an <img> with none draws a
            broken-image glyph in the corner, which is what shipped for one
            render before a screenshot caught it */
         `<img class="cl-fig cl-ghost" id="clepGhost" src="${poseSrc(CL_REST)}"
            alt="" aria-hidden="true" draggable="false" width="360" height="360">`;
}

/* ---- changing pose ------------------------------------------------------
   The swap is hidden inside a glitch burst rather than cross-faded: she is a
   projection, and a projection that changes should fail and re-form. The
   outgoing frame is copied into the ghost so it can be torn apart while the
   new one comes up underneath it; both animations live in CSS.

   Restarting the animation needs the class removed, a forced reflow, and the
   class added again — without the reflow the browser coalesces the two style
   changes and a second swap inside .46s simply does nothing. */
const CL_SWAP_MS=460;
function clepPose(name,opt){
  opt=opt||{};
  const el=$('clep'), fig=$('clepFig'), gh=$('clepGhost');
  if(!el||!fig)return;
  const p=CLEP_POSES[name]?name:CL_REST;
  if(p===CLEP.pose&&!opt.force)return;
  const prev=CLEP.pose||CL_REST;
  CLEP.pose=p;
  /* collapsed or hidden: no one can see her, so just hold the state */
  if(el.hidden||CLEP.mini){ fig.src=poseSrc(p); return }
  if(clepReduced()){ fig.src=poseSrc(p); return }   /* cut, no tear */
  if(gh)gh.src=poseSrc(prev);
  fig.src=poseSrc(p);
  el.style.setProperty('--cl-band-y',(10+Math.random()*70).toFixed(0)+'%');
  el.classList.remove('swap','gl');
  void el.offsetWidth;                               /* reflow — see above */
  el.classList.add('swap','gl');
  clearTimeout(CLEP.swapT);
  CLEP.swapT=setTimeout(()=>{ el.classList.remove('swap','gl') },CL_SWAP_MS);
}
/* The pose the current screen asks for. Used to settle her back after an
   event pose, so "she reacted" always returns to "she is here with you". */
/* guarded: clepShow() can run before `view` exists on a cold boot, and an
   undefined global there would throw inside the mount rather than degrade */
function clepViewPose(){
  try{ return CL_POSE_VIEW[clepViewKey()]||CL_REST }catch(e){ return CL_REST }
}
function clepSettle(ms){
  clearTimeout(CLEP.settleT);
  CLEP.settleT=setTimeout(()=>clepPose(clepViewPose()),ms||2600);
}
function clepMiniDial(){
  return `<svg viewBox="0 0 24 24" width="21" height="21" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="9" stroke="var(--cl-1)" stroke-width="1.8"/>
    <path d="M12 7.2V12l3.2 2.1" stroke="var(--cl-w)" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}

/* ---- device preferences ------------------------------------------------- */
function clepLoadCfg(){
  try{
    const o=JSON.parse(localStorage.getItem(CLKEY)||'null');
    /* posQ is the question screens' own spot and is read separately: an older
       stored value has only `pos`, and she should fall back to the new default
       corner there rather than inheriting the browsing one */
    if(o){CLEP.mini=!!o.mini;CLEP.muted=!!o.muted;CLEP.pos=o.pos||null;CLEP.posQ=o.posQ||null}
  }catch(e){}
}
function clepSaveCfg(){
  try{localStorage.setItem(CLKEY,JSON.stringify(
    {mini:CLEP.mini,muted:CLEP.muted,pos:CLEP.pos,posQ:CLEP.posQ}))}catch(e){}
}
const clepReduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---- mounting ----------------------------------------------------------- */
function clepMount(){
  const el=$('clep');
  if(!el||el.dataset.built)return;
  el.dataset.built='1';
  el.innerHTML=`
  <div class="cl-col">
    <div class="cl-say" id="clepSay">
      <button class="cl-x" onclick="clepDismiss()" aria-label="Dismiss">&times;</button>
      <span id="clepTxt"></span>
    </div>
    <div class="cl-hud" id="clepHud"></div>
    <div class="cl-tools">
      <button class="cl-tool" onclick="clepAsk()" title="What is this screen?" aria-label="Explain this screen">?</button>
      <button class="cl-tool" id="clepMuteBtn" onclick="clepMute()"></button>
      <button class="cl-tool" onclick="clepMini()" title="Collapse" aria-label="Collapse">&minus;</button>
    </div>
  </div>
  <div class="cl-body" id="clepBody" role="button" tabindex="0" aria-label="Clepsydra — ask about this screen">
    <div class="cl-stage">${clepFigure()}</div>
    <span class="cl-base"></span>
    <span class="cl-scan"></span><span class="cl-band"></span>
  </div>
  <button class="cl-mini" onclick="clepMini()" aria-label="Bring the Clepsydra back">
    ${clepMiniDial()}<span id="clepMiniT">Clepsydra</span></button>`;
  const b=$('clepBody');
  b.addEventListener('pointerdown',clepDrag);
  b.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();clepAsk()}
  });
  addEventListener('resize',clepPlace);
  clepPaintTools();
  clepPreload();
}
function clepShow(){
  clepMount();
  const el=$('clep'); if(!el)return;
  CLEP.on=true; el.hidden=false;
  el.classList.toggle('mini',CLEP.mini);
  clepPlace(); clepGlitchLoop(); clepPaint(); clepIdleLoop(); clepShiftLoop();
  /* arrive in the pose this screen asks for, without a tear — there is no
     previous pose to fail out of */
  CLEP.pose=clepViewPose();
  const fig=$('clepFig'); if(fig)fig.src=poseSrc(CLEP.pose);
}
function clepHide(){
  CLEP.on=false;
  const el=$('clep'); if(el)el.hidden=true;
  clearTimeout(CLEP.glT); clearTimeout(CLEP.idleT);
  clearTimeout(CLEP.shiftT); clearTimeout(CLEP.settleT); clearTimeout(CLEP.swapT);
}

/* ---- where she stands ---------------------------------------------------
   She keeps TWO spots, not one. On the question screens Skip and Next are
   pinned to the right edge of the card and she was covering them, so there she
   docks bottom-LEFT; everywhere else she keeps her usual bottom-right corner.
   Two remembered positions rather than one, because a single one would mean
   dragging her anywhere on a browse screen puts her back over the buttons the
   next time a question opens. Both are device preferences, like the theme. */
const CL_LEFT_VIEWS=['quiz','mock','review'];
/* guarded the same way clepViewPose() is: clepPlace() can run before `view`
   exists on a cold boot */
function clepOnLeft(){
  try{ return CL_LEFT_VIEWS.includes(view.name) }catch(e){ return false }
}
function clepPlace(){
  const el=$('clep'); if(!el||el.hidden)return;
  const left=clepOnLeft();
  el.classList.toggle('left',left);
  const p=left?CLEP.posQ:CLEP.pos;
  if(!p){
    el.style.left=el.style.top=el.style.right=el.style.bottom='';
    if(left)clepClearRail(el);
    return;
  }
  /* clamped every time, not just on drag: a window that shrank between visits
     would otherwise leave her parked off-screen with no way back */
  const w=el.offsetWidth||160, h=el.offsetHeight||140;
  const x=Math.min(Math.max(p.x,6),Math.max(6,innerWidth-w-6));
  const y=Math.min(Math.max(p.y,6),Math.max(6,innerHeight-h-6));
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.right='auto'; el.style.bottom='auto';
}
/* ⚠️ The window's bottom-left corner IS THE RAIL — 238px wide and full height —
   and moving her onto it would only trade one covered control for another. The
   rail is fixed too, so unlike an overlap with the question card that one
   cannot be scrolled out of the way: the links would be under her for good.
   Measured, not assumed: docked at the window edge at 1440x760 she landed on
   Review deck and Mock exam.

   So the left dock is the RAIL'S right edge, not the window's — the bottom-left
   of the reading column. Asked of the element rather than encoded as a
   breakpoint, because the rail slides off-canvas below 860px and there the bare
   window edge is right again; one geometry test covers both.

   Collapsed counts too. The pill looked small enough to be exempt and is not:
   measured at 1366x768 it sat on Review deck. .cl-body is display:none then, so
   its rect is all zeros — which reads as "at the window edge" and moves the
   pill for the same reason, with no special case needed. */
function clepClearRail(el){
  const nav=$('nav'), body=el.querySelector('.cl-body');
  if(!nav||!body)return;
  const r=nav.getBoundingClientRect();
  if(r.right<=body.getBoundingClientRect().left)return;   /* off-canvas, or clear */
  el.style.left=Math.round(r.right+12)+'px';
  el.style.right='auto';
}
function clepDrag(e){
  if(e.button!==undefined&&e.button!==0)return;
  const el=$('clep');
  const r=el.getBoundingClientRect();
  const ox=e.clientX-r.left, oy=e.clientY-r.top;
  let moved=false;
  try{e.target.setPointerCapture(e.pointerId)}catch(err){}
  const mv=ev=>{
    if(!moved&&Math.abs(ev.clientX-e.clientX)+Math.abs(ev.clientY-e.clientY)>4){
      moved=true; el.classList.add('drag');
    }
    if(!moved)return;
    /* the drag writes to whichever of the two spots this screen is using */
    const at={x:ev.clientX-ox,y:ev.clientY-oy};
    if(clepOnLeft())CLEP.posQ=at; else CLEP.pos=at;
    clepPlace();
  };
  const up=()=>{
    e.target.removeEventListener('pointermove',mv);
    e.target.removeEventListener('pointerup',up);
    e.target.removeEventListener('pointercancel',up);
    el.classList.remove('drag');
    /* a press that never moved is a tap, and a tap asks her a question */
    if(moved)clepSaveCfg(); else clepAsk();
  };
  e.target.addEventListener('pointermove',mv);
  e.target.addEventListener('pointerup',up);
  e.target.addEventListener('pointercancel',up);
}

/* ---- controls ----------------------------------------------------------- */
function clepMini(){
  CLEP.mini=!CLEP.mini; clepSaveCfg();
  const el=$('clep'); if(el)el.classList.toggle('mini',CLEP.mini);
  if(CLEP.mini)clepDismiss();
  clepPlace(); clepPaint();
}
function clepMute(){
  CLEP.muted=!CLEP.muted; clepSaveCfg(); clepPaintTools();
  if(CLEP.muted){clepDismiss(); toast('The Clepsydra will keep quiet 🤫')}
  else clepSay('Back with you. Tap me on any screen and I will explain it.',{force:true});
}
function clepPaintTools(){
  const b=$('clepMuteBtn'); if(!b)return;
  b.textContent=CLEP.muted?'🔈':'🔇';
  b.title=CLEP.muted?'Let her talk':'Quiet her';
  b.setAttribute('aria-label',b.title);
}

/* ---- speech ------------------------------------------------------------- */
/* Typed out, because a projection that assembles itself reads as one. The text
   is split on ** first so bold survives a partial reveal — revealing rendered
   HTML character by character would slice a tag in half. */
function clepSegs(s){
  const out=[];
  s.split('**').forEach((part,k)=>{ if(part)out.push({b:k%2===1,t:part}) });
  return out;
}
function clepPartial(segs,n){
  let left=n,h='';
  for(const s of segs){
    if(left<=0)break;
    const t=s.t.slice(0,left); left-=t.length;
    h+=s.b?`<b>${esc(t)}</b>`:esc(t);
  }
  return h;
}
function clepSay(text,opt){
  opt=opt||{};
  if(!CLEP.on||!text)return;
  if((CLEP.muted||CLEP.mini)&&!opt.force)return;
  const box=$('clepSay'), t=$('clepTxt');
  if(!box||!t)return;
  clearTimeout(CLEP.hideT); clearInterval(CLEP.typer);
  CLEP.lastSay=Date.now();
  const segs=clepSegs(text);
  const total=segs.reduce((n,s)=>n+s.t.length,0);
  box.classList.add('show');
  if(clepReduced()){ t.innerHTML=clepPartial(segs,total); }
  else{
    const step=Math.max(1,Math.ceil(total/90));   /* always lands inside ~1.4s */
    let n=0;
    t.innerHTML='';
    CLEP.typer=setInterval(()=>{
      n+=step;
      t.innerHTML=clepPartial(segs,n);
      if(n>=total)clearInterval(CLEP.typer);
    },16);
  }
  const dwell=Math.min(15000,Math.max(4500,2600+total*46));
  CLEP.hideT=setTimeout(clepDismiss,dwell);
  /* She turns to speak. The swap carries its own burst, so the bare flicker
     that used to fire here would be a second, overlapping one. */
  clearTimeout(CLEP.settleT);
  if(opt.pose!==false)clepPose('talking');
  else if(!clepReduced())clepGlitchBurst(120);
}
function clepDismiss(){
  clearInterval(CLEP.typer); clearTimeout(CLEP.hideT);
  const box=$('clepSay'); if(box)box.classList.remove('show');
  /* back to whatever this screen asks for, so "she said something" always
     resolves rather than leaving her mid-gesture */
  if(CLEP.pose==='talking')clepSettle(900);
}

/* ---- the glitch --------------------------------------------------------- */
/* Randomised in JS rather than left to a keyframe loop: a fault on a fixed
   cadence reads as an animation, which is the opposite of the intention. */
function clepGlitchBurst(ms){
  const el=$('clep');
  if(!el||el.hidden||clepReduced())return;
  el.style.setProperty('--cl-band-y',(6+Math.random()*82).toFixed(0)+'%');
  el.classList.add('gl');
  setTimeout(()=>el.classList.remove('gl'),ms||(90+Math.random()*170));
}
function clepGlitchLoop(){
  clearTimeout(CLEP.glT);
  if(!CLEP.on||clepReduced())return;
  CLEP.glT=setTimeout(()=>{ clepGlitchBurst(); clepGlitchLoop() },2400+Math.random()*7600);
}

/* ---- what she knows ----------------------------------------------------- */
/* Every line is generated from the same data the screen renders from, so a
   number she quotes cannot disagree with the number on the page. */
function clepChapterCount(){
  return MODULES.reduce((n,m)=>n+m.groups.reduce((k,g)=>k+g.chapters.length,0),0);
}
/* Kept deliberately short (user's request, 2026-08-02): same facts, fewer
   words. A companion who talks past the second line stops being read. */
const CL_TIPS={
  home(){
    const due=dueNow().length, done=QUESTIONS.filter(q=>isAnswered(q.id)).length;
    return `**${done}** of **${QUESTIONS.length}** answered. `+
      (due?`**${due}** due for review — what the spacing algorithm says you are about to forget.`
         :`Nothing due for review today.`);
  },
  module(){
    return `Chapters. Greyed ones are on the syllabus with nothing transcribed yet — kept visible so the `+
      `course's shape is. **Source** chips filter by question bank.`;
  },
  quiz(){
    return `Answer, check, then say how sure you were — honestly: a right answer you call a **guess** still `+
      `enters review. **A**–**E** pick, **Enter** checks, **F** flags, **1**–**4** highlight, **0** erases.`;
  },
  theory(){
    return `Notes written backwards from the questions — shaped around what examiners keep asking, not `+
      `around a textbook's ordering.`;
  },
  schedule(){
    return `Your plan, day by day. Mark a subject **missed** and it moves to a catch-up slot on a free day. `+
      `Nothing else shifts.`;
  },
  moved(){
    return `Everything you marked missed, and where it landed. **No slot left** means the plan has run out `+
      `of room before the exam.`;
  },
  review(){
    return `Wrong answers, plus right ones you called a guess. They return after 1, 3, 7, 21 and 60 days — `+
      `right moves one step out, wrong goes back to the start.`;
  },
  flagged(){
    return `Whatever you parked with **F**, right or wrong.`;
  },
  mock(){
    return `Exam conditions: your modules, your length, random order, explanations held until you finish.`;
  },
  session(){
    return `Set a block and I keep the time. I follow you into every other screen while it runs.`;
  }
};
function clepFacts(){
  const s=sess();
  const out=[
    `**${QUESTIONS.length}** questions across **${clepChapterCount()}** chapters, and more as the banks are transcribed.`,
    `Every question names its bank and the page it came from — the pill under the explanation.`,
    `A **κλεψύδρα** is a water clock. Alexandria kept time with them; I keep yours.`,
    `Progress saves after every answer, with dated snapshots behind the shield. Nothing to press.`,
    `**/** jumps to search. **J** inside a quiz jumps to a question by number.`,
    `**T** flips parchment and night. Until you pick, the app follows your system.`,
    `The whole app runs offline, from the file itself.`,
    `Question order is hashed from each id — identical on every device, and new questions land in the middle rather than on the end.`
  ];
  if(s)out.push(`**${clMMSS(phaseLeft())}** left in this block. I will say when it turns.`);
  return out;
}
const clPick=a=>a[Math.floor(Math.random()*a.length)];

function clepViewKey(){ return view.name==='module'?'module':(view.name||'home') }
function clepTip(){
  const f=CL_TIPS[clepViewKey()];
  return f?f():null;
}
/* Tapping her always re-explains; the automatic version only fires once per
   screen per visit, which is the line between a companion and a nag. */
function clepAsk(){
  if(CLEP.mini){clepMini();return}
  const t=clepTip();
  clepSay(t||clPick(clepFacts()),{force:true});
}
let _clLastView='';
function clepOnView(){
  const k=clepViewKey()+(view.name==='module'?':'+view.id:'');
  if(k===_clLastView)return;
  _clLastView=k;
  /* The pose follows the screen even when she is muted: muting silences her,
     it does not freeze her. It sits ABOVE the mute check for that reason. */
  clearTimeout(CLEP.settleT);
  clepPose(clepViewPose());
  if(!CLEP.on||CLEP.muted||CLEP.mini)return;
  const seenKey=clepViewKey();
  if(CLEP.seen[seenKey])return;
  CLEP.seen[seenKey]=1;
  const t=clepTip();
  if(t)setTimeout(()=>clepSay(t),620);   /* let the page entrance land first */
}
/* Idle chatter is the one thing held back from the reading screens. A tip you
   asked for by arriving is welcome mid-question; an unprompted aside about the
   app is not. */
function clepIdleLoop(){
  clearTimeout(CLEP.idleT);
  if(!CLEP.on)return;
  CLEP.idleT=setTimeout(()=>{
    if(CLEP.on&&!CLEP.muted&&!CLEP.mini&&!STILL_VIEWS.includes(view.name)
       &&Date.now()-CLEP.lastSay>200000){
      clepSay(clPick(clepFacts()));
    }
    clepIdleLoop();
  },240000);
}
/* Ambient pose drift, separate from the idle chatter above and much more
   frequent — she shifts her weight between the two resting poses so the corner
   is not a still image, but she never does it on a reading screen, mid-speech,
   or while an event pose is on display. Those three guards are what keep it
   from becoming noise beside a clinical stem. */
function clepShiftLoop(){
  clearTimeout(CLEP.shiftT);
  if(!CLEP.on||clepReduced())return;
  CLEP.shiftT=setTimeout(()=>{
    if(CLEP.on&&!CLEP.mini&&!STILL_VIEWS.includes(view.name)
       &&CL_IDLE_POSES.includes(CLEP.pose)
       &&Date.now()-CLEP.lastSay>9000){
      clepPose(clPick(CL_IDLE_POSES.filter(p=>p!==CLEP.pose)));
    }
    clepShiftLoop();
  },26000+Math.random()*44000);
}

/* ---- the readout -------------------------------------------------------- */
function clMMSS(ms){
  const s=Math.max(0,Math.round(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function clepPaint(){
  const el=$('clep'); if(!el||el.hidden)return;
  const s=sess();
  el.classList.toggle('timed',!!s);
  const hud=$('clepHud'), mt=$('clepMiniT');
  if(s){
    const rest=s.phase==='break';
    const label=s.paused?'Paused':(rest?'Break':'Focus');
    if(hud){
      hud.classList.toggle('rest',rest);
      hud.innerHTML=`<span class="ph">${label}</span>${clMMSS(phaseLeft())}`;
    }
    if(mt)mt.textContent=clMMSS(phaseLeft());
    /* The minute hand used to wind down here, one full turn per block. The
       artwork has no hands, so the block's progress now lives only in the HUD
       pill and the ring on the session screen. */
  }else{
    if(hud)hud.innerHTML='';
    if(mt)mt.textContent='Clepsydra';
  }
}

/* ============================================================================
   STUDY SESSIONS

   Every time is stored as a TIMESTAMP, never as "seconds remaining". A phone
   that sleeps, a laptop lid, a reload — all of them stop a countdown that is
   decremented by a timer, and none of them touch a clock that is recomputed
   from when the block started. `lost` accumulates paused time so a pause does
   not silently eat the block.
   ============================================================================ */
const SESS_MAX=12;                     /* cycles; a sanity bound, not a policy */
let sessDraft={focus:25,brk:5,cycles:4,scope:'all'};

function sess(){ return (S.sess&&!S.sess.done)?S.sess:null }
function phaseMs(){
  const s=sess(); if(!s)return 0;
  return (s.phase==='focus'?s.plan.focus:s.plan.brk)*60000;
}
function phaseElapsed(){
  const s=sess(); if(!s)return 0;
  const now=s.paused?s.pausedAt:Date.now();
  return Math.max(0,now-s.phaseStart-(s.lost||0));
}
function phaseLeft(){ return Math.max(0,phaseMs()-phaseElapsed()) }

/* Answered DURING the session, read off the answer timestamps rather than
   counted as we go — so it survives a reload, and a question answered in a
   quiz opened before the session started is correctly not counted. */
function sessStats(s){
  let n=0,ok=0;
  Object.keys(S.answers||{}).forEach(id=>{
    const a=S.answers[id];
    if(a&&a.at&&a.at>=s.startedAt){n++; if(a.ok)ok++}
  });
  return {n:n,ok:ok,acc:n?Math.round(ok/n*100):null};
}
function sessFocusMs(s){
  return (s.focusMs||0)+(s.phase==='focus'?phaseElapsed():0);
}

function startSession(o){
  S.sess={
    startedAt:Date.now(), phase:'focus', phaseStart:Date.now(), lost:0, focusMs:0,
    cycle:1, plan:{focus:o.focus,brk:o.brk,cycles:Math.min(o.cycles,SESS_MAX)},
    scope:o.scope||'all', paused:false, pausedAt:0
  };
  save(); sessStartTick(); clepPaint();
  /* pose:false — startQuiz is about to move her to the quiz screen's pose,
     and a turn-to-talk in between would be a third swap in under a second */
  clepSay(`**${o.focus} minutes.** I have the clock — go.`,{force:true,pose:false});
  /* Starting a session should start the studying, not just the timer. */
  const ids=sessScopeIds(o.scope);
  if(ids.length)startQuiz(ids,sessScopeName(o.scope));
  else render();
}
function sessScopeIds(scope){
  if(scope==='review')return dueNow().map(q=>q.id);
  if(scope==='flagged')return QUESTIONS.filter(q=>S.flags[q.id]).map(q=>q.id);
  const m=MODULES.find(x=>x.id===scope);
  if(m){
    const all=qsInModule(m.id);
    const un=all.filter(q=>!isAnswered(q.id));
    return (un.length?un:all).map(q=>q.id);
  }
  return [];
}
function sessScopeName(scope){
  if(scope==='review')return 'Session — review due';
  if(scope==='flagged')return 'Session — flagged';
  const m=MODULES.find(x=>x.id===scope);
  return m?`Session — ${m.name}`:'Session';
}
function sessPause(){
  const s=sess(); if(!s)return;
  if(s.paused){ s.lost=(s.lost||0)+(Date.now()-s.pausedAt); s.paused=false; s.pausedAt=0 }
  else{ s.paused=true; s.pausedAt=Date.now() }
  save(); clepPaint(); paintSessionLive();
}
function sessSkip(){ advancePhase(true) }
function advancePhase(manual){
  const s=sess(); if(!s)return;
  if(s.phase==='focus'){
    s.focusMs=(s.focusMs||0)+phaseElapsed();
    if(s.cycle>=s.plan.cycles){ endSession(true); return }
    s.phase='break'; s.phaseStart=Date.now(); s.lost=0; s.paused=false; s.pausedAt=0;
    clepSay(manual?`Break early, then. **${s.plan.brk} minutes.**`
                  :`Block ${s.cycle} done. **${s.plan.brk} minutes** — stand up, find a window.`,{force:true});
  }else{
    s.cycle++; s.phase='focus'; s.phaseStart=Date.now(); s.lost=0; s.paused=false; s.pausedAt=0;
    clepSay(`Block **${s.cycle}/${s.plan.cycles}**. ${s.plan.focus} minutes.`,{force:true});
  }
  save(); clepGlitchBurst(420); clepPaint();
  if(view.name==='session')render(); else paintSessionLive();
}
function endSession(completed){
  const s=S.sess; if(!s)return;
  const st=sessStats(s), mins=Math.round(sessFocusMs(s)/60000);
  S.sessLog=(S.sessLog||[]);
  S.sessLog.unshift({
    start:s.startedAt, end:Date.now(), cycles:s.cycle, focusMin:mins,
    answered:st.n, correct:st.ok, scope:s.scope, completed:!!completed
  });
  S.sessLog=S.sessLog.slice(0,80);
  S.sess=null; save(); sessStopTick(); clepPaint();
  /* finishing the set she timed is worth a jump; stopping early is not.
     The pose carries its own burst, so the bare one that was here is gone. */
  clepPose(completed?'jumping':'presenting'); clepSettle(4200);
  clepSay(completed
    ? `Set complete: **${mins} min**, **${st.n}** questions${st.acc!==null?` at **${st.acc}%**`:''}.`
    : `Stopped. **${mins} min**, **${st.n}** questions logged.`,
    {force:true,pose:false});   /* pose:false — she is mid-jump, do not turn her */
  render();
}
/* One second is enough: nothing here animates off this timer, it only repaints
   two numbers and a ring. It runs solely while a session exists. */
function sessStartTick(){
  sessStopTick();
  CLEP.tickT=setInterval(()=>{
    const s=sess(); if(!s){sessStopTick();return}
    if(!s.paused&&phaseLeft()<=0){advancePhase(false);return}
    clepPaint(); paintSessionLive();
  },1000);
}
function sessStopTick(){ clearInterval(CLEP.tickT); CLEP.tickT=null }

/* ============ MODALS / IO ============ */
function showModal(html,wide){const m=$('modal');m.innerHTML=html;if(m.classList){wide?m.classList.add('wide'):m.classList.remove('wide')}$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
function showShortcuts(){
  showModal(`<h3>⌨️ Shortcuts</h3>
   <div class="shortcuts">
     <span><span class="kbd">A</span>–<span class="kbd">E</span></span><span class="d">Pick an answer</span>
     <span><span class="kbd">Enter</span></span><span class="d">Check, then next</span>
     <span><span class="kbd">→</span> / <span class="kbd">←</span></span><span class="d">Next / previous</span>
     <span><span class="kbd">E</span></span><span class="d">Toggle explanation</span>
     <span><span class="kbd">F</span></span><span class="d">Flag question</span>
     <span><span class="kbd">J</span></span><span class="d">Jump to any question</span>
     <span><span class="kbd">1</span>–<span class="kbd">4</span></span><span class="d">Pick a highlighter colour</span>
     <span><span class="kbd">0</span></span><span class="d">Eraser</span>
     <span><span class="kbd">/</span></span><span class="d">Jump to search</span>
     <span><span class="kbd">T</span></span><span class="d">Light / dark mode</span>
     <span><span class="kbd">Esc</span></span><span class="d">Close</span>
   </div>
   <div class="modal-actions" style="margin-top:21px"><button class="btn go" onclick="closeModal()">Got it</button></div>`);
}
/* ============================================================================
   BACKUP — automatic.

   This replaced a pair of Export / Import buttons. The trouble with those is
   not that they did not work; it is that they only work if you remember to
   press them, and nobody presses Export the day before they need it.

   So: a dated snapshot is kept per profile, pruned to a size the browser will
   actually hold, and restored on its own when the live state is missing or
   unreadable. Everything else is one-click from the shield in the top bar.

   The one thing this deliberately does NOT do is second-guess a state that
   loads cleanly. "Your progress looks smaller than it did" is a judgement, and
   a wrong judgement here silently overwrites real work — so a thinner-but-valid
   state is left alone and offered in the list instead.

   Scope: this is a browser-local safety net. It survives a crash, a bad write
   and an accidental reset. It does NOT survive clearing browser data or moving
   to another machine — signing in is what covers those.
   ============================================================================ */
let bakTimer=null, bakLast=0, bakState='ok', bakRestored=0;
const BAK_MAX_BYTES=1500000;    /* localStorage gives ~5 MB; the live state and
                                   the profile list have to fit beside this */

function bakKey(){ return 'wardround.bak.'+((me&&me.id)||'local') }
function bakRead(){
  try{
    const o=JSON.parse(localStorage.getItem(bakKey())||'null');
    if(o&&Array.isArray(o.snaps))return o;
  }catch(e){}
  return {v:1,snaps:[]};
}
function bakWrite(box){
  try{
    localStorage.setItem(bakKey(),JSON.stringify(box));
    bakState='ok';
  }catch(e){
    /* out of room — drop back to the two most recent and try once more before
       admitting it. A backup that throws is worse than a shallow one. */
    try{
      box.snaps=box.snaps.slice(0,2);
      localStorage.setItem(bakKey(),JSON.stringify(box));
      bakState='ok';
    }catch(e2){ bakState='full' }
  }
  paintBakBtn();
}
/* Newest three always; then one per day for up to seven days; then whatever
   fits in the byte budget. Two survive the budget no matter what. */
function bakPrune(snaps){
  snaps.sort((a,b)=>b.at-a.at);
  const keep=[], days={};
  snaps.forEach((s,i)=>{
    if(i<3){keep.push(s);days[s.day]=1;return}
    if(!days[s.day]&&Object.keys(days).length<7){keep.push(s);days[s.day]=1}
  });
  const out=[]; let total=0;
  for(const s of keep){
    total+=s.json.length;
    if(total>BAK_MAX_BYTES&&out.length>=2)break;
    out.push(s);
  }
  return out;
}
function bakSnapshot(){
  if(!me)return;
  let json;
  try{ json=JSON.stringify(S) }catch(e){ return }
  const box=bakRead();
  /* nothing changed since the last one — do not spend a slot on a duplicate */
  if(box.snaps[0]&&box.snaps[0].json===json){ paintBakBtn(); return }
  box.snaps.unshift({at:Date.now(),day:todayISO(),json:json});
  box.snaps=bakPrune(box.snaps);
  bakWrite(box);
}
/* Debounced off save(): a burst of answers collapses into one snapshot, and
   after that at most one every four minutes. */
function bakSchedule(){
  if(bakTimer)return;
  const wait=Math.max(4000,240000-(Date.now()-bakLast));
  bakTimer=setTimeout(()=>{ bakTimer=null; bakLast=Date.now(); bakSnapshot() },wait);
}
function bakNewest(){
  const box=bakRead();
  const s=box.snaps[0];
  if(!s)return null;
  try{ return {at:s.at,state:JSON.parse(s.json)} }catch(e){ return null }
}
function bakWhen(ts){
  const d=Math.max(0,Date.now()-ts);
  if(d<90000)return 'just now';
  if(d<3600000)return Math.round(d/60000)+' min ago';
  if(d<86400000)return Math.round(d/3600000)+' h ago';
  const dd=new Date(ts);
  return dd.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' at '+
         dd.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function paintBakBtn(){
  const b=$('bakBtn'); if(!b)return;
  const box=bakRead(), n=box.snaps.length;
  b.innerHTML=ico('shield',17)+`<span class="bak-dot${bakState==='full'?' warn':''}"></span>`;
  b.title=bakState==='full'
    ? 'Backup — no room left in this browser'
    : (n?`Backup — ${n} snapshot${n===1?'':'s'}, newest ${bakWhen(box.snaps[0].at)}`
        :'Backup — nothing snapshotted yet');
  b.setAttribute('aria-label',b.title);
}
function showBackup(){
  const box=bakRead();
  const rows=box.snaps.map(s=>{
    const kb=Math.max(1,Math.round(s.json.length/1024));
    let n=0; try{ n=Object.keys(JSON.parse(s.json).answers||{}).length }catch(e){}
    return `<div class="bak-row">
      <span class="bak-when">${bakWhen(s.at)}</span>
      <span class="bak-meta">${n} answered · ${kb} KB</span>
      <button class="ed-t" onclick="bakConfirm(${s.at})">Restore</button>
    </div>`;
  }).join('');
  showModal(`<h3>${ico('shield',19)} Backup</h3>
   <p>Your progress saves the moment you answer, and a dated snapshot is kept automatically.
      ${bakState==='full'?'<b style="color:var(--bad)">This browser has run out of storage, so new snapshots are not being kept.</b>':'There is nothing for you to press.'}</p>
   ${rows?`<div class="bak-list">${rows}</div>`
         :`<p style="color:var(--ink-4)">No snapshots yet — the first one is taken a few seconds after your next answer.</p>`}
   <p style="font-size:12.5px;color:var(--ink-4);margin-top:14px">
     Snapshots live in this browser. They survive a crash or a bad write, but not clearing your
     browser data — sign in if you want your progress kept off this machine.</p>
   <div class="modal-actions" style="margin-top:18px">
     <button class="btn sec" onclick="exportData()">Download a copy</button>
     <button class="btn sec" onclick="document.getElementById('importFile').click()">Restore from a file</button>
     <button class="btn go" onclick="closeModal()">Close</button>
   </div>`,true);
}
function bakConfirm(at){
  const box=bakRead(), s=box.snaps.find(x=>x.at===at);
  if(!s){toast('That snapshot is gone');return}
  let n=0; try{ n=Object.keys(JSON.parse(s.json).answers||{}).length }catch(e){}
  const now=Object.keys(S.answers||{}).length;
  showModal(`<h3>Restore ${bakWhen(at)}?</h3>
   <p>That snapshot holds <b>${n}</b> answered question${n===1?'':'s'}. You currently have <b>${now}</b>.
      Restoring replaces what is on this device now.</p>
   ${n<now?`<p style="color:var(--warn)"><b>Note:</b> the snapshot has fewer answers than you have now,
      so this would lose ${now-n} of them.</p>`:''}
   <div class="modal-actions">
     <button class="btn sec" onclick="showBackup()">Back</button>
     <button class="btn go" onclick="bakRestore(${at})">Restore it</button>
   </div>`);
}
function bakRestore(at){
  const box=bakRead(), s=box.snaps.find(x=>x.at===at);
  if(!s){toast('That snapshot is gone');return}
  let st; try{ st=JSON.parse(s.json) }catch(e){ toast('That snapshot could not be read'); return }
  S=Object.assign({answers:{},flags:{},conf:{},sched:{},srs:{},days:{},hl:{},banks:{}},st);
  save(); closeModal(); render();
  toast('Restored your progress from '+bakWhen(at)+' ✅');
}

function exportData(){
  const blob=new Blob([JSON.stringify({v:2,saved:new Date().toISOString(),state:S},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`herophilus-progress-${todayISO()}.json`;a.click();
  toast('Progress downloaded 💾');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.state){S=Object.assign(S,d.state);save();render();toast('Progress restored ✅')}
      else toast('That file is not a progress export')
    }catch(err){toast('Could not read that file')}
  };
  r.readAsText(f);e.target.value='';
}
function toggleRail(){$('rail').classList.toggle('open')}
function closeRail(){$('rail').classList.remove('open')}

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){closeModal();$('results').classList.remove('show');return}
  if(e.key==='/'){e.preventDefault();$('search').focus();return}
  /* Global, so it works while reading theory as well as in a quiz. Safe above
     the quiz guard because typing targets bailed out at the top of the handler. */
  if(e.key==='t'||e.key==='T'){toggleTheme();return}
  if(view.name!=='quiz')return;
  const q=QUESTIONS.find(x=>x.id===Q.ids[Q.i]);
  if(!q)return;
  const k=e.key.toUpperCase();
  if('ABCDE'.includes(k)&&!Q.shown&&q.options){const i='ABCDE'.indexOf(k);if(i<q.options.length){pick(i);return}}
  if(k==='E'&&Q.shown){const b=document.querySelector('.ex-head');if(b)toggleExp(b);return}
  if('1234'.includes(e.key)){setPen(PENS[+e.key-1][0]);return}
  if(e.key==='0'){setPen('er');return}
  if(k==='J'){openJump();return}
  if(k==='F'){toggleFlag(q.id);return}
  if(e.key==='Enter'){e.preventDefault();Q.shown?navQ(1):(q.type==='case'?revealCase():reveal());return}
  if(e.key==='ArrowRight'){navQ(1);return}
  if(e.key==='ArrowLeft'){navQ(-1);return}
});
$('search').addEventListener('input',doSearch);
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('results').classList.remove('show')});

boot();
async function boot(){
  paintThemeBtn();          /* the icon depends on the theme the head script chose */
  clepLoadCfg();            /* where she stands is a device preference, like the theme */
  paintBakBtn();
  bootstrapProfiles();
  if(cloudEnabled()){
    showSplash('Restoring your session\u2026');
    let restored=false;
    try{
      restored=await Promise.race([
        restoreSession(),
        new Promise(r=>setTimeout(()=>r(false),15000))
      ]);
    }catch(e){}
    hideSplash();
    /* A restored session no longer means "straight into the app": afterSignIn()
       now hands off to gate step 2 so a profile is always chosen explicitly.
       Returning here is still right \u2014 that path has already drawn the gate. */
    if(restored)return;
  }else{
    hideSplash();
  }
  showGate();
}
</script>
